# O Render grátis "dorme" depois de 15 min sem acesso, e dormindo a busca automática de hora em hora não roda
# (os dias novos, como a virada do mês, só chegavam quando alguém abria o painel). Esta tarefa chama /saude
# a cada 10 min para o servidor continuar acordado. Um serviço sempre ligado usa ~744 h/mês (o grátis dá 750 h).
name: Manter o servidor acordado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /saude
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 90 https://analise-de-frota.onrender.com/saude; then exit 0; fi
            sleep 20
          done
          echo "o servidor não respondeu" && exit 1
