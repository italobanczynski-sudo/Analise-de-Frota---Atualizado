      const cel = (ls, n, rot) => (ls.length ? `<span style="display:flex;flex-direction:column;gap:2px"><b style="font-weight:600">${fmt(n, 0)} ${rot}</b><span class="apoio">${esc(periodosTxt(ls))}</span></span>` : '<span class="badge badge-vazio">Sem planilha</span>');
      const rem = E.clienteRemover === fc.id
        ? `<span class="apoio" style="margin-right:6px">Apaga também as planilhas.</span><button type="button" class="btn" data-acao="cliente-remover-cancelar">Cancelar</button> <button type="button" class="btn btn-destrutivo" data-acao="cliente-remover-confirmar">Excluir</button>`
        : `<a class="btn" href="#/cliente/${encodeURIComponent(fc.id)}" style="text-decoration:none">Abrir perfil e anexar planilhas</a> <button type="button" class="btn-link peq" data-acao="cliente-remover" data-id="${esc(fc.id)}">Excluir</button>`;
      return `<tr>
        <td><a href="#/cliente/${encodeURIComponent(fc.id)}" style="text-decoration:none"><span class="pessoa">${avatar(fc.nome, 32)}<span style="display:flex;flex-direction:column;min-width:0"><b style="font-weight:600">${esc(fc.nome)}</b>${fc.grupo ? `<span class="apoio">${esc(fc.grupo)}</span>` : ''}</span></span></a></td>
        <td>${cel(mot, nMot, nMot === 1 ? 'motorista' : 'motoristas')}</td>
        <td>${cel(vei, nVei, nVei === 1 ? 'veículo' : 'veículos')}</td>
        <td class="dir" style="white-space:nowrap">${rem}</td></tr>`;
    }).join('');
    return `
      ${abasConfig()}
      ${avisoLocal()}
      <span class="sub">Cadastre o cliente e abra o perfil dele para anexar as planilhas de motoristas e de veículos.${E.clientesEmDb ? ' O cadastro é compartilhado com quem tem acesso a este painel.' : ' O cadastro fica salvo só neste navegador.'}</span>
      <section class="card">
        <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Novo cliente</h2></div></div>
        <div class="card-corpo">
          <div class="grade-2" style="align-items:end">
            <div class="campo-bloco"><label class="campo-rotulo" for="cli-nome">Nome do cliente (empresa)</label><input class="campo" id="cli-nome" data-campo="cli-nome" value="${esc(f.nome)}" autocomplete="off" maxlength="120"></div>
            <div class="campo-bloco"><label class="campo-rotulo" for="cli-grupo">Grupo de veículos</label><input class="campo" id="cli-grupo" data-campo="cli-grupo" value="${esc(f.grupo)}" autocomplete="off" maxlength="120"></div>
          </div>

        ${E.clientes.length

  // ---------- Perfil do cliente: aqui se anexam as planilhas ----------
  function telaCliente() {
    const fc = focoPorSlug(E.rota.id);
    if (!fc) return `${abasConfig()}<section class="card"><div class="card-corpo"><div class="vazio"><span class="vazio-titulo">Cliente não encontrado</span><a class="btn" href="#/config" style="text-decoration:none">Voltar para Clientes</a></div></div></section>`;

    if (E.impCliSlug !== fc.id) { E.importacao = null; E.impVeic = null; E.cliApagar = null; E.impCliSlug = fc.id; }
    if (!E.perMot || E.perMot.cli !== nome) E.perMot = { cli: nome, editado: false };

          ${imp.avisos.map((e) => `<span class="alerta-texto">${esc(e)}</span>`).join('')}
          <div class="alerta-acoes">${verRel}</div></div></div>`;

    }
    let retornoVeic = '';
    if (impV) {

        ? `<div class="alerta alerta-ok" role="status"><span class="alerta-icone">✓</span><div class="alerta-corpo"><span class="alerta-titulo">Planilha de veículos anexada a ${esc(nome)}</span>
            <span class="alerta-texto">${impV.novas} linhas novas${impV.atualizadas ? ' e ' + impV.atualizadas + ' atualizadas' : ''} de ${esc(impV.nome)}.${impV.salvo ? '' : ' Ela não pôde ser guardada neste navegador.'}</span>
            ${impV.grupos && impV.grupos.length ? `<span class="alerta-texto"><b>${impV.grupos.length} grupo(s) reconhecido(s):</b> ${esc(impV.grupos.slice(0, 12).map((g) => g.nome + ' (' + g.n + ')').join(', '))}${impV.grupos.length > 12 ? '…' : ''}</span>` : ''}
            ${(impV.avisos || []).map((e) => `<span class="alerta-texto">${esc(e)}</span>`).join('')}
            <div class="alerta-acoes"><a class="btn-link peq" href="#/veiculos" data-acao="ver-cliente-veic" data-cli="${esc(nome)}">Ver veículos e grupos</a></div></div></div>`
        : `<div class="alerta alerta-erro" role="alert"><span class="alerta-icone">!</span><div class="alerta-corpo"><span class="alerta-titulo">Não foi possível ler ${esc(impV.nome)}</span>
            ${impV.erros.map((e) => `<span class="alerta-texto">${esc(e)}</span>`).join('')}</div></div>`;
    }
    const zona = (alvo, titulo, dica) => `<div class="dropzone" data-alvo="${alvo}" data-cli="${esc(nome)}">
            <span class="vazio-icone">${icone('subir', 15, '#5F6368')}</span>
            <span class="vazio-titulo">${titulo}</span>
            <span class="apoio" style="max-width:44ch">${dica}</span>
            <label class="btn btn-primario" style="margin-top:4px;position:relative;overflow:hidden">Escolher arquivo<input type="file" multiple accept=".xlsx,.xls,.csv,.txt,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" data-campo="arquivo-${alvo}" data-cli="${esc(nome)}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label>
          </div>`;
    const apagar = (alvo, rot, tem) => {
      if (!tem) return '';
      if (E.cliApagar === alvo) return `<div class="alerta alerta-erro" style="width:100%"><span class="alerta-icone">!</span><div class="alerta-corpo"><span class="alerta-titulo">Apagar ${rot} de ${esc(nome)}?</span>
          <span class="alerta-texto">${E.planEmDb ? 'Os dados deste cliente são apagados da base compartilhada, para todos que acessam o painel. Os dos outros clientes ficam.' : 'Só os dados deste cliente são apagados deste navegador. Os do outro cliente ficam.'}</span>
          <div class="alerta-acoes"><button type="button" class="btn" data-acao="cli-apagar-cancelar">Cancelar</button><button type="button" class="btn btn-destrutivo" data-acao="cli-apagar-confirmar">Apagar</button></div></div></div>`;
      return `<button type="button" class="btn btn-destrutivo" data-acao="cli-apagar-pedir" data-alvo="${alvo}">Apagar ${rot}</button>`;
    };
    const perMot = E.perMot;
    return `
      ${abasConfig()}
      <nav class="migalha" aria-label="Caminho"><a href="#/config">Clientes</a><span>›</span><span>${esc(nome)}</span></nav>
      <div class="entidade"><span class="pessoa">${avatar(nome, 44)}<span class="entidade-nome">${esc(nome)}</span></span></div>
      <div class="alerta alerta-atencao"><span class="alerta-icone">!</span><div class="alerta-corpo">
        <span class="alerta-titulo">Não inclua dados pessoais na planilha</span>
        <span class="alerta-texto">Deixe de fora CPF, telefone, e-mail e endereço. Nome (ou matrícula), placa e os indicadores bastam para a análise. ${E.planEmDb ? 'A planilha vai para a base compartilhada e fica visível a todos que acessam este painel.' : 'A planilha fica só neste navegador.'}</span>
      </div></div>
      ${retorno}
      ${retornoVeic}
      ${cartaoApi(nome)}
      <div class="grade-2">
        <section class="card"><div class="card-corpo" style="display:flex;flex-direction:column;gap:14px">
          <div class="campo-bloco"><span class="campo-rotulo">Período da planilha de motoristas</span>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <input type="date" class="campo" style="width:auto" data-campo="per-ini" value="${esc(perMot.ini || '')}" aria-label="Início do período">
              <span class="apoio">até</span>
              <input type="date" class="campo" style="width:auto" data-campo="per-fim" value="${esc(perMot.fim || '')}" aria-label="Fim do período">

            <span class="apoio">A exportação de Motoristas da plataforma não traz datas. Informe a que período ela se refere antes de anexar${vei.length ? ' (já veio da planilha de veículos deste cliente)' : ''}. Para comparar dia a dia, anexe uma planilha por dia, com início e fim no mesmo dia.</span></div>
          ${zona('motoristas', 'Planilha de motoristas de ' + esc(nome), 'Exportação de Motoristas da plataforma (.xlsx) ou CSV diário. Você pode escolher várias de uma vez; cada uma é somada às anteriores.')}
          ${zona('veiculos', 'Planilha de veículos de ' + esc(nome), 'Exportação de Veículos da plataforma (.xlsx) ou CSV. O período é lido da primeira linha da planilha. Alimenta Veículos e grupos.')}
          <button type="button" class="btn-link peq" data-acao="baixar-modelo" style="align-self:flex-start">Baixar modelo CSV diário (só cabeçalho)</button>
        </div></section>
        <section class="card">
          <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Dados anexados de ${esc(nome)}</h2></div></div>
          <div class="card-corpo">
            <div class="well">
              <div class="well-linha"><span class="well-k">Planilhas de motoristas</span><span class="well-v">${mot.length ? fmt(nMot, 0) + (nMot === 1 ? ' motorista' : ' motoristas') : 'Nenhuma planilha'}</span>${mot.length ? `<span class="apoio">${esc(periodosTxt(mot))}</span>` : ''}</div>
              <div class="well-linha"><span class="well-k">Planilhas de veículos</span><span class="well-v">${vei.length ? fmt(nVei, 0) + (nVei === 1 ? ' veículo' : ' veículos') : 'Nenhuma planilha'}</span>${vei.length ? `<span class="apoio">${esc(periodosTxt(vei))}${opcoesDim('grupo', true).length && ckey(E.cliente) === ckey(nome) ? ' · ' + opcoesDim('grupo', true).length + ' grupos' : ''}</span>` : ''}</div>
              <div class="well-linha"><span class="well-k">Linhas</span><span class="well-v">${fmt(mot.length, 0)} de motoristas · ${fmt(vei.length, 0)} de veículos</span></div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              ${mot.length || vei.length ? verRel : ''}
              ${apagar('motoristas', 'planilhas de motoristas', mot.length)}
              ${apagar('veiculos', 'planilhas de veículos', vei.length)}
            </div>
          </div>
        </section>
      </div>
      <section class="card">
        <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Formato diário (CSV): colunas</h2>
          <span class="h2-sub">Só para CSV feito à mão. As exportações da plataforma (motoristas e veículos) entram direto, sem ajuste. O nome da coluna pode variar; colunas a mais são ignoradas.</span></div></div>
        <div class="card-corpo"><div class="lista-cols">
          ${X.COLUNAS.map((col) => `<div class="linha"><span style="display:flex;flex-direction:column;gap:2px"><code>${col.key}</code><span class="apoio" style="font-size:11.5px">${esc(col.rotulo)} · ex.: ${esc(col.ex)}</span></span>
            ${col.obrig ? '<span class="badge badge-atencao">Obrigatória</span>' : '<span class="tag" style="height:22px">Opcional</span>'}</div>`).join('')}
        </div></div>
      </section>`;
  }

  // Apaga só os dados de um cliente (o do outro fica) e regrava o que sobrou
  function apagarDadosCliente(nome, alvo, silencioso) {
    const doApi = alvo === 'veiculos' ? 'odometro' : 'premiacao';   // o que veio da API acompanha o tipo de planilha
    apagarApiLocal(doApi, nome);
    if (planRef) {   // base compartilhada: some para todos; a tela já reflete e o snapshot confirma
      apagarPlanDb(alvo, nome);
      apagarPlanDb(doApi, nome);
      if (alvo === 'veiculos') { const resto = (E.veic ? E.veic.linhas : []).filter((l) => ckey(l.cliente) !== ckey(nome)); E.veic = resto.length ? Object.assign({}, E.veic, { linhas: resto }) : null; E.impVeic = null; E.veicVer++; baseVeicCache = null; reaplicarFiltro(); }
      else { const resto = (E.linhasAll || []).filter((l) => ckey(l.cliente) !== ckey(nome)); if (resto.length) { E.linhasAll = resto; aplicarFiltroCliente(); } else limparBase(); E.importacao = null; }
      E.cliApagar = null;
      if (!silencioso) { render(); toast('Planilhas de ' + nome + ' apagadas para todos.'); }
      return;
    }
    if (alvo === 'veiculos') {
      const resto = (E.veic ? E.veic.linhas : []).filter((l) => ckey(l.cliente) !== ckey(nome));
      if (!resto.length) { armazem.apagar(CHAVE_VEIC); E.veic = null; }
      else { E.veic = Object.assign({}, E.veic, { linhas: resto }); armazem.gravar(CHAVE_VEIC, JSON.stringify({ nome: E.veic.nome, arquivos: E.veic.arquivos, texto: X.paraCSV(resto.slice(), E.veic.colunas) })); }
      E.impVeic = null; E.veicVer++; baseVeicCache = null; reaplicarFiltro();
    } else {
      const resto = (E.linhasAll || []).filter((l) => ckey(l.cliente) !== ckey(nome));
      if (!resto.length) { armazem.apagar(CHAVE_CSV); limparBase(); }
      else { E.linhasAll = resto; armazem.gravar(CHAVE_CSV, JSON.stringify({ nome: rotuloArquivos(E.arquivos || []), arquivos: E.arquivos, texto: X.paraCSV(resto.slice(), E.colunasAll) })); aplicarFiltroCliente(); }
      E.importacao = null;
    }
    E.cliApagar = null;
    if (silencioso) return;
    render(); toast('Planilhas de ' + nome + ' apagadas.');
  }

  // Modal de exportação (seção 10: overlay, cartão 520px, cabeçalho e rodapé fixos)
  function painelExportacao() {
    const x = E.exportacao;
    if (!x) return '';
    const linhas = x.texto.split('\n').length - 1;
    return `<div class="modal-fundo" data-acao="export-fechar-fundo">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="export-titulo">
        <div class="modal-cab">
          <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
            <span class="modal-titulo" id="export-titulo">Exportar CSV</span>
            <span class="apoio">${esc(x.nome)} · ${linhas} linha(s). Copie e cole no Excel ou no Google Planilhas.</span>
          </div>
          <button type="button" class="btn-icone fantasma" data-acao="export-fechar" aria-label="Fechar">${icone('fechar', 14)}</button>
        </div>
        <div class="modal-corpo"><textarea id="export-texto" class="campo" readonly spellcheck="false" aria-label="Conteúdo CSV">${esc(x.texto)}</textarea></div>
        <div class="modal-rodape">
          <span class="apoio" role="status">${x.copiado ? '✓ Copiado para a área de transferência.' : ''}</span>
          <span style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn" data-acao="export-arquivo">${icone('baixar', 14)}Baixar arquivo</button>
            <button type="button" class="btn btn-primario" data-acao="export-copiar">Copiar CSV</button>
          </span>
        </div>
      </div>
    </div>`;

  // ---------- Render ----------
  function render() {
    garantirCliente();
    const ativo = document.activeElement;
    const foco = ativo && ativo.id ? { id: ativo.id, ini: ativo.selectionStart, fim: ativo.selectionEnd } : null;
    E.graficos = {};
    const telas = { visao: telaVisao, motoristas: telaMotoristas, detalhe: telaDetalhe, comparativo: telaComparativo, importar: telaClientes, cliente: telaCliente, clientes: telaClientes, veiculos: telaVeiculos, dashboards: telaDashboards, plano: telaPlano, churn: telaChurn, individual: telaIndividual, geral: telaGeral, config: telaClientes, premiacao: telaPremiacao };
    const livre = ['importar', 'config', 'clientes', 'cliente', 'veiculos', 'dashboards', 'individual', 'premiacao'].includes(E.rota.tela);
    const tela = (!E.base && !livre) ? telaSemDados : (telas[E.rota.tela] || telaGeral);
    const html = shell(comContexto(() => tela())) + (E.base ? painelExportacao() : '');
    const tokEl = document.getElementById('api-token'), tokDigitado = tokEl ? tokEl.value : '';   // o token digitado nunca vai para o HTML
    document.getElementById('app').innerHTML = html;
    if (tokDigitado && document.getElementById('api-token')) document.getElementById('api-token').value = tokDigitado;
    const chaveAnim = [E.rota.tela, E.rota.id, E.cliente, E.A && E.A.ini, E.A && E.A.fim, E.base ? E.base.linhas.length : 0].join('|');
    const pag = document.getElementById('pagina');
    if (pag && chaveAnim !== ultimaAnim) { ultimaAnim = chaveAnim; pag.classList.add('anima'); animarNumeros(pag); } else if (pag) pag.classList.add('sem-anima');
    desenharGraficos();
    if (foco) {
      const el = document.getElementById(foco.id);
      if (el) { el.focus(); try { el.setSelectionRange(foco.ini, foco.fim); } catch (e) { /* campo sem seleção */ } }
    }
    document.querySelectorAll('.dropzone').forEach((dz) => {
      dz.addEventListener('dragover', (ev) => { ev.preventDefault(); dz.classList.add('sobre'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('sobre'));

  }
  function desenharGraficos() {

  // ---------- Rotas ----------
  function lerRota() {
    const h = location.hash.replace(/^#\/?/, '');
    const [caminho, qs] = h.split('?');
    const partes = caminho.split('/').filter(Boolean);
    const aba = (new URLSearchParams(qs || '')).get('aba') || 'dashboard';
    if (partes[0] === 'individual') E.rota = { tela: 'individual', tipo: partes[1] === 'veiculo' ? 'veiculo' : 'motorista', id: partes[2] ? decodeURIComponent(partes[2]) : null, aba };
    else if (partes[0] === 'motoristas' && partes[1]) E.rota = { tela: 'detalhe', id: decodeURIComponent(partes[1]), aba };
    else if (partes[0] === 'cliente') E.rota = { tela: 'cliente', id: partes[1] ? decodeURIComponent(partes[1]) : null, aba };
    else if (['motoristas', 'comparativo', 'importar', 'config', 'visao', 'clientes', 'veiculos', 'dashboards', 'plano', 'churn', 'geral', 'premiacao'].includes(partes[0])) E.rota = { tela: partes[0], id: null, aba };
    else E.rota = { tela: 'geral', id: null, aba };
  }

  // ---------- Importação ----------
  function lerArquivo(arq, alvo) {
    return new Promise((resolve) => {
      if (arq.size > 25 * 1024 * 1024) { toast('Arquivo maior que 25 MB: ' + arq.name + '.', 'erro'); resolve(false); return; }
      const leitor = new FileReader();
      const ehExcel = /\.xlsx?$/i.test(arq.name);
      leitor.onload = () => {
        if (ehExcel) {
          try { resolve(importarTexto(xlsxParaCSV(leitor.result), arq.name, true, alvo)); } catch (e) { toast('Não foi possível ler ' + arq.name + ': ' + (e && e.message ? e.message : 'formato inválido') + '.', 'erro'); resolve(false); }
          return;
        }
        // O Excel costuma salvar CSV em ANSI (windows-1252): se o UTF-8 trouxer caracteres inválidos, decodifica de novo
        let texto = new TextDecoder('utf-8').decode(leitor.result);
        if (texto.includes(String.fromCharCode(0xFFFD))) texto = new TextDecoder('windows-1252').decode(leitor.result);
        resolve(importarTexto(texto, arq.name, true, alvo));
      };
      leitor.onerror = () => { toast('Não foi possível ler ' + arq.name + '.', 'erro'); resolve(false); };
      leitor.readAsArrayBuffer(arq);
    });
  }
  // Vários arquivos de uma vez: entram um a um, somando aos dados já salvos
  async function lerArquivos(lista, alvo, cli) {
    const nome = cli || (E.rota.tela === 'cliente' && focoPorSlug(E.rota.id) ? focoPorSlug(E.rota.id).nome : '');
    if (!nome) { toast('Abra o perfil do cliente (Configurações → Clientes) para anexar a planilha.', 'erro'); return; }
    E.importCli = nome;
    try { await lerArquivosBase(lista, alvo); } finally { E.importCli = null; }
  }
  async function lerArquivosBase(lista, alvo) {
    const arqs = Array.from(lista || []);
    if (!arqs.length) return;
    if (arqs.length === 1) { await lerArquivo(arqs[0], alvo); return; }
    E.silencio = true;
    let novas = 0, atual = 0, ok = 0; const falhas = [];
    for (const a of arqs) {
      const r = await lerArquivo(a, alvo);
      const imp = alvo === 'veiculos' ? E.impVeic : E.importacao;
      if (r && imp && imp.ok) { ok++; novas += imp.novas; atual += imp.atualizadas; } else falhas.push(a.name);
    }
    E.silencio = false;
    const imp = alvo === 'veiculos' ? E.impVeic : E.importacao;
    if (ok && imp && imp.ok) { imp.nome = ok + ' arquivos'; imp.novas = novas; imp.atualizadas = atual; }
    render();
    if (ok) toast(ok + ' arquivos importados: ' + novas + ' linhas novas' + (atual ? ', ' + atual + ' atualizadas' : '') + '.');
    if (falhas.length) toast('Não foi possível ler: ' + falhas.join(', ') + '.', 'erro');
  }
  // Exportação da plataforma (uma linha por veículo, período na linha 1, cabeçalho na linha 2) → CSV no layout do painel.
  // Reconhece o grupo do veículo de 3 formas: coluna "Grupo", linha-título de grupo antes dos veículos, ou uma aba por grupo.
  // Exportação de Motoristas da plataforma: uma linha por motorista, sem datas nem empresa. O período vem do perfil do cliente.
  function motExportParaCSV(aba, norm) {
    const ls = aba.linhas;
    const ic = ls.findIndex((l) => { const c = l.map(norm); return c.includes('motorista') && c.includes('km rodado'); });
    const p = E.perMot;
    if (!p || !p.ini || !p.fim || p.ini > p.fim) throw new Error('esta exportação não traz datas: informe o período da planilha (início e fim) no perfil do cliente');
    const cab = ls[ic].map(norm);
    const col = (...nomes) => { for (const n of nomes) { const i = cab.findIndex((h) => h === n || h.startsWith(n)); if (i >= 0) return i; } return -1; };
    const M = [['km', col('km rodado')], ['litros', col('consumo')], ['faixa_verde', col('inicio faixa verde')], ['embalo', col('aproveitamento de embalo')],
      ['motor_ocioso', col('motor ligado parado')], ['pressao_acelerador', col('acelerando acima do verde')], ['nota', col('nota geral', 'nota')]].filter((m) => m[1] >= 0);
    const iMot = col('motorista'), iKm = col('km rodado');
    const dias = X.D.dif(p.ini, p.fim) + 1;
    const txt = (v) => String(v === null || v === undefined ? '' : v).trim();
    const fmtN = (v) => { const n = X.numero(v); return n === null ? '' : String(n).replace('.', ','); };
    const escC = (v) => (/[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v);
    const out = [['data', 'motorista', 'dias_periodo'].concat(M.map((m) => m[0])).join(';')];
    let semRodagem = 0;
    for (let r = ic + 1; r < ls.length; r++) {
      const l = ls[r], nome = txt(l[iMot]);
      if (!nome || /^(total|subtotal|soma|media|geral)\b/.test(norm(nome))) continue;
      const km = X.numero(l[iKm]);
      if (!(km > 0)) { semRodagem++; continue; }
      out.push([p.fim, escC(nome), dias].concat(M.map((m) => fmtN(l[m[1]]))).join(';'));
    }
    if (out.length < 2) throw new Error('nenhum motorista com km rodado na planilha');
    const usados = M.map((m) => m[0]);
    const avs = ['Exportação de motoristas sem datas: os dados foram registrados no período informado (' + D_br(p.ini) + ' a ' + D_br(p.fim) + ', fim em ' + D_br(p.fim) + ').'];
    if (usados.includes('faixa_verde')) avs.push('Faixa verde foi lida da coluna “Início faixa verde”; Pressão do acelerador, da coluna “Acelerando acima do verde”. Colunas sem equivalente no painel (média do computador de bordo, piloto automático, excesso de velocidade, freio motor, pressão do acelerador) foram ignoradas.');
    if (semRodagem) avs.push(semRodagem + ' motorista(s) sem km no período foram ignorados.');
    E.periodoLido = { ini: D_br(p.ini), fim: D_br(p.fim) };
    E.avisosLeitura = avs;

  }
  const D_br = (iso) => iso.split('-').reverse().join('/');
  const ALIAS_GRUPO = ['grupo', 'grupos', 'grupo de veiculos', 'grupo do veiculo', 'grupo de veiculo', 'nome do grupo'];
  function xlsxParaCSV(buf) {

    const wb = XLSX.read(buf, { type: 'array' });
    const norm = (v) => String(v === null || v === undefined ? '' : v).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
    const abas = wb.SheetNames.map((n) => ({ nome: n, linhas: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }) }));
    // cabeçalho da exportação de veículos: tem "Placa" e não é a planilha já no layout do painel (data + motorista)
    const achaCab = (ls) => ls.findIndex((l) => { const c = l.map(norm); return c.includes('placa') && !(c.includes('data') && c.includes('motorista')); });
    const validas = abas.filter((a) => achaCab(a.linhas) >= 0);

      const cab0 = csvs[0].linhas[0];

      const temGrupo = norm(cab0).split(';').some((h) => ALIAS_GRUPO.includes(h));

      if (fora.length) avs.push('Abas com cabeçalho diferente da primeira foram ignoradas: ' + fora.map((c) => c.nome).join(', ') + '.');

      const escCsv = (v) => (/[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v);
      return [cab0 + (usaNome ? ';grupo' : '')].concat(...iguais.map((c) => c.linhas.slice(1).map((l) => l + (usaNome ? ';' + escCsv(c.nome.trim()) : '')))).join('\n');
    }
    const avisos = [];
    const ignoradas = abas.filter((a) => !validas.includes(a) && a.linhas.some((l) => l.some((c) => String(c).trim())));
    if (ignoradas.length) avisos.push('Abas sem coluna Placa foram ignoradas: ' + ignoradas.map((a) => a.nome).join(', ') + '.');

    const txt = (v) => String(v === null || v === undefined ? '' : v).trim();
    const num = (v) => { const n = X.numero(v); return n === null ? '' : n; };
    const hrs = (v) => {
      const t = String(v).trim().split(':').map(Number);
      if (t.length >= 2 && t.every(Number.isFinite)) return Math.round((t[0] + t[1] / 60 + (t[2] || 0) / 3600) * 100) / 100;
      return num(v);
    };
    const ALIAS = {
      grupo: ALIAS_GRUPO,
      modelo: ['modelo', 'modelo do veiculo'],
      filial: ['filial', 'unidade', 'base', 'regional'],
      tipo: ['tipo', 'tipo de veiculo', 'categoria', 'classe']
    };
    const MAPA = [['cliente', ['empresa', 'cliente'], txt], ['km', ['km total', 'km rodados', 'km'], num], ['litros', ['consumo total', 'consumo', 'litros'], num],
      ['horas', ['tempo em movimento'], hrs], ['faixa_verde', ['% faixa verde', 'faixa verde'], num], ['embalo', ['% aproveitamento de embalo', 'aproveitamento de embalo'], num],
      ['motor_ocioso', ['% total motor ligado parado', '% motor ligado parado'], num], ['pressao_acelerador', ['% acelerando acima do verde'], num],
      ['frenagens', ['freadas totais', 'freadas'], num], ['nota', ['nota geral', 'nota'], num]];
    const ehPlaca = (t) => /^[A-Za-z]{3}-?\d[A-Za-z0-9]\d{2}$/.test(t);
    const ehTotal = (t) => /^(total|subtotal|soma|media|geral)\b/.test(norm(t));
    const GENERICA = /^(planilha|sheet|folha|plan|resumo|dados|relatorio|exportacao|export|veiculos)\s*\d*$/;
    const paraISO = (br) => br.split('/').reverse().join('-');

    const saida = [], vistos = new Map(), duplicadas = new Map();
    let ini = null, fim = null, diaPadrao = null, semRodagem = 0;
    // 1ª passada: data de cada aba (uma aba sem data herda a das outras)
    validas.forEach((a) => {
      const ic = achaCab(a.linhas);
      const ds = a.linhas.slice(0, ic).map((l) => l.join(' ')).join(' ').match(/\d{2}\/\d{2}\/\d{4}/g);
      a.ds = ds;
      if (ds) { const i = ds[0], f = ds[ds.length - 1]; if (!ini || paraISO(i) < paraISO(ini)) ini = i; if (!fim || paraISO(f) > paraISO(fim)) fim = f; diaPadrao = diaPadrao && paraISO(diaPadrao) > paraISO(f) ? diaPadrao : f; }
    });
    if (!diaPadrao) throw new Error('período de análise não encontrado acima do cabeçalho da planilha');
    E.periodoLido = { ini, fim };

    validas.forEach((a) => {
      const ls = a.linhas, ic = achaCab(ls);
      const cab = ls[ic].map(norm);
      const col = (nomes) => { for (const n of nomes) { const i = cab.indexOf(n); if (i >= 0) return i; } return -1; };
      const iPlaca = col(['placa']), iFrota = col(['frota']), iKm = col(['km total', 'km rodados', 'km']);
      const iDim = {}; Object.keys(ALIAS).forEach((k) => { iDim[k] = col(ALIAS[k]); });
      const iMap = MAPA.map(([k, nomes, f]) => [k, col(nomes), f]);
      const dia = a.ds ? a.ds[a.ds.length - 1] : diaPadrao;
      const abaGrupo = validas.length > 1 && !GENERICA.test(norm(a.nome)) ? a.nome.trim() : '';
      let secao = '';
      for (let r = ic + 1; r < ls.length; r++) {
        const l = ls[r];
        const cheias = l.map(txt).filter(Boolean);
        if (!cheias.length) continue;
        const placa = txt(l[iPlaca]), frota = iFrota >= 0 ? txt(l[iFrota]) : '';
        const id = placa || frota;
        if (norm(placa) === 'placa') continue;                                  // cabeçalho repetido a cada grupo
        const tituloGrupo = !id || (cheias.length === 1 && !ehPlaca(id));
        if (tituloGrupo) {                                                      // linha só com o nome do grupo
          const t = cheias[0];

          continue;
        }
        if (ehTotal(id)) continue;                                              // linhas de total/média não são veículos
        const grupo = (iDim.grupo >= 0 && txt(l[iDim.grupo])) || secao || abaGrupo;
        const chave = dia + '|' + norm(id);
        if (vistos.has(chave)) {                                                // mesma placa em mais de um grupo: conta uma vez só
          const o = duplicadas.get(id) || [vistos.get(chave)];
          if (!o.includes(grupo || 'sem grupo')) o.push(grupo || 'sem grupo');
          duplicadas.set(id, o);

        }

        const km = X.numero(l[iKm]);
        const rodou = km !== null && km > 0;
        if (!rodou) semRodagem++;
        const diasCob = a.ds ? X.D.dif(paraISO(a.ds[0]), paraISO(a.ds[a.ds.length - 1])) + 1 : 1;
        const o = { data: dia, motorista: id, veiculo: id, dias_periodo: diasCob, grupo, modelo: iDim.modelo >= 0 ? txt(l[iDim.modelo]) : '', filial: iDim.filial >= 0 ? txt(l[iDim.filial]) : '', tipo: iDim.tipo >= 0 ? txt(l[iDim.tipo]) : '' };
        iMap.forEach(([k, i, f]) => {

    const ORDEM = ['data', 'motorista', 'veiculo', 'grupo', 'modelo', 'filial', 'tipo'].concat(MAPA.map((m) => m[0]), ['dias_periodo']);

    const cols = ORDEM.filter((k) => OBRIG.includes(k) || saida.some((o) => o[k] !== '' && o[k] !== undefined && o[k] !== null));

  }
  // Acumula as importações: cada planilha nova entra junto com as anteriores; a mesma linha (dia + motorista/veículo + cliente) é atualizada
  function mesclar(antigas, novas) {
    const chave = (l) => [l.data, nrm(l.motorista), nrm(l.veiculo), nrm(l.cliente)].join('|');
    const mapa = new Map();
    antigas.forEach((l) => mapa.set(chave(l), l));

    novas.forEach((l) => { const k = chave(l); if (mapa.has(k)) atualizadas++; else novasN++; mapa.set(k, l); });
    return { linhas: [...mapa.values()], novas: novasN, atualizadas };
  }
  const uniao = (a, b) => [...new Set((a || []).concat(b || []))];
  const rotuloArquivos = (arqs) => (arqs.length > 1 ? arqs.length + ' arquivos importados' : arqs[0] || '');
  function importarTexto(texto, nome, salvar, alvo, guardados) {

      const alvoNome = E.importCli, outros = new Map(), ficam = [];

          if (sobrep.length) r.avisos.push('Esta planilha (' + pl.ini + ' a ' + pl.fim + ') se cruza com a(s) já importada(s): ' + sobrep.map((c) => D.periodoBR(c)).join('; ') + '. Km e litros dos dias em comum seriam contados duas vezes se as duas entrarem no mesmo período — compare uma planilha por vez (botão “Última planilha”).');

      // quantos veículos há em cada grupo (placa → grupo mais recente) e quantos vieram sem grupo
      const gPlaca = new Map(), dPlaca = new Map();
      linhas.forEach((l) => { const p = l.veiculo || l.motorista; if (l.grupo && (!dPlaca.has(p) || l.data >= dPlaca.get(p))) { gPlaca.set(p, l.grupo); dPlaca.set(p, l.data); } });
      const placas = new Set(linhas.map((l) => l.veiculo || l.motorista));
      const gCont = new Map(); gPlaca.forEach((g) => gCont.set(g, (gCont.get(g) || 0) + 1));
      const gruposInfo = [...gCont.entries()].sort((a, b) => b[1] - a[1]).map(([g, n]) => ({ nome: g, n }));
      const semGrupo = [...placas].filter((p) => !gPlaca.has(p)).length;
      if (gruposInfo.length && semGrupo) r.avisos.push(semGrupo + ' veículo(s) ficaram sem grupo na planilha e aparecem como “Sem grupo”.');
      if (!gruposInfo.length && salvar) r.avisos.push('Nenhuma coluna de grupo foi encontrada. Se os veículos vêm separados por grupo, a coluna precisa se chamar “Grupo” (ou use uma aba por grupo, ou uma linha com o nome do grupo antes dos veículos).');
      if (E.linhasAll) {   // a base de motoristas herda o grupo pela placa
        const sv = { A: E.A, B: E.B, p: E.presetA, m: E.modoComp };
        validarFiltro(); aplicarFiltroCliente();
        if (E.base && sv.A && sv.A.ini >= E.base.inicio && sv.A.fim <= E.base.fim) { E.A = sv.A; E.B = sv.B; E.presetA = sv.p; E.modoComp = sv.m; E.cal.rascA = { ...E.A }; E.cal.rascB = { ...E.B }; }
      }
      let salvoV = true;
      if (salvar && planRef) enviarPlanilhas('veiculos', r.linhas, linhas, colunas, nome);
      else if (salvar) salvoV = armazem.gravar(CHAVE_VEIC, JSON.stringify({ nome, arquivos: arqs, texto: X.paraCSV(linhas.slice(), colunas) }));
      E.impVeic = { ok: true, nome, linhas: r.linhas.length, novas: res.novas, atualizadas: res.atualizadas, total: linhas.length, avisos: r.avisos, salvo: salvoV, grupos: gruposInfo, semGrupo, veiculos: placas.size };
      if (salvar) toast('Veículos: ' + res.novas + ' linhas novas' + (res.atualizadas ? ', ' + res.atualizadas + ' atualizadas' : '') + '. Total salvo: ' + linhas.length + '.');
      render();
      return true;
    }
    if (!r.ok) {
      E.importacao = { ok: false, nome, erros: r.erros, cabecalho: r.cabecalho };
      render();
      return false;
    }
    let linhas = r.linhas, colunas = r.colunas, arqs = guardados || [nome], res = { novas: r.linhas.length, atualizadas: 0 };
    if (salvar && E.linhasAll) {
      res = mesclar(E.linhasAll, r.linhas); linhas = res.linhas; colunas = uniao(E.colunasAll, r.colunas); arqs = uniao(E.arquivos, [nome]);
    }
    E.linhasAll = linhas; E.colunasAll = colunas; E.arquivos = arqs; E.fonte = { tipo: 'planilha', nome: rotuloArquivos(arqs) };
    if (salvar) E.modoComp = 'anterior'; // nova planilha: volta a comparar com o período anterior equivalente
    if (salvar && E.cliente && !linhas.some(doCliente) && !((E.veic && E.veic.linhas) || []).some(doCliente)) E.cliente = '';
    validarFiltro();
    aplicarFiltroCliente();
    const nMot = new Set(linhas.map((l) => l.motorista)).size;
    let salvo = true;
    // Guarda só as colunas reconhecidas, nunca o arquivo bruto (que pode ter colunas pessoais)
    if (salvar && planRef) enviarPlanilhas('motoristas', r.linhas, linhas, colunas, nome);
    else if (salvar) salvo = armazem.gravar(CHAVE_CSV, JSON.stringify({ nome, arquivos: arqs, texto: X.paraCSV(linhas.slice(), colunas) }));
    E.importacao = { ok: true, nome, linhas: r.linhas.length, novas: res.novas, atualizadas: res.atualizadas, total: linhas.length, motoristas: nMot, avisos: r.avisos, salvo };
    if (salvar) toast('Motoristas: ' + res.novas + ' linhas novas' + (res.atualizadas ? ', ' + res.atualizadas + ' atualizadas' : '') + '. Total salvo: ' + linhas.length + '.');
    render();
    return true;
  }

    E.base.indicadores.forEach((ind) => {

      ls.push(csvLinha([g, ind.label, ind.un, numCSV(a[ind.key], ind.casas), numCSV(b[ind.key], ind.casas), v.semBase ? '' : numCSV(v.delta, ind.casas), v.semBase ? '' : v.texto, textoResultado(v, ind)].concat(extra ? [numCSV(extra(ind), ind.casas)] : [])));

    'hub-atualizar': (el) => { const r = (E.rel || []).find((x) => x.chave === el.dataset.id); if (r) atualizarHub(r); },
    'preco-auto': () => { armazem.apagar(CHAVE_PRECO); E.precoManual = false; if (E.diesel) E.preco = Number(E.diesel.preco_br); render(); toast('Usando o preço da Petrobras.'); },
    'churn-cliente': (el) => { E.churnVista = 'cliente'; trocarCliente(el.dataset.cli); render(); window.scrollTo(0, 0); },
    'churn-vista': (el) => { E.churnVista = el.dataset.v === 'carteira' ? 'carteira' : 'cliente'; render(); window.scrollTo(0, 0); },
    'churn-todos': () => { E.churnVista = 'carteira'; render(); window.scrollTo(0, 0); },
    'cliente-hero': (el) => { trocarCliente(el.dataset.cli || ''); if (E.rota.tela === 'detalhe') { location.hash = '#/motoristas'; return; } render(); },
    'trat-novo': (el) => {
      E.tratForm = { cliente: el.dataset.cli, data: D.hoje(), etapa: el.dataset.etapa || 'plataforma', status: 'combinado', prazo: '', titulo: el.dataset.titulo || '', combinado: '' };
      render(); const e = document.getElementById('trat-titulo'); if (e) { try { e.scrollIntoView({ block: 'center' }); } catch (x) { /* sem rolagem */ } e.focus(); }
    },
    'trat-cancelar': () => { E.tratForm = null; render(); },
    'trat-salvar': () => salvarTrat(),
    'trat-entregar': (el) => atualizarTrat(el.dataset.id, { status: 'entregue', entregue_em: D.hoje() }),
    'trat-remover': (el) => { E.tratRemover = el.dataset.id; render(); },
    'trat-remover-cancelar': () => { E.tratRemover = null; render(); },
    'trat-remover-confirmar': () => removerTrat(E.tratRemover),
    'trat-ind': (el) => { E.tratInd = el.dataset.ind; render(); },
    'ver-cliente': (el) => { trocarCliente(el.dataset.cli); location.hash = '#/geral'; render(); window.scrollTo(0, 0); },
    'ver-cliente-veic': (el) => { trocarCliente(el.dataset.cli); render(); },
    'cli-apagar-pedir': (el) => { E.cliApagar = el.dataset.alvo; render(); },
    'cli-apagar-cancelar': () => { E.cliApagar = null; render(); },
    'cli-apagar-confirmar': () => { const f = focoPorSlug(E.rota.id); if (f && E.cliApagar) apagarDadosCliente(f.nome, E.cliApagar); },
    'cliente-salvar': () => salvarCliente(),
    'cliente-remover': (el) => { E.clienteRemover = el.dataset.id; render(); },
    'cliente-remover-cancelar': () => { E.clienteRemover = null; render(); },
    'cliente-remover-confirmar': () => removerCliente(E.clienteRemover),
    // Abrir o sino marca tudo como visto; o destaque "Novo" fica até fechar
    'sino': () => {
      if (E.sino) { E.sino = false; render(); return; }
      E.sino = true; E.sinoVistas = novidadesVistas();
      armazem.gravar(CHAVE_NOVIDADES, String(Math.max(...NOVIDADES.map((n) => n.id))));
      render();
    },
    'sino-fechar': () => { E.sino = false; render(); }
  };
  function deslocar(p, meses, anos) {
    const mover = (s) => { const d = D.deISO(s); d.setUTCFullYear(d.getUTCFullYear() - anos); d.setUTCMonth(d.getUTCMonth() - meses); return D.paraISO(d); };
    return { ini: mover(p.ini), fim: mover(p.fim) };
  }
  function salvarPeriodo() { armazem.gravar('gbx-frota-periodo', JSON.stringify({ A: E.A, B: E.B, modo: E.modoComp, preset: E.presetA })); }

  document.addEventListener('click', (ev) => {
    if (E.sino && !ev.target.closest('.sino')) { E.sino = false; render(); }   // clique fora fecha o sino
    const el = ev.target.closest('[data-acao]');
    if (!el || el.disabled) return;
    const f = acoes[el.dataset.acao];
    if (!f) return;
    if (['filtrar-dim', 'limpar-dim', 'remover-veic-confirmar', 'remover-confirmar', 'churn-cliente', 'churn-todos', 'cliente-hero'].includes(el.dataset.acao)) f(el, ev);
    else comContexto(() => f(el, ev));
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.matches('input[data-campo^="cli-"]')) { ev.preventDefault(); salvarCliente(); return; }
    if (ev.key === 'Enter' && ev.target.matches('tr[data-acao]') && acoes[ev.target.dataset.acao]) acoes[ev.target.dataset.acao](ev.target, ev);
    if (ev.key === 'Escape') { X.ui.dica(null); if (E.sino) { E.sino = false; render(); } if (E.exportacao) { E.exportacao = null; render(); } }
  });
  document.addEventListener('input', (ev) => {
    const k = ev.target.dataset.campo;
    if (k === 'busca') { E.lista.busca = ev.target.value; E.lista.pag = 1; render(); }
    else if (k === 'busca-veic') { E.veicLista.busca = ev.target.value; E.veicLista.pag = 1; render(); }
    else if (k === 'per-ini' || k === 'per-fim') { if (E.perMot) { E.perMot[k.slice(4)] = ev.target.value; E.perMot.editado = true; } }
    else if (k && k.indexOf('cli-') === 0) E.clienteForm[k.slice(4)] = ev.target.value;
    else if (k && k.indexOf('trat-') === 0 && E.tratForm) E.tratForm[k.slice(5)] = ev.target.value;
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target, k = el.dataset.campo;
    if (k && k.indexOf('api-') === 0 && E.apiForm) {
      const c = k.slice(4);
      if (c === 'ini' || c === 'fim') E.apiForm[c] = el.value; else E.apiForm[c] = el.checked;
      render(); return;
    }
    if (k === 'filtro-dim') {
      E.filtro[el.dataset.dim] = el.value;
      reaplicarFiltro();
      if (E.rota.tela === 'detalhe') { location.hash = '#/motoristas'; return; }
      render();
    } else if (k === 'cliente-filtro') {
      trocarCliente(el.value);
      if (E.rota.tela === 'churn') E.churnVista = 'cliente';
      if (E.rota.tela === 'detalhe') { location.hash = '#/motoristas'; return; }
      render();
    } else if (k === 'ind-sel') { location.hash = '#/individual/' + E.rota.tipo + '/' + encodeURIComponent(el.value) + (E.rota.aba && E.rota.aba !== 'dashboard' ? '?aba=' + E.rota.aba : ''); }
    else if (k === 'ind-graf') { E.indGraf = el.value; render(); }
    else if (k === 'ind-det') { E.detalhe.indGraf = el.value; render(); }
    else if (k === 'ind-comp') { E.comp.ind = el.value; render(); }
    else if (k === 'escopo') { E.comp.escopo = el.value; render(); }
    else if (k === 'preco') {
      const n = Number(String(el.value).replace(/\./g, '').replace(',', '.'));
      if (Number.isFinite(n) && n > 0) { E.preco = n; E.precoManual = true; armazem.gravar(CHAVE_PRECO, String(n)); }
      render();
    } else if (k === 'arquivo-motoristas' && el.files.length) lerArquivos(el.files, 'motoristas', el.dataset.cli);
    else if (k === 'arquivo-veiculos' && el.files.length) lerArquivos(el.files, 'veiculos', el.dataset.cli);
  });
  let tRedim;
  window.addEventListener('resize', () => { clearTimeout(tRedim); tRedim = setTimeout(desenharGraficos, 120); });
  window.addEventListener('hashchange', () => { lerRota(); render(); window.scrollTo(0, 0); });

  // ---------- Início ----------
  function iniciar() {
    if (!armazem.ler('gbx-reset-2026-10-20')) { [CHAVE_CSV, CHAVE_VEIC, CHAVE_CLIENTES, CHAVE_CLIENTE_SEL, 'gbx-frota-periodo'].forEach((k) => armazem.apagar(k)); armazem.gravar('gbx-reset-2026-10-20', '1'); }
    const p = Number(armazem.ler(CHAVE_PRECO));
    if (Number.isFinite(p) && p > 0) { E.preco = p; E.precoManual = true; }
    E.cliente = armazem.ler(CHAVE_CLIENTE_SEL) || '';
    let carregou = false;
    const salvo = armazem.ler(CHAVE_CSV);
    if (salvo) {
      try { const o = JSON.parse(salvo); carregou = importarTexto(o.texto, o.nome, false, undefined, o.arquivos); E.importacao = null; } catch (e) { carregou = false; }
    }
    if (!carregou) limparBase();
    const sv = armazem.ler(CHAVE_VEIC);
    if (sv) { try { const o = JSON.parse(sv); importarTexto(o.texto, o.nome, false, 'veiculos', o.arquivos); E.impVeic = null; } catch (e) { E.veic = null; } }
    try {
      const per = JSON.parse(armazem.ler('gbx-frota-periodo') || 'null');
      if (E.base && per && per.A && per.A.ini >= E.base.inicio && per.A.fim <= E.base.fim) {
        E.A = per.A; E.B = per.B; E.modoComp = per.modo; E.presetA = per.preset;
        E.cal.rascA = { ...E.A }; E.cal.rascB = { ...E.B }; E.cal.preset = per.preset;
        E.cal.mes = D.somarMeses(D.inicioMes(E.A.fim), -1);
        E.modoComp = 'anterior'; E.B = anterior(E.A); E.cal.rascB = { ...E.B };
      }
    } catch (e) { /* período salvo inválido: fica o padrão */ }
    E.planCarregando = !!(window.claude && window.claude.use);   // dentro do Claude: espera a base compartilhada
    try { E.apiLocal = JSON.parse(armazem.ler(CHAVE_API_LOCAL) || '{}') || {}; } catch (e) { E.apiLocal = {}; }
    lerRota();
    render();
    iniciarClientes();
  }
  iniciar();
})(window);

</script>
</body></html>
