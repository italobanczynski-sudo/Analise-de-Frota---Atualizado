    { tela: 'premiacao', href: '#/premiacao', icone: 'escrita', rot: 'Premiação' },
    { sec: 'Retenção do cliente' },
    { tela: 'churn', href: '#/churn', icone: 'churn', rot: 'Saúde do cliente' },
    { tela: 'plano', href: '#/plano', icone: 'plano', rot: 'Plano de ação' },
    { tela: 'comparativo', href: '#/comparativo', icone: 'documento', rot: 'Comparativo de períodos' },
    { rodape: true, tela: 'config', href: '#/config', icone: 'configuracoes', rot: 'Configurações', alt: ['importar', 'clientes', 'cliente'] }
  ];
  const navAtivo = (n) => (n.tela === E.rota.tela || (n.alt || []).includes(E.rota.tela)) && (!n.tipo || n.tipo === E.rota.tipo);
  const navItem = (n) => { const at = navAtivo(n); return `<a class="nav-item ${at ? 'ativo' : ''}" href="${n.href}" aria-label="${n.rot}" ${at ? 'aria-current="page"' : ''}><img src="${ASSET('i:' + n.icone + '.svg')}" alt=""><span class="nome">${n.rot}</span><span class="dica">${n.rot}</span></a>`; };
  function pilulaDiesel() {
    const d = E.diesel;
    if (!d) return `<a class="pilula-diesel" href="#/comparativo" title="Preço usado nas contas de economia">Diesel R$ ${fmt(E.preco, 2)}/L</a>`;
    const auto = !E.precoManual;
    return `<a class="pilula-diesel ${auto ? 'auto' : ''}" href="#/comparativo" title="${auto ? 'Atualizado automaticamente do site da Petrobras' : 'Preço digitado por você'} · ${esc(d.combustivel || 'Diesel')} · coleta ${esc(d.periodo || '')} · Petrobras: R$ ${fmt(Number(d.preco_br), 2)}/L"><span class="pd-pulso"></span>Diesel R$ ${fmt(E.preco, 2)}/L<small>${auto ? 'Petrobras' : 'manual'}</small></a>`;
  }
  function seletorCliente() {
    const ops = opcoesClientes();
    if (!ops.length) return '';
    return `<label class="sr-only" for="cliente-filtro" style="position:absolute;left:-9999px">Cliente</label>
      <select class="campo" id="cliente-filtro" data-campo="cliente-filtro" style="height:32px;max-width:260px;min-width:150px" title="Filtrar os dados por cliente">
        ${ops.map((o) => `<option value="${esc(o)}" ${ckey(o) === ckey(E.cliente) ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>`;
  }
  function seletorGrupo() {
    const d = DIMS[0];
    const ops = opcoesDim(d.key);
    if (!ops.length) return '';
    return `<label class="sr-only" for="cab-filtro-grupo" style="position:absolute;left:-9999px">Grupo de veículos</label>
      <select class="campo" id="cab-filtro-grupo" data-campo="filtro-dim" data-dim="grupo" style="height:32px;max-width:220px;min-width:140px" title="Filtrar tudo por grupo de veículos">
        <option value="">Todos os grupos</option>
        ${ops.map((o) => `<option value="${esc(o)}" ${nrm(o) === nrm(E.filtro.grupo) ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select>`;
  }
  // ---------- Sino de novidades: o que mudou no sistema (a mais nova primeiro; id sempre crescente) ----------
  const CHAVE_NOVIDADES = 'gbx-novidades-vistas';
  const NOVIDADES = [
    { id: 7, data: '2026-10-21', titulo: 'Performance dos veículos pela API', texto: 'A busca pela API agora traz também a performance de cada veículo, dia a dia: faixa verde, embalo, motor ocioso, pressão do pedal, acima do verde, excesso de velocidade, piloto automático, freio motor e o motorista vinculado.', href: '#/veiculos', link: 'Abrir Veículos e grupos' },
    { id: 6, data: '2026-10-21', titulo: 'Dados direto da API Gobrax', texto: 'No perfil do cliente, salve o token da API e busque sem planilha: estatísticas de cada veículo dia a dia (km, litros, km/l, velocidade média, frenagens), odômetro com a última comunicação de cada unidade e a premiação mensal dos motoristas, que ganhou tela própria.', href: '#/premiacao', link: 'Abrir a Premiação' },
    { id: 5, data: '2026-10-21', titulo: 'Dados compartilhados em tempo real', texto: 'No painel do Claude, as planilhas anexadas vão para uma base compartilhada: todos que acessam veem os mesmos clientes e dados, e cada planilha nova aparece na hora, sem recarregar.' },
    { id: 4, data: '2026-10-21', titulo: 'Sino de novidades', texto: 'As atualizações do sistema passam a aparecer aqui. O número vermelho mostra quantas você ainda não viu.' },
    { id: 3, data: '2026-10-21', titulo: 'Evolução dia a dia', texto: 'Nova tabela em Comparativo de períodos: cada dia com planilha comparado ao dia anterior com planilha, com Nota, km/l, km, diesel e indicadores de condução. Vale para a frota ou para um motorista, e exporta em CSV.', href: '#/comparativo', link: 'Abrir o comparativo' },
    { id: 2, data: '2026-10-21', titulo: '“Último dia” pula folgas e fins de semana', texto: 'Ao analisar um dia, a comparação é com o último dia anterior que tem planilha. Segunda-feira passa a ser comparada com sexta, em vez de ficar sem base.' },
    { id: 1, data: '2026-10-21', titulo: 'Importação diária no perfil do cliente', texto: 'O período da planilha de motoristas já sugere o dia da última planilha de veículos. Para comparar dia a dia, anexe uma planilha por dia, com início e fim no mesmo dia.' }
  ];
  const novidadesVistas = () => Number(armazem.ler(CHAVE_NOVIDADES)) || 0;
  function sino() {
    const vistas = E.sino ? E.sinoVistas : novidadesVistas();
    const nao = NOVIDADES.filter((n) => n.id > vistas).length;
    const rot = 'Novidades do sistema' + (nao ? ' · ' + nao + (nao === 1 ? ' nova' : ' novas') : '');
    return `<div class="sino">
      <button type="button" class="sino-btn" data-acao="sino" aria-label="${rot}" title="${rot}" aria-expanded="${!!E.sino}" aria-haspopup="true">${icone('sino', 20)}${nao && !E.sino ? `<span class="sino-cont">${nao > 9 ? '9+' : nao}</span>` : ''}</button>
      ${E.sino ? `<div class="sino-painel" role="dialog" aria-label="Novidades do sistema">
        <div class="sino-cab"><b>Novidades do sistema</b><button type="button" class="btn-icone fantasma" data-acao="sino-fechar" aria-label="Fechar">${icone('fechar', 14)}</button></div>
        ${NOVIDADES.map((n) => `<div class="sino-item ${n.id > vistas ? 'novo' : ''}">
          <span class="sino-item-tit">${esc(n.titulo)}${n.id > vistas ? '<span class="badge badge-atencao">Novo</span>' : ''}</span>
          <span class="apoio" style="font-size:11.5px">${D.br(n.data)}</span>
          <span>${esc(n.texto)}</span>
          ${n.href ? `<a href="${n.href}" data-acao="sino-fechar">${esc(n.link)} ›</a>` : ''}
        </div>`).join('')}
      </div>` : ''}
    </div>`;
  }

  function shell(conteudo) {
    const fonte = E.fonte.tipo === 'vazio'
      ? '<span class="tag">Sem dados</span>'
      : `<span class="tag">Planilha</span><span title="${esc(E.fonte.nome)}">${esc(E.fonte.nome)}</span>`;
    return `<div class="app">
      <nav class="sidebar" aria-label="Menu principal">
        <a class="nav-marca" href="#/geral" aria-label="Análise de frota — Visão geral"><span class="nav-marca-q"></span><span>Análise de frota</span></a>
        ${NAV.filter((n) => !n.rodape).map((n) => (n.sec ? `<span class="nav-secao">${n.sec}</span>` : navItem(n))).join('')}
        <div class="nav-rodape">${NAV.filter((n) => n.rodape).map(navItem).join('')}</div>
      </nav>
      <div class="conteudo">
        <header class="topo">
          <span class="topo-lado">${sino()}</span>
          <img class="topo-logo" src="${ASSET('logo')}" alt="gobrax">
          <span class="topo-lado dir">${pilulaDiesel()}${seletorCliente()}${seletorGrupo()}</span>
        </header>
        <main class="pagina" id="pagina">${conteudo}</main>
      </div>
    </div>`;
  }

  // ---------- Barra de período: escolha simples + comparação sempre com o período anterior ----------
  const RAPIDOS = [['ultimo', 'Último dia'], ['7', 'Últimos 7 dias'], ['30', 'Últimos 30 dias'], ['90', 'Últimos 90 dias'], ['mes', 'Mês atual'], ['mesant', 'Mês anterior']];
  function barraPeriodo() {
    const semBase = E.base && X.filtrar(E.base.linhas, E.B).length === 0;
    return `<section class="card" aria-label="Período">
      <div class="periodo-barra" style="flex-direction:column;align-items:stretch;gap:12px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="campo-rotulo">Período analisado</span>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${(temTotais(E.base) ? [['ultima', 'Última planilha']].concat(RAPIDOS) : RAPIDOS).map(([k, rot]) => `<button type="button" class="pilula ${E.presetA === k ? 'ativa' : ''}" data-acao="periodo-rapido" data-k="${k}" aria-pressed="${E.presetA === k}">${rot}</button>`).join('')}
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--corpo)">
          <span><span class="marca marca-a" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px"></span>Analisando <b>${D.periodoBR(E.A)}</b></span>
          <span><span class="marca marca-b" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px"></span>${E.A.ini === E.A.fim && E.B.ini === E.B.fim ? 'Comparando com o dia anterior com dados' : 'Comparando com o período anterior'}: <b>${D.periodoBR(E.B)}</b></span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--texto-2)">
          <span><b style="color:var(--ok)">▲ Verde</b> melhorou</span><span><b style="color:var(--critico)">▼ Vermelho</b> piorou</span><span><b style="color:var(--texto-3)">Cinza</b> estável ou sem base de comparação</span>
        </div>
        ${semBase ? '<div class="alerta alerta-atencao" role="status"><span class="alerta-icone">!</span><div class="alerta-corpo"><span class="alerta-texto">Ainda não há dados do período anterior para comparar. Importe planilhas de mais dias para ver se melhorou ou piorou.</span></div></div>' : ''}
      </div>
    </section>`;
  }

  // ---------- Cartões e tabelas reutilizados ----------
  function kpi(k, a, b, opts) {
    const ind = IND_MAP[k];
    if (!temInd(k)) return '';
    const o = opts || {};
    const v = X.variacao(ind, a[k], b[k]);
    const tag = o.acao ? 'button' : 'div';
    const attrs = o.acao ? ` type="button" data-acao="${o.acao}" data-ind="${k}" aria-pressed="${!!o.sel}"` : '';
    const corTend = v.semBase ? '#9AA0A6' : v.sentido === 'melhor' ? '#1E8E3E' : v.sentido === 'pior' ? '#D93025' : '#9AA0A6';
    const spark = o.linhas && o.linhas.length ? X.ui.miniArea(X.serieDiaria(o.linhas, ind, E.A, E.base).map((p) => p.valor), corTend, 92, 38) : '';
    return `<${tag} class="kpi ${o.sel ? 'selecionado' : ''} ${v.semBase ? '' : v.sentido === 'melhor' ? 'kpi-bom' : v.sentido === 'pior' ? 'kpi-ruim' : ''}"${attrs}>
      ${spark ? `<span class="kpi-spark" title="Evolução diária no período analisado">${spark}</span>` : ''}
      <span class="kpi-titulo">${esc(ind.label)}</span>
      <span class="kpi-desc">${esc(ind.desc)}</span>
      <span class="kpi-valor">${fmtInd(ind, a[k], false)}${ind.un && ind.un !== '%' ? `<small>${esc(ind.un)}</small>` : ind.un === '%' ? '<small>%</small>' : ''}</span>
      ${variacao(v, refB())}
      <span class="kpi-ref">Antes: ${fmtInd(ind, b[k])}</span>
    </${tag}>`;
  }

  function kpiEconomia(a, b) {
    const e = economia(a, b);
    if (!e) return '';
    const bom = e.reais >= 0;
    return `<div class="kpi">
      <span class="kpi-titulo">${bom ? 'Economia estimada' : 'Custo adicional estimado'}</span>
      <span class="kpi-desc">Diesel no ritmo de consumo anterior</span>
      <span class="kpi-valor">R$ ${fmt(Math.abs(e.reais), 0)}</span>
      <span class="var"><span class="var-v ${bom ? 'var-bom' : 'var-ruim'}">${bom ? '▼' : '▲'} ${fmt(Math.abs(e.litros), 0)} L</span><span class="var-ref">a R$ ${fmt(E.preco, 2)}/L</span></span>
      <span class="kpi-ref">Mesmos km, média de ${fmtInd(IND_MAP.kml, b.kml)}</span>
    </div>`;
  }

  function seletorIndicador(acao, atual) {
    return `<select class="campo" style="width:auto;min-width:200px" data-campo="${acao}" aria-label="Indicador do gráfico">
      ${GRUPOS.map((g) => {
        const inds = E.base.indicadores.filter((i) => i.grupo === g.key);
        return inds.length ? `<optgroup label="${g.label}">${inds.map((i) => `<option value="${i.key}" ${i.key === atual ? 'selected' : ''}>${esc(i.label)}</option>`).join('')}</optgroup>` : '';
      }).join('')}
    </select>`;
  }

  // Cartão "Dia a dia": gráfico de linha com o período de comparação sobreposto, ou tabela
  function cartaoDiaADia(chave, linhas, indKey, verTabela, acaoInd, acaoVista, titulo) {
    const ind = IND_MAP[indKey];
    const sa = X.serieDiaria(linhas, ind, E.A, E.base);
    const sb = X.serieDiaria(linhas, ind, E.B, E.base);
    E.graficos[chave] = { tipo: 'linha', a: sa, b: sb, ind, titulo: ind.label + ' por dia' };
    let corpo;
    if (verTabela) {
      const n = Math.max(sa.length, sb.length);
      let rows = '';
      for (let i = 0; i < n; i++) {
        const pa = sa[i], pb = sb[i];
        rows += `<tr><td class="num">${i + 1}</td><td>${pa ? D.br(pa.data) + ' <span class="mudo">' + D.semana(pa.data) + '</span>' : ''}</td><td class="dir">${pa ? fmtInd(ind, pa.valor) : ''}</td><td>${pb ? D.br(pb.data) + ' <span class="mudo">' + D.semana(pb.data) + '</span>' : ''}</td><td class="dir">${pb ? fmtInd(ind, pb.valor) : ''}</td></tr>`;
      }
      corpo = `<div class="tabela-wrap" style="max-height:320px;overflow:auto;border:1px solid var(--hairline);border-radius:8px">
        <table class="tabela"><thead><tr><th>Dia</th><th>Período analisado</th><th class="dir">${esc(ind.label)}</th><th>Comparação</th><th class="dir">${esc(ind.label)}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    } else {
      corpo = `<div class="graf-legenda"><span><span class="leg-linha-a"></span>Período analisado · ${D.periodoCurto(E.A)}</span><span><span class="leg-linha-b"></span>Comparação · ${D.periodoCurto(E.B)}</span></div>
        <div class="grafico" data-grafico="${chave}" style="height:220px"></div>`;
    }
    return `<section class="card">
      <div class="card-cab">
        <div class="card-cab-texto"><h2 class="h2">${esc(titulo || 'Dia a dia')}</h2><span class="h2-sub">${esc(ind.label)} · ${esc(ind.desc)}. Passe o mouse para comparar dia a dia.</span></div>
        ${seletorIndicador(acaoInd, indKey)}
        <div class="capsula" role="group" aria-label="Visualização">
          <button type="button" class="${verTabela ? '' : 'ativo'}" data-acao="${acaoVista}" data-v="grafico">Gráfico</button>
          <button type="button" class="${verTabela ? 'ativo' : ''}" data-acao="${acaoVista}" data-v="tabela">Tabela</button>
        </div>
      </div>
      <div class="card-corpo">${corpo}</div>
    </section>`;
  }

  // Tabela com todos os indicadores agrupados: analisado × comparação × variação (+ coluna extra opcional)
  function tabelaIndicadores(a, b, extra) {
    let rows = '';
    GRUPOS.forEach((g) => {
      const inds = E.base.indicadores.filter((i) => i.grupo === g.key);
      if (!inds.length) return;
      rows += `<tr><td class="grupo" colspan="${extra ? 6 : 5}">${g.label}</td></tr>`;
      inds.forEach((ind) => {
        const v = X.variacao(ind, a[ind.key], b[ind.key]);
        rows += `<tr>
          <td><span style="font-weight:500">${esc(ind.label)}</span><span class="linha2">${esc(ind.desc)}</span></td>
          <td class="dir">${fmtInd(ind, a[ind.key])}</td>
          <td class="dir" style="color:var(--texto-2)">${fmtInd(ind, b[ind.key])}</td>
          <td class="dir">${variacao(v)}</td>
          <td>${resultado(v, ind)}</td>
          ${extra ? `<td class="dir">${extra(ind)}</td>` : ''}
        </tr>`;
      });
    });
    return `<div class="tabela-wrap"><table class="tabela" style="min-width:720px">
      <thead><tr><th>Indicador</th><th class="dir">Período analisado</th><th class="dir">Comparação</th><th class="dir">Variação</th><th>Resultado</th>${extra ? `<th class="dir">${extra.titulo}</th>` : ''}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }
  function resultado(v, ind) {
    if (!v || v.semBase) return '<span class="badge badge-vazio">Sem base</span>';
    if (v.estavel) return '<span class="badge badge-neutro">Estável</span>';
    if (ind.melhor === 0) return '<span class="badge badge-neutro">' + (v.delta > 0 ? 'Subiu' : 'Desceu') + '</span>';
    return v.sentido === 'melhor' ? '<span class="badge badge-ok">Melhorou</span>' : '<span class="badge badge-critico">Piorou</span>';
  }
  function textoResultado(v, ind) {
    if (!v || v.semBase) return 'Sem base';
    if (v.estavel) return 'Estável';
    if (ind.melhor === 0) return v.delta > 0 ? 'Subiu' : 'Desceu';
    return v.sentido === 'melhor' ? 'Melhorou' : 'Piorou';
  }

  function semDadosNoPeriodo(qtd) {
    if (qtd) return '';
    return `<div class="alerta alerta-atencao"><span class="alerta-icone">!</span><div class="alerta-corpo">
      <span class="alerta-titulo">Nenhum registro no período analisado</span>
      <span class="alerta-texto">A planilha tem dados de ${D.br(E.base.inicio)} a ${D.br(E.base.fim)}. Escolha dias dentro desse intervalo no calendário.</span>
      <div class="alerta-acoes"><button type="button" class="btn-link peq" data-acao="cal-preset-aplicar" data-k="${temTotais(E.base) ? 'ultima' : '30'}">${temTotais(E.base) ? 'Usar o período da última planilha' : 'Usar os últimos 30 dias com dados'}</button></div>
    </div></div>`;
  }

  // ---------- Tela: Performance da frota ----------
  function telaVisao() {
    const c = calc();
    const total = c.mots.length;
    const kpis = ['nota', 'kml', 'faixa_verde', 'motor_ocioso', 'km'].map((k) => kpi(k, c.frotaA, c.frotaB, { acao: 'ind-graf', sel: E.indGraf === k, linhas: c.la })).join('');
    const ordenados = c.mots.filter((x) => x.st.delta !== null).sort((p, q) => q.st.delta - p.st.delta);
    const indSt = IND_MAP[ordenados[0] ? ordenados[0].st.ind : 'nota'];
    const fmtDelta = (d) => (indSt.key === 'nota' ? (d > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(d), 1) + ' pts' : (d > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(d), 2) + ' km/l');
    const lista = (arr, sinal) => arr.length ? arr.map((x, i) => `<a class="ranking-item" href="${linkMotorista(x.m.id)}" style="text-decoration:none;color:inherit">
        <span class="ranking-pos">${i + 1}º</span>${avatar(x.m.nome, 28)}
        <span style="flex:1;min-width:0;display:flex;flex-direction:column"><span class="pessoa-nome">${esc(x.m.nome)}</span><span class="apoio num" style="font-size:11.5px">${fmtInd(indSt, x.b[indSt.key])} → ${fmtInd(indSt, x.a[indSt.key])}</span></span>
        <span class="var"><span class="var-v ${sinal > 0 ? 'var-bom' : 'var-ruim'}">${fmtDelta(x.st.delta)}</span></span></a>`).join('')
      : '<span class="apoio" style="padding:8px 4px">Nenhum motorista nesta situação.</span>';
    const evol = ordenados.filter((x) => x.st.status === 'evoluiu').slice(0, 5);
    const regr = ordenados.filter((x) => x.st.status === 'regrediu').reverse().slice(0, 5);
    const pct = (n) => (total ? (n / total) * 100 : 0);
    const dist = ['evoluiu', 'estavel', 'regrediu', 'sembase'].filter((k) => c.cont[k]);

    return `
      <div class="pag-cab"><div class="pag-cab-texto">
        <h1 class="h1">Desenvolvimento da frota</h1>
        <span class="sub">${total} motoristas com registro · ${D.periodoBR(E.A)} comparado a ${D.periodoBR(E.B)}</span>
      </div>
      <a class="btn" href="#/comparativo" style="text-decoration:none">${icone('tabela', 14, '#5F6368')}Comparativo completo</a>
      </div>
      ${barraPeriodo()}
      ${semDadosNoPeriodo(c.la.length)}
      ${radarAuto()}
      <div class="grade-kpi">${kpis}${kpiEconomia(c.frotaA, c.frotaB)}</div>
      <div class="grade-2">
        <section class="card">
          <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Evolução dos motoristas</h2>
            <span class="h2-sub">${indSt.key === 'nota' ? 'Pela Nota Gobrax: evoluiu com +2 pts ou mais, regrediu com −2 pts ou menos.' : 'Pela média km/l: ±2% entre os períodos.'}</span></div></div>
          <div class="card-corpo">
            <div class="dist" role="img" aria-label="${dist.map((k) => c.cont[k] + ' ' + nomeStatus(k)).join(', ')}">${dist.map((k) => `<span style="width:${pct(c.cont[k])}%;background:${STATUS[k].cor}"></span>`).join('')}</div>
            <div class="dist-leg">${['evoluiu', 'estavel', 'regrediu'].map((k) => `<button type="button" class="dist-item" data-acao="ver-status" data-status="${k}">
              <span class="rot"><span class="ponto" style="background:${STATUS[k].cor}"></span>${{ evoluiu: 'Evoluíram', estavel: 'Estáveis', regrediu: 'Regrediram' }[k]}</span>
              <span class="val">${c.cont[k]}</span><span class="apoio num">${fmt(pct(c.cont[k]), 0)}% dos motoristas</span></button>`).join('')}</div>
            ${c.cont.sembase ? `<span class="apoio">${c.cont.sembase} motorista(s) sem registro em um dos períodos — sem base de comparação.</span>` : ''}
            <div class="grade-2" style="gap:12px 24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">
              <div><span class="rotulo-11">Mais evoluíram</span><div class="ranking" style="margin-top:6px">${lista(evol, 1)}</div></div>
              <div><span class="rotulo-11">Mais regrediram</span><div class="ranking" style="margin-top:6px">${lista(regr, -1)}</div></div>
            </div>
            <a class="btn-link peq" href="#/motoristas" style="align-self:flex-start">Ver todos os motoristas</a>
          </div>
        </section>
        ${cartaoDiaADia('frota-dia', E.base.linhas, E.indGraf, E.verTabela, 'ind-graf', 'vista-frota', 'Média da frota dia a dia')}
      </div>
      ${painelNotas(c)}
      <section class="card">
        <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Todos os indicadores da frota</h2>
          <span class="h2-sub">Subiu ou desceu: a cor indica se a mudança foi boa ou ruim para cada indicador.</span></div>
          <button type="button" class="btn" data-acao="exportar-frota">${icone('baixar', 14, '#5F6368')}Exportar CSV</button></div>
        <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px">${tabelaIndicadores(c.frotaA, c.frotaB)}</div>
      </section>`;
  }

  // ---------- Painel: distribuição e ranking das notas ----------
  const COR_FAIXA = { bom: '#1E8E3E', atencao: '#F9AB00', critico: '#D93025' };
  const ROT_FAIXA = { bom: 'Bom', atencao: 'Atenção', critico: 'Crítico' };
  function painelNotas(c) {
    if (!temInd('nota')) return '';
    const com = c.mots.filter((x) => x.a.nota !== null && x.a.nota !== undefined);
    if (!com.length) return '';
    const cont = { bom: 0, atencao: 0, critico: 0 };
    com.forEach((x) => { cont[X.faixaNota(x.a.nota)]++; });
    const total = com.length;
    const rank = com.slice().sort((p, q) => q.a.nota - p.a.nota).slice(0, 10);
    const barra = Object.keys(cont).filter((k) => cont[k]).map((k) => `<span style="width:${(cont[k] / total) * 100}%;background:${COR_FAIXA[k]}" title="${ROT_FAIXA[k]}: ${cont[k]}"></span>`).join('');
    const itens = rank.map((x, i) => {
      const f = X.faixaNota(x.a.nota), pct = Math.max(2, Math.min(100, x.a.nota));
      return `<a class="rk-linha" href="${linkMotorista(x.m.id)}" title="${esc(x.m.nome)}: ${fmt(x.a.nota, 1)}">
        <span class="rk-pos">${i + 1}</span><span class="rk-nome">${esc(x.m.nome)}</span>
        <span class="rk-trilho"><span class="rk-barra" style="width:${pct}%;background:${COR_FAIXA[f]}"></span></span>
        <span class="rk-valor num">${fmt(x.a.nota, 1)}</span></a>`;
    }).join('');
    return `<div class="grade-2">
      <section class="card">
        <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Distribuição das notas</h2>
          <span class="h2-sub">Quantos motoristas estão em cada faixa no período analisado.</span></div></div>
        <div class="card-corpo">
          <div class="dist" role="img" aria-label="${Object.keys(cont).map((k) => cont[k] + ' ' + ROT_FAIXA[k]).join(', ')}">${barra}</div>
          <div class="faixas">${Object.keys(cont).map((k) => `<div class="faixa-item"><span class="rot"><span class="ponto" style="background:${COR_FAIXA[k]}"></span>${ROT_FAIXA[k]}</span>
            <span class="faixa-n">${cont[k]}</span><span class="apoio num">${fmt((cont[k] / total) * 100, 0)}% · ${{ bom: 'nota 70 ou mais', atencao: 'nota de 40 a 69', critico: 'abaixo de 40' }[k]}</span></div>`).join('')}</div>
        </div>
      </section>
      <section class="card">
        <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Ranking de motoristas</h2>
          <span class="h2-sub">Nota Gobrax no período analisado${total > 10 ? ' · 10 melhores de ' + total : ''}.</span></div></div>
        <div class="card-corpo"><div class="rk">${itens}</div></div>
      </section>
    </div>`;
  }

  // ---------- Tela: Análise dos motoristas ----------
  const COLS_LISTA = [
    { col: 'motorista', rot: 'Motorista' },
    { col: 'status', rot: 'Evolução' },
    { col: 'vinculo', rot: 'Dias vinculado', dir: true },
    { col: 'nota', rot: 'Nota Gobrax', ind: 'nota' },
    { col: 'delta', rot: 'Variação da nota', ind: 'nota', dir: true },
    { col: 'kml', rot: 'Média km/l', ind: 'kml', dir: true },
    { col: 'faixa_verde', rot: 'Faixa verde', ind: 'faixa_verde', dir: true },
    { col: 'motor_ocioso', rot: 'Motor ocioso', ind: 'motor_ocioso', dir: true },
    { col: 'km', rot: 'Km rodados', ind: 'km', dir: true },
    { col: 'dias', rot: 'Dias trab.', ind: 'dias', dir: true },
    { col: 'tendencia', rot: 'Tendência', semOrdem: true }
  ];
  // Dias em que o condutor esteve vinculado a um veículo (dia com registro e placa informada), no período analisado
  function vinculo(x) {
    const dias = new Set(), por = new Map();
    x.la.forEach((l) => {
      if (!l.veiculo) return;
      dias.add(l.data);
      if (!por.has(l.veiculo)) por.set(l.veiculo, new Set());
      por.get(l.veiculo).add(l.data);
    });
    return { dias: dias.size, veiculos: [...por.entries()].map(([v, d]) => [v, d.size]).sort((a, b) => b[1] - a[1]) };
  }
  function motoristasFiltrados() {
    const c = calc();
    const busca = E.lista.busca.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let arr = c.mots.filter((x) => (E.lista.status === 'todos' || x.st.status === E.lista.status));
    if (busca) arr = arr.filter((x) => (x.m.nome + ' ' + x.m.veiculos.join(' ') + ' ' + DIMS.map((d) => x.m.dims[d.key].join(' ')).join(' ')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(busca));
    const { col, dir } = E.lista.ord;
    const ordemSt = { evoluiu: 3, estavel: 2, regrediu: 1, sembase: 0 };
    const val = (x) => (col === 'motorista' ? x.m.nome : col === 'status' ? ordemSt[x.st.status] : col === 'delta' ? x.st.delta : col === 'vinculo' ? vinculo(x).dias : x.a[col]);
    arr.sort((p, q) => {
      const vp = val(p), vq = val(q);
      if (vp === null || vp === undefined) return 1;
      if (vq === null || vq === undefined) return -1;
      return (typeof vp === 'string' ? vp.localeCompare(vq, 'pt-BR') : vp - vq) * dir;
    });
    return arr;
  }
  function telaMotoristas() {
    const c = calc();
    const arr = motoristasFiltrados();
    const pags = Math.max(1, Math.ceil(arr.length / E.lista.por));
    if (E.lista.pag > pags) E.lista.pag = pags;
    const pagina = arr.slice((E.lista.pag - 1) * E.lista.por, E.lista.pag * E.lista.por);
    const cols = COLS_LISTA.filter((k) => !k.ind || temInd(k.ind));
    const nota = temInd('nota');
    const cab = cols.map((k) => {
      const ativo = E.lista.ord.col === k.col;
      const seta = ativo ? `<span class="seta-ord">${E.lista.ord.dir > 0 ? '▲' : '▼'}</span>` : '';
      return k.semOrdem ? `<th>${k.rot}</th>` : `<th class="ord ${k.dir ? 'dir' : ''}" data-acao="ordenar" data-col="${k.col}" aria-sort="${ativo ? (E.lista.ord.dir > 0 ? 'ascending' : 'descending') : 'none'}">${k.rot}${seta}</th>`;
    }).join('');
    const celula = (x, k) => {
      const ind = IND_MAP[k.ind];
      switch (k.col) {
        case 'motorista': return `<td><span class="pessoa">${avatar(x.m.nome, 32)}<span style="display:flex;flex-direction:column;min-width:0"><a class="pessoa-nome" href="${linkMotorista(x.m.id)}" style="text-decoration:none">${esc(x.m.nome)}</a><span class="apoio" style="font-size:11.5px">${esc(x.m.veiculos.slice(0, 2).join(', ') || 'Sem veículo')}${x.m.dims.grupo.length ? ' · ' + esc(x.m.dims.grupo.slice(0, 2).join(', ')) + (x.m.dims.grupo.length > 2 ? ' +' + (x.m.dims.grupo.length - 2) : '') : ''}</span></span></span></td>`;
        case 'status': return `<td>${badgeStatus(x.st.status)}</td>`;
        case 'vinculo': {
          const v = vinculo(x);
          const det = v.veiculos.map(([pl, n]) => `${esc(pl)} (${n} d)`).join(', ');
          return `<td class="dir" title="${esc(det)}">${v.dias} ${v.dias === 1 ? 'dia' : 'dias'}<span class="linha2">${v.veiculos.length ? esc(v.veiculos.slice(0, 2).map(([pl, n]) => pl + ' · ' + n + ' d').join(', ')) + (v.veiculos.length > 2 ? ' +' + (v.veiculos.length - 2) : '') : 'sem veículo informado'}</span></td>`;
        }
        case 'nota': return `<td>${badgeNota(x.a.nota)}</td>`;
        case 'delta': return `<td class="dir">${variacao(X.variacao(IND_MAP[x.st.ind], x.a[x.st.ind], x.b[x.st.ind]))}<span class="linha2">antes ${fmtInd(IND_MAP[x.st.ind], x.b[x.st.ind])}</span></td>`;
        case 'tendencia': {
          const serie = X.serieDiaria(x.la, IND_MAP[nota ? 'nota' : 'kml'], E.A, E.base).map((p) => p.valor);
          return `<td title="${nota ? 'Nota' : 'Km/l'} diária no período analisado">${X.ui.sparkline(serie, STATUS[x.st.status].cor)}</td>`;
        }
        default: {
          const v = X.variacao(ind, x.a[k.col], x.b[k.col]);
          return `<td class="dir">${fmtInd(ind, x.a[k.col])}<span class="linha2">${variacao(v)}</span></td>`;
        }
      }
    };
    const corpo = pagina.length
      ? pagina.map((x) => `<tr class="clicavel" data-acao="abrir-motorista" data-id="${x.m.id}">${cols.map((k) => celula(x, k)).join('')}</tr>`).join('')
      : `<tr><td colspan="${cols.length}"><div class="vazio"><span class="vazio-icone">${icone('filtro', 14, '#9AA0A6')}</span>
          <span class="vazio-titulo">Nenhum motorista com esses filtros</span>
          <span class="apoio" style="max-width:36ch">Tente remover a busca ou o filtro de evolução, ou ampliar o período.</span>
          <button type="button" class="btn-link peq" data-acao="limpar-filtros">Limpar filtros</button></div></td></tr>`;
    const pil = [['todos', 'Todos', c.mots.length], ['evoluiu', 'Evoluíram', c.cont.evoluiu], ['estavel', 'Estáveis', c.cont.estavel], ['regrediu', 'Regrediram', c.cont.regrediu]];
    if (c.cont.sembase) pil.push(['sembase', 'Sem base', c.cont.sembase]);
    const aplicados = (E.lista.busca ? 1 : 0) + (E.lista.status !== 'todos' ? 1 : 0);
    return `
      <div class="pag-cab"><div class="pag-cab-texto">
        <h1 class="h1">Motoristas</h1>
        <span class="sub">Evolução ou regressão de cada condutor · ${D.periodoBR(E.A)} comparado a ${D.periodoBR(E.B)}</span>
      </div></div>
      ${barraPeriodo()}
      ${semDadosNoPeriodo(c.la.length)}
      <section class="card">
        <div style="display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-bottom:1px solid var(--apoio)">
          <div class="barra-filtros">
            <label class="campo campo-icone busca">${icone('busca', 14, '#5F6368')}
              <input type="text" id="busca-motorista" data-campo="busca" value="${esc(E.lista.busca)}" placeholder="Buscar motorista, placa ou grupo" aria-label="Buscar motorista, placa ou grupo"></label>
            ${pil.map(([k, rot, n]) => `<button type="button" class="pilula ${E.lista.status === k && k !== 'todos' ? 'ativa' : ''}" data-acao="filtro-status" data-status="${k}" aria-pressed="${E.lista.status === k}">${k !== 'todos' ? `<span class="ponto" style="width:8px;height:8px;border-radius:999px;background:${STATUS[k].cor}"></span>` : ''}${rot}<span class="mudo num">${n}</span></button>`).join('')}
            <span style="margin-left:auto;display:flex;align-items:center;gap:10px">
              <span class="apoio num">${arr.length} de ${c.mots.length} motoristas</span>
              ${aplicados ? '<span class="barra-vert"></span><button type="button" class="btn-link peq" data-acao="limpar-filtros">Limpar filtros</button>' : ''}
              <button type="button" class="btn" data-acao="exportar-motoristas">${icone('baixar', 14, '#5F6368')}Exportar CSV</button>
            </span>
          </div>
        </div>
        <div class="tabela-wrap"><table class="tabela" style="min-width:1060px"><thead><tr>${cab}</tr></thead><tbody>${corpo}</tbody></table></div>
        ${X.ui.paginacao(E.lista.pag, arr.length, E.lista.por, 'motoristas')}
      </section>`;
  }

  // ---------- Tela: Detalhe do motorista ----------
  function telaDetalhe() {
    const c = calc();
    const m = E.base.porId[E.rota.id];
    if (!m) {
      return `<button type="button" class="voltar" data-acao="ir" data-href="#/motoristas">‹ Motoristas</button>
        <section class="card"><div class="vazio"><span class="vazio-titulo">Motorista não encontrado</span><span class="apoio">Ele pode não estar na planilha carregada.</span></div></section>`;
    }
    const x = c.mots.find((y) => y.m.id === m.id) || { m, la: [], lb: [], a: X.resumo([], E.base), b: X.resumo([], E.base), st: { status: 'sembase' } };
    const aba = E.rota.aba;
    const ABAS = [['dashboard', 'Dashboard'], ['resumo', 'Resumo'], ['indicadores', 'Todos os indicadores'], ['produtividade', 'Produtividade'], ['dia', 'Dia a dia', x.la.length]];
    let corpo = '';
    if (aba === 'dashboard') {
      corpo = dashboardIndividual(x, m, c);
    } else if (aba === 'resumo') {
      const comp = ['nota', 'kml', 'faixa_verde', 'motor_ocioso', 'embalo', 'pressao_acelerador', 'km_dia'].filter(temInd);
      corpo = `
        <div class="grade-kpi">${['nota', 'kml', 'faixa_verde', 'motor_ocioso', 'km'].map((k) => kpi(k, x.a, x.b, { acao: 'ind-det', sel: E.detalhe.indGraf === k, linhas: x.la })).join('')}</div>
        <div class="grade-2">
          ${cartaoDiaADia('mot-dia', m.linhas, E.detalhe.indGraf, E.detalhe.verTabela, 'ind-det', 'vista-det', 'Evolução dia a dia')}
          <section class="card">
            <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Comparado à média da frota</h2><span class="h2-sub">Período analisado · ${D.periodoBR(E.A)}</span></div></div>
            <div class="card-corpo" style="gap:0;padding-top:8px">
              ${comp.map((k) => {
                const ind = IND_MAP[k];
                const v = X.variacao(ind, x.a[k], c.frotaA[k]);
                return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--apoio)">
                  <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px"><span style="font-weight:500">${esc(ind.label)}</span><span class="apoio num" style="font-size:11.5px">Frota: ${fmtInd(ind, c.frotaA[k])}</span></span>
                  <span class="num" style="font-weight:600;min-width:72px;text-align:right">${fmtInd(ind, x.a[k])}</span>
                  <span style="min-width:150px;text-align:right">${variacao(v, 'vs. frota')}</span></div>`;
              }).join('')}
            </div>
          </section>
        </div>`;
    } else if (aba === 'indicadores') {
      const extra = (ind) => fmtInd(ind, c.frotaA[ind.key]);
      extra.titulo = 'Média da frota';
      corpo = `<section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Todos os indicadores</h2><span class="h2-sub">${D.periodoBR(E.A)} comparado a ${D.periodoBR(E.B)}</span></div>
          <button type="button" class="btn" data-acao="exportar-motorista">${icone('baixar', 14, '#5F6368')}Exportar CSV</button></div>
        <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px">${tabelaIndicadores(x.a, x.b, extra)}</div></section>`;
    } else if (aba === 'produtividade') {
      const serie = X.serieDiaria(m.linhas, IND_MAP.km, E.A, E.base);
      E.graficos['mot-km'] = { tipo: 'barras', serie, ind: IND_MAP.km, ref: x.b.km_dia, titulo: 'Km rodados por dia' };
      corpo = `<div class="grade-kpi">${['km', 'horas', 'viagens', 'dias', 'km_dia'].map((k) => kpi(k, x.a, x.b)).join('')}</div>
        <section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Km rodados por dia</h2><span class="h2-sub">Dias sem barra não têm registro na planilha.</span></div></div>
          <div class="card-corpo">
            <div class="graf-legenda"><span><span style="width:10px;height:10px;border-radius:3px;background:var(--dado);display:inline-block"></span>Km no dia · ${D.periodoCurto(E.A)}</span>
              ${x.b.km_dia ? `<span><span class="leg-linha-b"></span>Média por dia trabalhado na comparação · ${fmtInd(IND_MAP.km_dia, x.b.km_dia)}</span>` : ''}</div>
            <div class="grafico" data-grafico="mot-km" style="height:200px"></div>
          </div></section>`;
    } else {
      const cols = ['km', 'litros', 'kml', 'horas', 'faixa_verde', 'embalo', 'motor_ocioso', 'pressao_acelerador', 'excesso_rotacao', 'excesso_velocidade', 'frenagens'].filter(temInd).map((k) => IND_MAP[k]);
      const porDia = new Map();
      x.la.forEach((l) => { if (!porDia.has(l.data)) porDia.set(l.data, []); porDia.get(l.data).push(l); });
      const dias = [...porDia.keys()].sort().reverse();
      const semReg = D.dias(E.A) - dias.length;
      corpo = `<section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Registros dia a dia</h2>
          <span class="h2-sub">${dias.length} dia(s) com registro${semReg > 0 ? ` · ${semReg} dia(s) sem registro no período` : ''}</span></div>
          <button type="button" class="btn" data-acao="exportar-dias">${icone('baixar', 14, '#5F6368')}Exportar CSV</button></div>
        <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px"><div class="tabela-wrap" style="max-height:560px;overflow:auto">
          <table class="tabela" style="min-width:1100px"><thead><tr><th>Data</th><th>Veículo</th>${cols.map((i) => `<th class="dir">${esc(i.label)}${i.un ? ` <span class="mudo">${esc(i.un)}</span>` : ''}</th>`).join('')}${temInd('nota') ? '<th>Nota</th>' : ''}</tr></thead>
          <tbody>${dias.length ? dias.map((d) => {
            const ls = porDia.get(d);
            const r = X.resumo(ls, E.base);
            return `<tr><td class="num">${D.br(d)} <span class="mudo">${D.semana(d)}</span></td><td>${esc([...new Set(ls.map((l) => l.veiculo).filter(Boolean))].join(', '))}</td>${cols.map((i) => `<td class="dir">${fmtInd(i, r[i.key], false)}</td>`).join('')}${temInd('nota') ? `<td>${badgeNota(r.nota)}</td>` : ''}</tr>`;
          }).join('') : `<tr><td colspan="${cols.length + 3}"><div class="vazio"><span class="vazio-titulo">Sem registros no período analisado</span><span class="apoio">Escolha outros dias no calendário acima.</span></div></td></tr>`}</tbody></table></div></div></section>`;
    }
    return `
      <button type="button" class="voltar" data-acao="ir" data-href="#/motoristas">‹ Motoristas</button>
      <div class="pag-cab">
        <div class="entidade" style="flex:1;min-width:0">
          ${avatar(m.nome, 44)}
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span class="entidade-nome">${esc(m.nome)}</span>
            <span class="apoio">Motorista · ${esc(m.veiculos.join(', ') || 'sem veículo informado')}</span>
          </div>
          ${badgeStatus(x.st.status)}
          ${temInd('nota') ? badgeNota(x.a.nota) : ''}
        </div>
      </div>
      ${barraPeriodo()}
      <div class="abas" role="tablist">${ABAS.map(([k, rot, n]) => `<button type="button" role="tab" class="aba ${aba === k ? 'ativa' : ''}" aria-selected="${aba === k}" data-acao="aba" data-aba="${k}"><span>${rot}</span>${n !== undefined ? `<span class="aba-cont">${n}</span>` : ''}</button>`).join('')}</div>
      ${corpo}`;
  }

  // ---------- Tela: Comparativo de períodos ----------
  function telaComparativo() {
    const c = calc();
    const escopo = E.comp.escopo;
    const alvo = escopo === 'frota' ? { a: c.frotaA, b: c.frotaB, nome: 'Frota inteira' } : (() => {
      const x = c.mots.find((y) => y.m.id === escopo);
      return x ? { a: x.a, b: x.b, nome: x.m.nome } : { a: c.frotaA, b: c.frotaB, nome: 'Frota inteira' };
    })();
    const ind = IND_MAP[E.comp.ind];
    const linhas = c.mots.map((x) => ({ x, v: X.variacao(ind, x.a[ind.key], x.b[ind.key]) }))
      .sort((p, q) => {
        const dp = p.v.semBase ? null : p.v.delta * (ind.melhor || 1), dq = q.v.semBase ? null : q.v.delta * (ind.melhor || 1);
        if (dp === null) return 1; if (dq === null) return -1;
        return (dq - dp) * (E.comp.ord > 0 ? -1 : 1);
      });
    return `
      <div class="pag-cab"><div class="pag-cab-texto">
        <h1 class="h1">Comparativo de períodos</h1>
        <span class="sub">Planilha de comparativos · ${D.periodoBR(E.A)} × ${D.periodoBR(E.B)}</span>
      </div></div>
      ${barraPeriodo()}
      <div class="alerta alerta-info"><span class="alerta-icone">i</span><div class="alerta-corpo">
        <span class="alerta-titulo">Modelo provisório da planilha de comparativos</span>
        <span class="alerta-texto">As colunas abaixo seguem o padrão Indicador × Período analisado × Comparação × Variação. Quando a planilha padrão de comparativos for enviada, a ordem e os nomes das colunas são ajustados a ela.</span>
      </div></div>
      <section class="card">
        <div class="card-cab">
          <div class="card-cab-texto"><h2 class="h2">${esc(alvo.nome)}</h2><span class="h2-sub">Todos os indicadores, um por linha.</span></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
            <label class="campo-bloco" style="min-width:220px"><span class="campo-rotulo">Escopo</span>
              <select class="campo" data-campo="escopo">
                <option value="frota" ${escopo === 'frota' ? 'selected' : ''}>Frota inteira</option>
                ${c.mots.map((x) => `<option value="${x.m.id}" ${escopo === x.m.id ? 'selected' : ''}>${esc(x.m.nome)}</option>`).join('')}
              </select></label>
            <label class="campo-bloco" style="width:150px"><span class="campo-rotulo">Preço do diesel</span>
              <span class="campo campo-sufixo"><input type="text" inputmode="decimal" data-campo="preco" id="preco-diesel" value="${fmt(E.preco, 2)}" aria-label="Preço do diesel em reais por litro"><span>R$/L</span></span>${E.diesel ? (E.precoManual ? `<button type="button" class="btn-link peq" data-acao="preco-auto">Usar o da Petrobras (R$ ${fmt(Number(E.diesel.preco_br), 2)})</button>` : `<span class="apoio" style="font-size:11px">Petrobras · coleta ${esc(E.diesel.periodo || '')}</span>`) : ''}</label>
            <button type="button" class="btn btn-primario" data-acao="exportar-comparativo">${icone('baixar', 14, '#2B2B2B')}Exportar planilha</button>
          </div>
        </div>
        <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px">
          ${tabelaIndicadores(alvo.a, alvo.b)}
          ${(() => { const e = economia(alvo.a, alvo.b); return e ? `<div style="padding:12px 18px 10px" class="apoio">Com a média de consumo da comparação, os mesmos km teriam usado <b class="num">${fmt(alvo.a.km / alvo.b.kml, 0)} L</b>. ${e.reais >= 0 ? 'Economia' : 'Custo adicional'} estimado: <b class="num">R$ ${fmt(Math.abs(e.reais), 2)}</b> (${fmt(Math.abs(e.litros), 0)} L a R$ ${fmt(E.preco, 2)}/L).</div>` : ''; })()}
        </div>
      </section>
      ${cartaoEvolucaoDiaria(linhasEscopo(), alvo.nome)}
      <section class="card">
        <div class="card-cab">
          <div class="card-cab-texto"><h2 class="h2">Motoristas por indicador</h2><span class="h2-sub">Quem mais melhorou e quem mais piorou em ${esc(ind.label.toLowerCase())}.</span></div>
          ${seletorIndicador('ind-comp', ind.key)}
          <div class="capsula" role="group" aria-label="Ordem">
            <button type="button" class="${E.comp.ord < 0 ? 'ativo' : ''}" data-acao="ord-comp" data-o="-1">Melhores primeiro</button>
            <button type="button" class="${E.comp.ord > 0 ? 'ativo' : ''}" data-acao="ord-comp" data-o="1">Piores primeiro</button>
          </div>
          <button type="button" class="btn" data-acao="exportar-matriz">${icone('baixar', 14, '#5F6368')}Exportar CSV</button>
        </div>
        <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px"><div class="tabela-wrap" style="max-height:520px;overflow:auto">
          <table class="tabela" style="min-width:720px"><thead><tr><th>#</th><th>Motorista</th><th class="dir">Período analisado</th><th class="dir">Comparação</th><th class="dir">Variação</th><th>Resultado</th></tr></thead>
          <tbody>${linhas.map((r, i) => `<tr class="clicavel" data-acao="abrir-motorista" data-id="${r.x.m.id}"><td class="num mudo">${i + 1}</td>
            <td><span class="pessoa">${avatar(r.x.m.nome, 28)}<span class="pessoa-nome">${esc(r.x.m.nome)}</span></span></td>
            <td class="dir">${fmtInd(ind, r.x.a[ind.key])}</td><td class="dir" style="color:var(--texto-2)">${fmtInd(ind, r.x.b[ind.key])}</td>
            <td class="dir">${variacao(r.v)}</td><td>${resultado(r.v, ind)}</td></tr>`).join('')}</tbody></table></div></div>
      </section>`;
  }

  // ---------- Evolução dia a dia: cada dia com planilha ao lado do dia anterior com planilha (folgas e fins de semana são pulados) ----------
  const IND_DIARIO = ['nota', 'kml', 'km', 'litros', 'faixa_verde', 'embalo', 'motor_ocioso', 'pressao_acelerador'];
  function linhasEscopo() {
    const m = E.comp.escopo !== 'frota' && E.base.porId[E.comp.escopo];
    return m ? m.linhas : E.base.linhas;
  }
  // Dias do período analisado; com menos de 2 dias nele (ex.: "Último dia"), os 14 últimos dias com dados até o fim do período
  function evolucaoDiaria(linhas) {
    const porDia = new Map();
    linhas.forEach((l) => { if (l.dias_periodo > 1) return; if (!porDia.has(l.data)) porDia.set(l.data, []); porDia.get(l.data).push(l); });
    let ant = null;
    const todos = [...porDia.keys()].sort().map((d) => {
      const ls = porDia.get(d);
      const r = { data: d, mot: new Set(ls.map((l) => l.motorista)).size, v: X.resumo(ls, E.base), ant };
      ant = r;
      return r;
    });
    const noA = todos.filter((r) => r.data >= E.A.ini && r.data <= E.A.fim);
    const lista = (noA.length >= 2 ? noA : todos.filter((r) => r.data <= E.A.fim).slice(-14)).reverse();
    return { inds: IND_DIARIO.filter(temInd).map((k) => IND_MAP[k]), lista };
  }
  function cartaoEvolucaoDiaria(linhas, nome) {
    const { inds, lista } = evolucaoDiaria(linhas);
    const cab = `<div class="card-cab">
          <div class="card-cab-texto"><h2 class="h2">Evolução dia a dia · ${esc(nome)}</h2><span class="h2-sub">Cada dia comparado ao dia anterior com planilha. Mais recente no topo.</span></div>
          ${lista.length ? `<button type="button" class="btn" data-acao="exportar-evolucao">${icone('baixar', 14, '#5F6368')}Exportar CSV</button>` : ''}
        </div>`;
    if (!lista.length) {
      return `<section class="card">${cab}<div class="card-corpo"><div class="alerta alerta-atencao"><span class="alerta-icone">!</span><div class="alerta-corpo">
        <span class="alerta-titulo">Ainda não há planilhas diárias</span>
        <span class="alerta-texto">As planilhas anexadas são totais de um período. Para comparar dia a dia, anexe uma planilha por dia no perfil do cliente (na de motoristas, início e fim no mesmo dia).</span>
        <div class="alerta-acoes"><a class="btn-link peq" href="${hrefDados()}">Anexar planilhas do cliente</a></div></div></div></div></section>`;
    }
    const rows = lista.map((r) => `<tr>
        <td style="white-space:nowrap"><span style="font-weight:500">${D.br(r.data)}</span> <span class="mudo">${D.semana(r.data)}</span><span class="linha2">${r.ant ? 'vs. ' + D.br(r.ant.data) + ' ' + D.semana(r.ant.data) : 'primeiro dia com dados'}</span></td>
        <td class="dir num">${fmt(r.mot, 0)}</td>
        ${inds.map((ind) => `<td class="dir"><span style="display:block">${fmtInd(ind, r.v[ind.key])}</span>${r.ant ? variacao(X.variacao(ind, r.v[ind.key], r.ant.v[ind.key])) : ''}</td>`).join('')}
      </tr>`).join('');
    return `<section class="card">${cab}
        <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px"><div class="tabela-wrap" style="max-height:520px;overflow:auto">
          <table class="tabela" style="min-width:${260 + inds.length * 110}px"><thead><tr><th>Dia</th><th class="dir">Motoristas</th>${inds.map((ind) => `<th class="dir">${esc(ind.label)}</th>`).join('')}</tr></thead>
          <tbody>${rows}</tbody></table></div></div>
      </section>`;
  }

  // ---------- Tela: Análise dos veículos (por veículo e agrupada por grupo, modelo, filial ou tipo) ----------
  // Roda com a base de veículos no lugar da de motoristas (ver comContexto): período, comparação e status usam o mesmo motor do resto do painel.
  const COLS_VEIC = [['nota', 'Nota Gobrax'], ['km', 'Km rodados'], ['litros', 'Consumo (L)'], ['kml', 'Média km/l'], ['faixa_verde', 'Faixa verde'], ['embalo', 'Embalo'],
    ['motor_ocioso', 'Motor ocioso'], ['pressao_acelerador', 'Pressão do acelerador'], ['excesso_rotacao', 'Acima do verde'], ['tempo_excesso_velocidade', 'Excesso de velocidade (tempo)'],
    ['piloto_automatico', 'Piloto automático'], ['freio_motor', 'Freio motor'], ['frenagens', 'Freadas /100 km'],
    ['frenagens_alta', 'Freadas em alta vel. /100 km'], ['velocidade_media', 'Velocidade média']];
  const DIM_SEM = { grupo: 'Sem grupo', modelo: 'Sem modelo', filial: 'Sem filial', tipo: 'Sem tipo' };
  const ORDEM_ST = { evoluiu: 3, estavel: 2, regrediu: 1, sembase: 0 };
  const dimDoVeic = (x, k) => (x.m.dims && x.m.dims[k] && x.m.dims[k][0]) || '';
  const ehDim = (k) => DIMS.some((d) => d.key === k);

  function selectDim(d, idPrefix) {
    const ops = opcoesDim(d.key, true);
    return `<div class="campo-bloco" style="min-width:150px;max-width:240px"><label class="campo-rotulo" for="${idPrefix}-${d.key}">${d.label}</label>
      <select class="campo" id="${idPrefix}-${d.key}" data-campo="filtro-dim" data-dim="${d.key}" style="height:32px">
        <option value="">${d.plural === 'Filiais' ? 'Todas' : 'Todos'}</option>
        ${ops.map((o) => `<option value="${esc(o)}" ${nrm(o) === nrm(E.filtro[d.key]) ? 'selected' : ''}>${esc(o)}</option>`).join('')}
      </select></div>`;
  }
  function barraFiltrosVeic() {
    const dims = dimsDoVeic();
    if (!dims.length) return '';
    return `<div class="barra-filtros" style="align-items:flex-end;gap:12px;flex-wrap:wrap">${dims.map((d) => selectDim(d, 'fv')).join('')}
      ${filtroAtivo() ? '<button type="button" class="btn-link peq" data-acao="limpar-dim" style="align-self:center">Limpar filtros de grupo</button>' : ''}</div>`;
  }

  // Resumo por grupo/modelo/filial/tipo: soma as linhas de todos os veículos do grupo (período analisado × comparação)
  function agruparVeic(c, dim) {
    const por = new Map();
    c.mots.forEach((x) => {
      const nome = dimDoVeic(x, dim) || DIM_SEM[dim];
      let g = por.get(nome);
      if (!g) { g = { nome, vazio: !dimDoVeic(x, dim), la: [], lb: [], n: 0, rod: 0, par: 0, ev: 0, es: 0, re: 0 }; por.set(nome, g); }
      x.la.forEach((l) => g.la.push(l));
      x.lb.forEach((l) => g.lb.push(l));
      if (x.la.length) {
        g.n++;
        if (x.a.km > 0) g.rod++; else g.par++;
        if (x.st.status === 'evoluiu') g.ev++; else if (x.st.status === 'regrediu') g.re++; else if (x.st.status === 'estavel') g.es++;
      }
    });
    return [...por.values()].filter((g) => g.n > 0).map((g) => Object.assign(g, { a: X.resumo(g.la, E.base), b: X.resumo(g.lb, E.base) }));
  }
  const celInd = (k, a, b) => {
    const ind = IND_MAP[k];
    if (k === 'nota') return `<td>${badgeNota(a.nota)}<span class="linha2">${variacao(X.variacao(ind, a.nota, b.nota))}</span></td>`;
    return `<td class="dir">${fmtInd(ind, a[k])}<span class="linha2">${variacao(X.variacao(ind, a[k], b[k]))}</span></td>`;
  };
  function tabelaGrupos(c, grupos, dim) {
    const cols = COLS_VEIC.filter(([k]) => temInd(k));
    const { col, dir } = E.grupoOrd;
    const val = (g) => (col === 'nome' ? g.nome : col === 'n' ? g.n : g.a[col]);
    const arr = grupos.slice().sort((p, q) => {
      const vp = val(p), vq = val(q);
      if (vp === null || vp === undefined) return 1;
      if (vq === null || vq === undefined) return -1;
      return (typeof vp === 'string' ? vp.localeCompare(vq, 'pt-BR', { numeric: true }) : vp - vq) * dir;
    });
    const th = (k, rot, direita) => `<th class="ord ${direita ? 'dir' : ''}" data-acao="ord-grupo" data-col="${k}" aria-sort="${col === k ? (dir > 0 ? 'ascending' : 'descending') : 'none'}">${rot}${col === k ? `<span class="seta-ord">${dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`;
    const totalKm = c.frotaA.km || 0;
    const evo = (g) => `<span style="color:#1E8E3E">▲ ${g.ev}</span> · <span style="color:#5F6368">▬ ${g.es}</span> · <span style="color:#D93025">▼ ${g.re}</span>`;
    const linhas = arr.map((g) => {
      const filtravel = !g.vazio;
      const sel = nrm(E.filtro[dim]) === nrm(g.nome) && filtravel;
      return `<tr class="${filtravel ? 'clicavel' : ''}" ${filtravel ? `data-acao="filtrar-dim" data-dim="${dim}" data-val="${esc(g.nome)}" title="Filtrar o painel por ${esc(g.nome)}"` : ''} ${sel ? 'aria-selected="true"' : ''}>
        <td><b style="font-weight:600">${esc(g.nome)}</b></td>
        <td class="dir">${g.n}<span class="linha2">${g.rod} rodando${g.par ? ' · ' + g.par + ' parado' + (g.par > 1 ? 's' : '') : ''}</span></td>
        ${cols.map(([k]) => {
          if (k === 'km') return `<td class="dir">${fmtInd(IND_MAP.km, g.a.km)}<span class="linha2">${totalKm > 0 && g.a.km !== null ? fmt((g.a.km / totalKm) * 100, 1) + '% do total' : '—'} · ${variacao(X.variacao(IND_MAP.km, g.a.km, g.b.km))}</span></td>`;
          return celInd(k, g.a, g.b);
        }).join('')}
        <td class="dir">${g.ev + g.es + g.re ? evo(g) : '<span class="mudo">—</span>'}</td></tr>`;
    }).join('');
    const total = `<tr style="background:var(--sup-hover,#F8F9FA)"><td><b>Total da seleção</b></td>
      <td class="dir">${grupos.reduce((t, g) => t + g.n, 0)}<span class="linha2">${grupos.reduce((t, g) => t + g.rod, 0)} rodando · ${grupos.reduce((t, g) => t + g.par, 0)} parado${grupos.reduce((t, g) => t + g.par, 0) === 1 ? '' : 's'}</span></td>
      ${cols.map(([k]) => celInd(k, c.frotaA, c.frotaB)).join('')}<td></td></tr>`;
    return `<div class="tabela-wrap"><table class="tabela" style="min-width:980px"><thead><tr>${th('nome', DIMS.find((d) => d.key === dim).label)}${th('n', 'Veículos', true)}${cols.map(([k, r]) => th(k, r, true)).join('')}<th>Evolução</th></tr></thead>
      <tbody>${linhas}${total}</tbody></table></div>`;
  }

  function veiculosFiltrados(c) {
    const busca = nrm(E.veicLista.busca);
    let arr = c.mots.filter((x) => x.la.length > 0);
    const st = E.veicLista.status;
    if (st === 'parado') arr = arr.filter((x) => !(x.a.km > 0));
    else if (st !== 'todos') arr = arr.filter((x) => x.a.km > 0 && x.st.status === st);
    if (busca) arr = arr.filter((x) => nrm([x.m.nome].concat(DIMS.map((d) => dimDoVeic(x, d.key))).join(' ')).includes(busca));
    const { col, dir } = E.veicOrd;
    const val = (x) => (col === 'placa' ? x.m.nome : ehDim(col) ? dimDoVeic(x, col) : col === 'status' ? ORDEM_ST[x.st.status] : x.a[col]);
    arr.sort((p, q) => {
      const vp = val(p), vq = val(q);
      if (vp === null || vp === undefined || vp === '') return 1;
      if (vq === null || vq === undefined || vq === '') return -1;
      return (typeof vp === 'string' ? vp.localeCompare(vq, 'pt-BR', { numeric: true }) : vp - vq) * dir;
    });
    return arr;
  }

  // Planilhas de período (1 linha = total de vários dias): somar duas que se cruzam conta km e litros em dobro
  function avisoCobertura(bv) {
    if (!temTotais(bv)) return '';
    const ver = (p, rot) => {
      const ls = X.filtrar(bv.linhas, p).filter((l) => l.dias_periodo > 1);
      if (!ls.length) return '';
      const datas = new Set(ls.map((l) => l.data));
      const parcial = ls.some((l) => D.somar(l.data, -(l.dias_periodo - 1)) < p.ini);
      if (datas.size > 1) return `${rot}: o período junta ${datas.size} planilhas (${[...datas].sort().map(D.br).join(', ')}) e soma os km e litros de cada uma. Para comparar planilhas, use “Última planilha”.`;
      if (parcial) return `${rot}: a planilha de ${D.br([...datas][0])} cobre ${ls[0].dias_periodo} dias e começa antes do período escolhido; os números mostram a planilha inteira, não só os dias do período.`;
      return '';
    };
    const msgs = [ver(E.A, 'Período analisado'), ver(E.B, 'Comparação')].filter(Boolean);
    return msgs.length ? `<div class="alerta alerta-atencao" role="status"><span class="alerta-icone">!</span><div class="alerta-corpo"><span class="alerta-titulo">Atenção ao período escolhido</span>${msgs.map((m) => `<span class="alerta-texto">${esc(m)}</span>`).join('')}
      <div class="alerta-acoes"><button type="button" class="btn-link peq" data-acao="periodo-rapido" data-k="ultima">Ver a última planilha contra a anterior</button></div></div></div>` : '';
  }
  function telaVeiculos() {
    const cab = (sub) => `<div class="pag-cab"><div class="pag-cab-texto"><h1 class="h1">Veículos e grupos</h1><span class="sub">${sub}</span></div></div>`;
    if (!E.veic) {
      return cab('Importe a planilha de veículos para ver o desempenho de cada caminhão e de cada grupo.') +
        `<section class="card"><div class="card-corpo"><div class="vazio"><span class="vazio-icone">${icone('subir', 15, '#5F6368')}</span><span class="vazio-titulo">Nenhuma planilha de veículos importada</span>
        <a class="btn btn-primario" href="${hrefDados()}" style="text-decoration:none;margin-top:4px">Anexar planilhas do cliente</a></div></div></section>${cartaoOdometro()}`;
    }
    const bv = baseVeic();
    if (!bv || E.base !== bv) {
      return cab(`Nenhum veículo encontrado${descFiltro() ? ' para ' + esc(descFiltro()) : ''}.`) +
        `<section class="card"><div class="card-corpo" style="gap:12px">${barraFiltrosVeic()}<div class="vazio"><span class="vazio-titulo">Sem veículos com esses filtros</span>
        <button type="button" class="btn" data-acao="limpar-dim">Limpar filtros</button></div></div></section>`;
    }
    const c = calc();
    const todos = c.mots.filter((x) => x.la.length > 0);
    const rodando = todos.filter((x) => x.a.km > 0), parados = todos.length - rodando.length;
    const soAnterior = c.mots.length - todos.length;
    const dims = dimsDoVeic();
    if (!dims.some((d) => d.key === E.grupoPor)) E.grupoPor = dims.length ? dims[0].key : 'grupo';
    const grupos = dims.length ? agruparVeic(c, E.grupoPor) : [];
    const nGrupos = DIMS.find((d) => d.key === 'grupo') && dims.some((d) => d.key === 'grupo') ? new Set(todos.map((x) => dimDoVeic(x, 'grupo')).filter(Boolean)).size : 0;
    const kpis = ['nota', 'kml', 'faixa_verde', 'motor_ocioso', 'km'].map((k) => kpi(k, c.frotaA, c.frotaB, {})).join('');

    // lista de veículos
    const arr = veiculosFiltrados(c);
    const L = E.veicLista;
    const pags = Math.max(1, Math.ceil(arr.length / L.por));
    if (L.pag > pags) L.pag = pags;
    const pagina = arr.slice((L.pag - 1) * L.por, L.pag * L.por);
    const colunas = [['placa', 'Veículo', false]].concat(dims.map((d) => [d.key, d.label, false]), [['status', 'Evolução', false]], COLS_VEIC.filter(([k]) => temInd(k)).map(([k, r]) => [k, r, k !== 'nota']));

      const el = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.cor}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(p.rot)}: ${p.valor}</title></circle>`;
      off += len; return el;
    }).join('');
    return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${esc(partes.map((p) => p.valor + ' ' + p.rot).join(', '))}" style="flex:none">

  // ---------- HubSpot ao vivo: consulta o conector do próprio usuário e atualiza a cada 60 s ----------
  const vivo = {};          // chave do cliente -> { calls, emails, deals, em, erro }

  async function obterMcp() {

  // Busca no HubSpot agora (ao abrir e a cada clique em "Atualizar"); sem consulta automática em segundo plano
  async function atualizarHub(r) {
    const v = (vivo[r.chave] = vivo[r.chave] || {});
    if (v.carregando || !r.hubspot_id) return;
    v.carregando = true; v.erro = null; redesenharRel();
    const mcp = await obterMcp();
    if (!mcp) { v.carregando = false; v.erro = 'sem_mcp'; redesenharRel(); return; }
    const filtro = [{ filters: [{ propertyName: 'associations.company', operator: 'EQ', value: String(r.hubspot_id) }] }];
    const buscar = (tipo, props) => mcp.callTool('HubSpot', 'search_crm_objects', { objectType: tipo, filterGroups: filtro, properties: props, limit: 100 }, { cache: false }).then((res) => res && res.payload);
    try {
      const [calls, emails, deals] = await Promise.all([
        buscar('calls', ['hs_timestamp', 'hs_call_status']),
        buscar('emails', ['hs_timestamp', 'hs_email_direction']),
        buscar('deals', ['dealname', 'amount', 'closedate', 'hs_is_closed_won', 'createdate'])
      ]);
      if (![calls, emails, deals].every((x) => x && typeof x === 'object')) throw { code: 'upstream_error' };
      v.calls = calls; v.emails = emails; v.deals = deals; v.em = Date.now(); v.erro = null;
