    v.carregando = false; redesenharRel();
  }
  function vigiarHubspot() {
    (E.rel || []).forEach((r) => { if (r.hubspot_id && !vigiando.has(r.chave)) { vigiando.add(r.chave); atualizarHub(r); } });
  }
  function vivoParaRel(r) {
    const v = vivo[r.chave];
    if (!v || !v.calls || !v.emails || !v.deals) return null;
    const dia = (t) => (t ? String(t).slice(0, 10) : '');
    const maxTs = (arr) => arr.reduce((m, o) => { const t = o.properties && o.properties.hs_timestamp; return t && t > m ? t : m; }, '');
    const cr = v.calls.results || [], er = v.emails.results || [], dr = v.deals.results || [];
    const ligacoes = { total: v.calls.total, ultima: dia(maxTs(cr)) };
    const emails = { total: v.emails.total, ultimo: dia(maxTs(er)) };
    if (cr.length === v.calls.total) { ligacoes.completadas = cr.filter((o) => o.properties.hs_call_status === 'COMPLETED').length; }
    if (er.length === v.emails.total) { emails.recebidos = er.filter((o) => o.properties.hs_email_direction === 'INCOMING_EMAIL').length; emails.enviados = er.length - emails.recebidos; }
    const negocios = dr.map((o) => {
      const p = o.properties || {}, nome = p.dealname || '';
      const ganho = p.hs_is_closed_won === 'true';
      const churn = /^churn confirmado/i.test(nome);
      return { nome, data: dia(p.closedate) || dia(p.createdate), valor: p.amount === undefined || p.amount === '' ? null : Number(p.amount), resultado: churn ? 'Churn' : ganho ? 'Ganho' : 'Aberto', ord: p.closedate || p.createdate || '' };
    }).sort((a, b) => (a.ord < b.ord ? 1 : -1));
    const churn = negocios.find((n) => n.resultado === 'Churn');
    return Object.assign({}, r, {
      ligacoes: Object.assign({}, r.ligacoes, ligacoes), emails: Object.assign({}, r.emails, emails),
      negocios, negocios_total: v.deals.total, contratos_ganhos: negocios.filter((n) => n.resultado === 'Ganho').length,
      situacao: churn ? 'Churn confirmado em ' + D.br(churn.data) : r.situacao, atualizado: dia(new Date(v.em).toISOString()), _vivo: true, _em: v.em
    });
  }


  // ---------- Radar automático: leitura dos indicadores em frases, recalculada a cada mudança ----------
  function radarAuto() {
    if (!E.base) return '';
    const c = calc();
    if (!c.la.length) return '';
    const A = c.frotaA, B = c.frotaB, itens = [];
    const dv = (k) => X.variacao(IND_MAP[k], A[k], B[k]);
    const t = (cls, icone, html) => itens.push({ cls, icone, html });
    const e = economia(A, B);
    if (e && Math.abs(e.reais) >= 1) t(e.reais >= 0 ? 'ok' : 'ruim', e.reais >= 0 ? '▼' : '▲', e.reais >= 0 ? `A frota <b>economizou R$ ${fmt(e.reais, 0)}</b> em diesel (${fmt(Math.abs(e.litros), 0)} L) em relação ao consumo do período anterior.` : `O consumo piorou e custou <b>R$ ${fmt(Math.abs(e.reais), 0)} a mais</b> em diesel (${fmt(Math.abs(e.litros), 0)} L) frente ao período anterior.`);
    const vk = dv('kml');
    if (!vk.semBase && !vk.estavel) t(vk.sentido === 'melhor' ? 'ok' : 'ruim', vk.sentido === 'melhor' ? '▲' : '▼', `Média de consumo em <b>${fmtInd(IND_MAP.kml, A.kml)}</b>, <b>${vk.texto}</b> vs. período anterior.`);
    if (c.cont.regrediu) t('ruim', '!', `<b>${c.cont.regrediu} ${c.cont.regrediu === 1 ? 'motorista piorou' : 'motoristas pioraram'}</b> a nota. Veja o Plano de ação para saber por onde começar.`);
    if (c.cont.evoluiu) t('ok', '✓', `<b>${c.cont.evoluiu} ${c.cont.evoluiu === 1 ? 'motorista evoluiu' : 'motoristas evoluíram'}</b>: vale reconhecer o resultado.`);
    const vo = dv('motor_ocioso');
    if (A.motor_ocioso > 0) t(A.motor_ocioso >= 10 || vo.sentido === 'pior' ? 'atencao' : 'neutro', '•', `Motor ligado parado em <b>${fmtInd(IND_MAP.motor_ocioso, A.motor_ocioso)}</b> do tempo${vo.semBase ? '' : ' (' + vo.texto + ')'}.`);
    const crit = c.mots.filter((x) => x.a.nota > 0 && x.a.nota < 40).length;
    if (crit) t('ruim', '!', `<b>${crit} ${crit === 1 ? 'motorista com nota crítica' : 'motoristas com nota crítica'}</b> (abaixo de 40) pedem acompanhamento imediato.`);
    const vd = dv('km_dia');
    if (A.km_dia > 0) t(vd.sentido === 'pior' ? 'atencao' : 'neutro', '•', `Cada dia trabalhado rendeu <b>${fmtInd(IND_MAP.km_dia, A.km_dia)}</b>${vd.semBase ? '' : ' (' + vd.texto + ')'}.`);
    if (!itens.length) return '';
    return `<section class="radar" aria-label="Radar automático">
      <div class="radar-cab"><span class="radar-pulso" aria-hidden="true"></span><b>Radar automático</b>
        <span class="radar-sub">leitura de ${fmt(c.la.length, 0)} registros de ${fmt(c.mots.length, 0)} motoristas, atualizada a cada filtro</span></div>
      <div class="radar-scan" aria-hidden="true"></div>
      <ul class="radar-lista">${itens.slice(0, 6).map((i, n) => `<li class="radar-i radar-${i.cls}" style="--n:${n}"><span class="radar-ic">${i.icone}</span><span>${i.html}</span></li>`).join('')}</ul>
    </section>`;
  }

  // ---------- Animação dos números (só quando a tela, o cliente ou o período mudam) ----------
  let ultimaAnim = '';
  function animarNumeros(raiz) {
    const reduzir = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduzir) return;
    raiz.querySelectorAll('.kpi-valor, .exec-val, .plano-grande, .radar-i b, .gauge-num').forEach((el) => {
      const no = Array.from(el.childNodes).find((n) => n.nodeType === 3 && /\d/.test(n.nodeValue));
      if (!no) return;
      const m = no.nodeValue.match(/(\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?/);
      if (!m) return;
      const casas = m[2] ? m[2].length : 0;
      const alvo = parseFloat(m[1].replace(/\./g, '') + (m[2] ? '.' + m[2] : ''));
      if (!isFinite(alvo) || alvo === 0) return;
      const antes = no.nodeValue.slice(0, m.index), depois = no.nodeValue.slice(m.index + m[0].length);
      const t0 = performance.now(), dur = 900 + Math.min(600, alvo > 1000 ? 300 : 0);
      const passo = (agora) => {
        const p = Math.max(0, Math.min(1, (agora - t0) / dur)), f = 1 - Math.pow(1 - p, 3);   // o 1º quadro pode vir com hora anterior a t0
        no.nodeValue = antes + fmt(alvo * f, casas) + depois;
        if (p < 1) requestAnimationFrame(passo); else no.nodeValue = antes + fmt(alvo, casas) + depois;
      };
      requestAnimationFrame(passo);
    });
  }


  // ---------- Relacionamento (HubSpot ao vivo, com cópia gravada no banco do painel como reserva) ----------
  function cartaoRelacionamento(todosClientes) {
    const todos = E.rel || [];
    const sel = todosClientes ? '' : ckey(E.cliente || '');
    const lista = sel ? todos.filter((r) => ckey(r.cliente) === sel || sel.includes(ckey(r.chave))) : todos;
    if (!lista.length) return '';
    const dt = (v) => (v ? D.br(v) : '—');
    const item = (r0) => {
      const r = vivoParaRel(r0) || r0;
      const erro = vivo[r0.chave] && vivo[r0.chave].erro;
      const selo = r._vivo
        ? `<span class="badge badge-ok" title="Dados lidos direto do HubSpot">Dados do HubSpot</span>`
        : `<span class="badge badge-neutro" title="Última cópia gravada no painel">${r0.simulado ? 'Simulação' : vivo[r0.chave] && vivo[r0.chave].carregando ? 'Buscando no HubSpot…' : 'Cópia gravada'}</span>`;
      const l = r.ligacoes || {}, em = r.emails || {};
      const churn = /churn/i.test(r.situacao || '');
      const neg = (r.negocios || []).map((n) => `<tr><td>${esc(n.nome)}</td><td>${n.data ? D.br(n.data) : '—'}</td><td class="dir num">${n.valor === null || n.valor === undefined ? '—' : 'R$ ' + fmt(n.valor, 2)}</td><td><span class="badge ${n.resultado === 'Ganho' ? 'badge-ok' : n.resultado === 'Churn' ? 'badge-critico' : 'badge-neutro'}">${esc(n.resultado)}</span></td></tr>`).join('');
      return `<section class="card rel-card">
        <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Relacionamento com o cliente · ${esc(r.cliente)}</h2>
          <span class="h2-sub">Fonte: ${esc(r.fonte || 'HubSpot')} · ${r.simulado ? 'dados simulados, não vêm do HubSpot' : r._vivo ? 'consultado no HubSpot às ' + new Date(r._em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'cópia gravada em ' + dt(r.atualizado)}</span></div>
          <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${selo}${r0.simulado ? '' : `<button type="button" class="btn" data-acao="hub-atualizar" data-id="${esc(r0.chave)}" ${vivo[r0.chave] && vivo[r0.chave].carregando ? 'disabled' : ''}>${vivo[r0.chave] && vivo[r0.chave].carregando ? 'Atualizando…' : 'Atualizar do HubSpot'}</button>`}${r.situacao ? `<span class="badge ${churn ? 'badge-critico' : 'badge-atencao'}">${esc(r.situacao)}</span>` : ''}</span></div>
        <div class="card-corpo">
          ${erro && MSG_ERRO[erro] ? `<div class="alerta alerta-atencao"><span class="alerta-icone">!</span><div class="alerta-corpo"><span class="alerta-texto">${esc(MSG_ERRO[erro])} Enquanto isso, mostrando a última cópia gravada.</span></div></div>` : ''}
          <div class="grade-kpi">
            <div class="kpi"><span class="kpi-titulo">Contratos fechados</span><span class="kpi-valor">${fmt(r.contratos_ganhos || 0, 0)}</span><span class="kpi-ref">de ${fmt(r.negocios_total || 0, 0)} negócios no HubSpot</span></div>
            <div class="kpi"><span class="kpi-titulo">Chamadas</span><span class="kpi-valor">${fmt(l.total || 0, 0)}</span><span class="kpi-ref">${l.completadas === undefined ? '' : fmt(l.completadas, 0) + ' completadas · '}última em ${dt(l.ultima)}</span></div>
            <div class="kpi"><span class="kpi-titulo">E-mails</span><span class="kpi-valor">${fmt(em.total || 0, 0)}</span><span class="kpi-ref">${em.enviados === undefined ? '' : fmt(em.enviados, 0) + ' enviados · ' + fmt(em.recebidos || 0, 0) + ' recebidos · '}último em ${dt(em.ultimo)}</span></div>
          </div>
          ${r.motivos ? `<p class="apoio" style="margin:12px 0 0"><b>Motivos do cancelamento:</b> ${esc(r.motivos)}</p>` : ''}
          ${neg ? `<div class="tabela-wrap" style="margin-top:12px"><table class="tabela"><thead><tr><th>Negócio</th><th>Data</th><th class="dir">Valor</th><th>Resultado</th></tr></thead><tbody>${neg}</tbody></table></div>` : ''}
        </div></section>`;
    };
    return lista.map(item).join('');
  }

  // ---------- Tela: Plano de ação (rentabilidade, produtividade e próximos passos) ----------
  function planoDados() {
    const c = calc();
    const A = c.frotaA, B = c.frotaB;
    const comKm = c.mots.filter((x) => x.a.km > 0 && x.a.kml > 0 && x.a.litros > 0);
    // Referência interna: média do quarto mais econômico (km/l) entre os motoristas do período
    let ref = null;
    if (comKm.length >= 4) {
      const ord = comKm.slice().sort((p, q) => q.a.kml - p.a.kml);
      const n = Math.max(1, Math.round(ord.length / 4));
      ref = ord.slice(0, n).reduce((s, x) => s + x.a.kml, 0) / n;
    }
    const abaixo = ref ? comKm.map((x) => ({ x, litros: x.a.litros - x.a.km / ref })).filter((o) => o.litros > 0).sort((p, q) => q.litros - p.litros) : [];
    const litrosPot = abaixo.reduce((s, o) => s + o.litros, 0);
    const dias = D.dias(E.A);
    const fator = dias > 0 ? 30 / dias : 0;
    return { c, A, B, comKm, ref, abaixo, litrosPot, reaisPot: litrosPot * E.preco, mensal: litrosPot * E.preco * fator, dias };
  }
  function planoLinha(x, textoDir, pct, cor) {
    return `<a class="plano-lin" href="${linkMotorista(x.m.id)}">${avatar(x.m.nome, 26)}
      <span class="plano-nome">${esc(x.m.nome)}</span>
      <span class="plano-barra"><i style="width:${Math.max(4, Math.min(100, pct))}%;background:${cor}"></i></span>
      <span class="plano-val num">${textoDir}</span></a>`;
  }
  function planoCartao(o) {
    const cls = o.prio === 'Alta' ? 'badge-critico' : o.prio === 'Média' ? 'badge-atencao' : 'badge-ok';
    return `<section class="card plano-card plano-${o.prio === 'Alta' ? 'alta' : o.prio === 'Média' ? 'media' : 'baixa'}">
      <div class="plano-topo"><span class="badge ${cls}">Prioridade ${o.prio}</span><span class="plano-tema">${o.tema}</span></div>
      <h3 class="plano-tit">${o.titulo}</h3>
      <div class="plano-num"><span class="plano-grande num">${o.grande}</span><span class="plano-peq">${o.pequeno || ''}</span></div>
      <p class="plano-txt">${o.texto}</p>
      <div class="plano-lista">${o.linhas || ''}</div>
      <div class="plano-passo"><strong>Próximo passo</strong><span>${o.passo}</span></div>
    </section>`;
  }
  function telaPlano() {
    const P = planoDados();
    const { c, A, B } = P;
    const semAnterior = !c.lb.length;
    const e = economia(A, B);
    const dif = (k) => X.variacao(IND_MAP[k], A[k], B[k]);
    // ---- Faixa executiva ----
    const num = (rot, val, delta, apoio) => `<div class="exec-i"><span class="exec-rot">${rot}</span><span class="exec-val num">${val}</span><span class="exec-var">${delta || ''}</span><span class="exec-apo">${apoio || ''}</span></div>`;
    const dv = (k, ap) => { const v = dif(k); return v.semBase ? '<span class="exec-neutro">sem período anterior</span>' : `<span class="exec-${v.sentido === 'melhor' ? 'bom' : v.sentido === 'pior' ? 'ruim' : 'neutro'}">${v.texto} ${ap || ''}</span>`; };
    const resultado = e ? num(e.reais >= 0 ? 'Economia no período' : 'Custo adicional no período', 'R$ ' + fmt(Math.abs(e.reais), 0), `<span class="exec-${e.reais >= 0 ? 'bom' : 'ruim'}">${e.reais >= 0 ? '▼' : '▲'} ${fmt(Math.abs(e.litros), 0)} L de diesel</span>`, 'vs. consumo do período anterior')
      : num('Economia no período', '—', '<span class="exec-neutro">sem período anterior</span>', 'precisa de dias anteriores');
    const potencial = P.ref ? num('Potencial de economia', 'R$ ' + fmt(P.reaisPot, 0), `<span class="exec-bom">≈ R$ ${fmt(P.mensal, 0)} por mês</span>`, `${fmt(P.litrosPot, 0)} L se todos chegassem a ${fmt(P.ref, 2)} km/l`)
      : num('Potencial de economia', '—', '<span class="exec-neutro">poucos motoristas</span>', 'precisa de 4+ motoristas com consumo');
    const faixa = `<section class="exec">
      <div class="exec-cab"><span class="exec-tit">Resultado da operação</span><span class="exec-sub">${D.periodoBR(E.A)}${semAnterior ? '' : ' · comparado a ' + D.periodoBR(E.B)}</span></div>
      <div class="exec-grade">
        ${resultado}${potencial}
        ${num('Média de consumo', fmtInd(IND_MAP.kml, A.kml), dv('kml'), P.ref ? 'meta interna ' + fmt(P.ref, 2) + ' km/l' : '')}
        ${num('Km por dia trabalhado', fmtInd(IND_MAP.km_dia, A.km_dia), dv('km_dia'), fmt(A.dias, 0) + ' dias trabalhados')}
        ${num('Nota Gobrax', fmtInd(IND_MAP.nota, A.nota), dv('nota'), fmt(c.mots.length, 0) + ' motoristas ativos')}
      </div>
      <div class="exec-nota">Potencial = diesel a mais que os motoristas abaixo da referência gastaram no período, a R$ ${fmt(E.preco, 2)}/L (ajuste na aba Comparativo). A referência é a média do quarto mais econômico da própria operação. É uma estimativa para priorizar, não uma meta garantida.</div>
    </section>`;

    // ---- Ações priorizadas ----
    const ac = [];
    if (P.ref && P.abaixo.length) {
      const top = P.abaixo.slice(0, 5), mx = top[0].litros;
      ac.push({ ord: 100 + P.reaisPot, prio: 'Alta', tema: 'Rentabilidade', titulo: 'Consumo acima da referência',
        grande: 'R$ ' + fmt(P.reaisPot, 0), pequeno: `no período · ${P.abaixo.length} de ${P.comKm.length} motoristas`,
        texto: `Esses motoristas gastaram mais diesel que o necessário para os mesmos km. A referência é ${fmt(P.ref, 2)} km/l.`,
        linhas: top.map((o) => planoLinha(o.x, `${fmt(o.x.a.kml, 2)} km/l · R$ ${fmt(o.litros * E.preco, 0)}`, (o.litros / mx) * 100, 'var(--critico)')).join(''),
        passo: 'Acompanhar os primeiros da lista com o instrutor: revisar faixa verde, pressão do acelerador e motor ocioso de cada um.' });
    }
    const regr = c.mots.filter((x) => x.st.status === 'regrediu' && x.st.delta !== null).sort((p, q) => p.st.delta - q.st.delta);
    if (regr.length) {
      const share = regr.length / c.mots.length, top = regr.slice(0, 5), mx = Math.abs(top[0].st.delta) || 1, ind = IND_MAP[top[0].st.ind];
      ac.push({ ord: 60 + share * 100, prio: share >= 0.25 ? 'Alta' : 'Média', tema: 'Evolução', titulo: 'Motoristas que pioraram',
        grande: fmt(regr.length, 0), pequeno: `de ${c.mots.length} motoristas (${fmt(share * 100, 0)}%)`,
        texto: 'Pioraram em relação ao período anterior. Agir cedo evita que o resultado vire hábito.',
        linhas: top.map((x) => planoLinha(x, `${fmtInd(ind, x.b[ind.key])} → ${fmtInd(ind, x.a[ind.key])}`, (Math.abs(x.st.delta) / mx) * 100, 'var(--atencao)')).join(''),
        passo: 'Conversar individualmente com os que mais caíram e entender o que mudou: rota, veículo ou carga.' });
    }
    // Motor ocioso
    const oc = c.mots.filter((x) => x.a.motor_ocioso > 0).sort((p, q) => q.a.motor_ocioso - p.a.motor_ocioso);
    if (oc.length) {
      const top = oc.slice(0, 5), mx = top[0].a.motor_ocioso, v = dif('motor_ocioso');
      const alto = A.motor_ocioso >= 10 || v.sentido === 'pior';
      ac.push({ ord: alto ? 55 : 20, prio: A.motor_ocioso >= 10 ? 'Alta' : alto ? 'Média' : 'Baixa', tema: 'Rentabilidade', titulo: 'Motor ligado parado',
        grande: fmtInd(IND_MAP.motor_ocioso, A.motor_ocioso), pequeno: v.semBase ? 'do tempo ligado' : v.texto + ' vs. anterior',
        texto: 'Diesel queimado sem rodar nenhum km. Os maiores tempos parados estão abaixo.',
        linhas: top.map((x) => planoLinha(x, fmtInd(IND_MAP.motor_ocioso, x.a.motor_ocioso), (x.a.motor_ocioso / mx) * 100, 'var(--atencao)')).join(''),
        passo: 'Orientar o desligamento do motor em esperas e carga/descarga; priorizar quem aparece no topo.' });
    }
    // Faixa verde
    const fv = c.mots.filter((x) => x.a.faixa_verde > 0).sort((p, q) => p.a.faixa_verde - q.a.faixa_verde);
    if (fv.length) {
      const top = fv.slice(0, 5), v = dif('faixa_verde'), baixo = A.faixa_verde < 60;
      ac.push({ ord: baixo ? 50 : 18, prio: baixo ? 'Alta' : v.sentido === 'pior' ? 'Média' : 'Baixa', tema: 'Condução', titulo: 'Faixa verde baixa',
        grande: fmtInd(IND_MAP.faixa_verde, A.faixa_verde), pequeno: v.semBase ? 'do tempo na faixa' : v.texto + ' vs. anterior',
        texto: 'Quanto mais tempo na faixa de rotação econômica, menor o consumo. Estes motoristas têm o menor índice.',
        linhas: top.map((x) => planoLinha(x, fmtInd(IND_MAP.faixa_verde, x.a.faixa_verde), x.a.faixa_verde, 'var(--atencao)')).join(''),
        passo: 'Treinar uso de marchas e rotação com os de menor faixa verde; repetir a medição na semana seguinte.' });
    }
    // Produtividade
    const kd = c.mots.filter((x) => x.a.km_dia > 0).sort((p, q) => p.a.km_dia - q.a.km_dia);
    if (kd.length) {
      const top = kd.slice(0, 5), mx = Math.max.apply(null, kd.map((x) => x.a.km_dia)), v = dif('km_dia'), vd = dif('dias');
      const pior = v.sentido === 'pior' || vd.sentido === 'pior';
      ac.push({ ord: pior ? 58 : 25, prio: pior ? 'Alta' : 'Média', tema: 'Produtividade', titulo: 'Menor rendimento por dia trabalhado',
        grande: fmtInd(IND_MAP.km_dia, A.km_dia), pequeno: (v.semBase ? '' : v.texto + ' vs. anterior · ') + fmt(A.dias, 0) + ' dias trabalhados',
        texto: 'Veículo parado ou rodando pouco também custa. Estes motoristas rodam menos nos dias em que trabalham.',
        linhas: top.map((x) => planoLinha(x, `${fmtInd(IND_MAP.km_dia, x.a.km_dia)} · ${fmt(x.a.dias, 0)} d`, (x.a.km_dia / mx) * 100, 'var(--texto-3)')).join(''),
        passo: 'Verificar escala, rotas e tempo de espera dos que rodam menos; avaliar redistribuir viagens.' });
    }
    // Notas críticas
    const crit = c.mots.filter((x) => x.a.nota > 0 && x.a.nota < 40).sort((p, q) => p.a.nota - q.a.nota);
    if (crit.length) {
      const top = crit.slice(0, 5);
      ac.push({ ord: 70, prio: 'Alta', tema: 'Segurança', titulo: 'Notas críticas',
        grande: fmt(crit.length, 0), pequeno: 'com nota abaixo de 40',
        texto: 'São os motoristas que mais precisam de acompanhamento imediato.',
        linhas: top.map((x) => planoLinha(x, fmtInd(IND_MAP.nota, x.a.nota), x.a.nota, 'var(--critico)')).join(''),
        passo: 'Abrir plano individual com o instrutor e reavaliar em 7 dias.' });
    }
    ac.sort((p, q) => q.ord - p.ord);

    const conteudo = semAnterior
      ? '<div class="alerta alerta-atencao"><span class="alerta-icone">!</span><div class="alerta-corpo"><span class="alerta-titulo">Sem período anterior para comparar</span><span class="alerta-texto">A evolução (melhorou ou piorou) aparece quando houver dados do período anterior. As prioridades abaixo já usam o período atual.</span></div></div>'
      : '';
    return `<div class="pag-cab"><div class="pag-cab-texto"><h1 class="h1">Plano de ação</h1>
        <span class="sub">Onde atuar para reduzir custo e aumentar produtividade</span></div></div>
      ${barraPeriodo()}
      ${semDadosNoPeriodo(c.la.length)}
      ${conteudo}
      ${faixa}
      ${radarAuto()}
      ${cartaoRelacionamento()}
      <div class="plano-sec"><h2 class="plano-h2">Onde trabalhar primeiro</h2><span class="apoio">Ordenado pelo impacto estimado e pelo que piorou. Clique no motorista para ver o detalhe.</span></div>
      ${ac.length ? `<div class="plano-grade">${ac.map(planoCartao).join('')}</div>` : '<section class="card"><div class="card-corpo"><div class="vazio"><span class="vazio-titulo">Nada crítico neste período</span><span class="apoio">Os indicadores não apontam pontos de atenção.</span></div></div></section>'}`;
  }

  function fluxoRetencao(trs) {
    const rotE = { nao: 'Não iniciada', and: 'Em andamento', ok: 'Concluída' }, badE = { nao: 'badge-neutro', and: 'badge-atencao', ok: 'badge-ok' };
    const passos = ETAPAS.map((e, i) => {
      const rs = trs.filter((t) => t.etapa === e.k);

      return `<div class="fluxo-e fluxo-${estado}"><span class="fluxo-n" style="background:${e.cor};color:${e.k === 'plataforma' ? '#2B2B2B' : '#fff'}">${e.n}</span>

          <span class="fluxo-st"><span class="badge ${badE[estado]}">${rotE[estado]}</span>${rs.length ? `<span class="apoio">${rs.length} ${rs.length === 1 ? 'registro' : 'registros'} · último em ${D.br(ult)}</span>` : ''}</span></div></div>${i < ETAPAS.length - 1 ? '<span class="fluxo-seta" aria-hidden="true">›</span>' : ''}`;
    }).join('');
    return `<section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Fluxo da retenção</h2><span class="h2-sub">Em que etapa está o trabalho com este cliente.</span></div></div><div class="card-corpo"><div class="fluxo">${passos}</div></div></section>`;
  }
  function graficoTrat(ls, bt, ind, trs) {
    const vazio = '<div class="vazio"><span class="apoio">Sem dados suficientes para o gráfico deste indicador.</span></div>';
    const datas = ls.map((l) => l.data).filter(Boolean).sort();
    if (!bt || datas.length < 3) return vazio;
    const p = { ini: datas[0], fim: datas[datas.length - 1] };
    const serie = X.serieDiaria(ls, ind, p, bt), n = serie.length;
    const mm = serie.map((_, i) => { const j = serie.slice(Math.max(0, i - 6), i + 1).map((s) => s.valor).filter((v) => v !== null); return j.length >= 3 ? j.reduce((s, v) => s + v, 0) / j.length : null; });
    const vals = serie.map((s) => s.valor).filter((v) => v !== null);
    if (vals.length < 3) return vazio;
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = (hi - lo) * 0.1 || Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad;
    if (lo < 0 && vals.every((v) => v >= 0)) lo = 0;
    const W = 1000, H = 300, m = { l: 54, r: 18, t: 40, b: 30 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const x = (i) => m.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw), y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ind.label)} do cliente ao longo do tempo, com as tratativas marcadas" style="width:100%;height:auto;display:block">`;
    [0, 1, 2, 3].map((k) => lo + ((hi - lo) * k) / 3).forEach((t) => {
      s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#F1F3F4"/><text x="${m.l - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="#9AA0A6">${fmt(t, ind.casas)}</text>`;
    });
    const passo = Math.max(1, Math.ceil(n / 8));
    for (let i = 0; i < n; i += passo) s += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#9AA0A6">${D.curta(serie[i].data)}</text>`;
    const caminho = (arr) => { let d = ''; arr.forEach((v, i) => { if (v === null) return; d += (d ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1); }); return d; };
    s += `<path d="${caminho(serie.map((q) => q.valor))}" fill="none" stroke="#DADCE0" stroke-width="1.5" stroke-linejoin="round"/>`;
    const idx = mm.map((v, i) => (v === null ? null : i)).filter((i) => i !== null);
    if (idx.length > 1) s += `<path d="${caminho(mm)}L${x(idx[idx.length - 1]).toFixed(1)},${m.t + ih}L${x(idx[0]).toFixed(1)},${m.t + ih}Z" fill="#FFF6BD" opacity=".6"/>`;
    s += `<path d="${caminho(mm)}" fill="none" stroke="#FCB709" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    trs.forEach((t, k) => {
      if (t.data < p.ini || t.data > p.fim) return;
      const i = serie.findIndex((q) => q.data >= t.data), et = ETAPA_MAP[t.etapa] || ETAPAS[1], xx = x(i).toFixed(1);
      s += `<g><title>${k + 1} · ${D.br(t.data)} · ${esc(t.titulo)}</title><line x1="${xx}" x2="${xx}" y1="${m.t - 8}" y2="${m.t + ih}" stroke="${et.cor}" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="${xx}" cy="17" r="12" fill="${et.cor}" stroke="#fff" stroke-width="2"/><text x="${xx}" y="21.5" text-anchor="middle" font-size="13" font-weight="700" fill="${t.etapa === 'plataforma' ? '#2B2B2B' : '#fff'}">${k + 1}</text></g>`;
    });
    return s + '</svg>';
  }

  async function salvarTrat() {

    } catch (e) { toast('Não foi possível salvar. Você pode não ter permissão para editar este painel.', 'erro'); return; }

    return `<div class="pag-cab"><div class="pag-cab-texto"><h1 class="h1">Saúde do cliente</h1>
        <span class="sub">${D.periodoBR(E.A)} comparado a ${D.periodoBR(E.B)} · histórico da retenção: o que foi combinado e o que mudou nos números</span></div>${alterna}</div>
      ${barraPeriodo()}
      ${resumo}${E.churnVista === 'cliente' && !sel ? '<div class="alerta alerta-atencao"><span class="alerta-icone">!</span><div class="alerta-corpo"><span class="alerta-texto">Este cliente não tem dados no período escolhido.</span><div class="alerta-acoes"><button type="button" class="btn-link peq" data-acao="churn-todos">Ver a carteira</button></div></div></div>' : ''}
      ${sel ? detalhe : ''}${tabela}${sel ? '' : detalhe}`;
  }


  // ---------- Dashboard individual (condutor ou veículo): comportamento detalhado e visual ----------
  const COR_NOTA = { bom: '#1E8E3E', atencao: '#F9AB00', critico: '#D93025' };
  function gaugeNota(valor, cor, rot, sub, tam) {
    const R = 70, L = Math.PI * R, off = L * (1 - clamp(valor || 0, 0, 100) / 100);
    return `<div class="gauge" style="width:${tam || 220}px"><svg viewBox="0 0 180 104" role="img" aria-label="${esc(rot)} ${valor === null ? 'sem dado' : fmt(valor, 1)}">
      <path d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="#EEF0F2" stroke-width="16" stroke-linecap="round"/>
      <path class="gauge-arco" d="M20 90 A70 70 0 0 1 160 90" fill="none" stroke="${cor}" stroke-width="16" stroke-linecap="round" style="stroke-dasharray:${L.toFixed(1)};stroke-dashoffset:${off.toFixed(1)};--len:${L.toFixed(1)}"/></svg>
      <div class="gauge-centro"><span class="gauge-num num">${valor === null ? '—' : fmt(valor, 1)}</span><span class="gauge-rot">${esc(rot)}</span>${sub ? `<span class="apoio" style="font-size:11.5px;margin-top:2px">${esc(sub)}</span>` : ''}</div></div>`;
  }
  // Pontuação 0-100 (quanto maior, melhor) para o gráfico de teia
  const EIXOS = [
    { k: 'nota', rot: 'Nota', f: (v) => v },
    { k: 'faixa_verde', rot: 'Faixa verde', f: (v) => v },
    { k: 'embalo', rot: 'Embalo', f: (v) => clamp(v * 2.5, 0, 100) },
    { k: 'motor_ocioso', rot: 'Motor parado', f: (v) => clamp(100 - v * 5, 0, 100) },
    { k: 'pressao_acelerador', rot: 'Acelerador', f: (v) => clamp(100 - v * 2.5, 0, 100) },
    { k: 'kml', rot: 'Consumo', f: (v) => clamp(((v - 2) / 1.6) * 100, 0, 100) },
    { k: 'frenagens', rot: 'Frenagens', f: (v) => clamp(100 - v * 40, 0, 100) }
  ];
  function teia(a, ref) {
    const eixos = EIXOS.filter((e) => temInd(e.k) && a[e.k] !== null && a[e.k] !== undefined);
    if (eixos.length < 3) return '<div class="vazio"><span class="apoio">Poucos indicadores para montar o gráfico de teia.</span></div>';
    const C = 150, R = 100, n = eixos.length;
    const pt = (i, pct) => { const ang = -Math.PI / 2 + (2 * Math.PI * i) / n, r = (R * pct) / 100; return [C + r * Math.cos(ang), C + r * Math.sin(ang)]; };
    const poli = (arr) => arr.map((v, i) => pt(i, v).map((n2) => n2.toFixed(1)).join(',')).join(' ');
    const aneis = [25, 50, 75, 100].map((p) => `<polygon points="${eixos.map((_, i) => pt(i, p).map((n2) => n2.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#E3E6E8" stroke-width="1"/>`).join('');
    const raios = eixos.map((_, i) => { const [x, y] = pt(i, 100); return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E3E6E8"/>`; }).join('');
    const rot = eixos.map((e, i) => { const [x, y] = pt(i, 122); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#5F6368">${e.rot}</text>`; }).join('');
    const va = eixos.map((e) => e.f(a[e.k])), vr = eixos.map((e) => (ref && ref[e.k] !== null && ref[e.k] !== undefined ? e.f(ref[e.k]) : 0));
    return `<svg viewBox="0 0 300 300" class="teia" role="img" aria-label="Comparação dos indicadores com a média da frota" style="width:100%;max-width:360px;display:block;margin:0 auto">
      ${aneis}${raios}
      <polygon class="teia-ref" points="${poli(vr)}" fill="rgba(128,134,139,.10)" stroke="#80868B" stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon class="teia-val" points="${poli(va)}" fill="rgba(252,183,9,.28)" stroke="#FCB709" stroke-width="2.5" stroke-linejoin="round"/>
      ${va.map((v, i) => { const [x, y] = pt(i, v); return `<circle class="teia-pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="#FCB709" stroke="#fff" stroke-width="1.5"><title>${eixos[i].rot}: ${fmtInd(IND_MAP[eixos[i].k], a[eixos[i].k])}</title></circle>`; }).join('')}
      ${rot}</svg>`;
  }
  function mapaCalor(linhas) {
    const serie = X.serieDiaria(linhas, IND_MAP.nota, E.A, E.base);
    if (!serie.length) return '';
    const d0 = D.deISO(serie[0].data), seg = (d0.getUTCDay() + 6) % 7;
    const cel = [];
    for (let i = 0; i < seg; i++) cel.push('<span class="cal-v"></span>');
    serie.forEach((p, i) => {
      const f = p.valor === null ? null : X.faixaNota(p.valor);
      const cor = f ? COR_NOTA[f] : '#EEF0F2';
      cel.push(`<span class="cal-c ${f ? '' : 'cal-vazio'}" style="background:${cor};--i:${i}" title="${D.br(p.data)} · ${p.valor === null ? 'sem registro' : 'nota ' + fmt(p.valor, 1)}"></span>`);
    });
    const dias = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
    return `<div class="cal-mapa"><div class="cal-dias">${dias.map((d) => `<span>${d}</span>`).join('')}</div><div class="cal-grade">${cel.join('')}</div></div>
      <div class="graf-legenda" style="margin-top:10px"><span><i class="cal-leg" style="background:#1E8E3E"></i>Bom (70+)</span><span><i class="cal-leg" style="background:#F9AB00"></i>Atenção (40 a 69)</span><span><i class="cal-leg" style="background:#D93025"></i>Crítico (abaixo de 40)</span><span><i class="cal-leg" style="background:#EEF0F2"></i>Sem registro</span></div>`;
  }
  function dashboardIndividual(x, m, c) {
    const a = x.a, b = x.b, F = c.frotaA;
    if (!x.la.length) return `<section class="card"><div class="card-corpo"><div class="vazio"><span class="vazio-titulo">Sem registros no período analisado</span><span class="apoio">Escolha outro período acima.</span></div></div></section>`;
    const veic = E.rota.tipo === 'veiculo';
    const nota = temInd('nota') && a.nota > 0 ? a.nota : null;
    const fx = X.faixaNota(nota);
    const ranking = c.mots.filter((y) => y.a.nota > 0).sort((p, q) => q.a.nota - p.a.nota);
    const pos = ranking.findIndex((y) => y.m.id === m.id) + 1;
    const stat = (k, tit) => { const ind = IND_MAP[k]; if (!temInd(k)) return ''; const v = X.variacao(ind, a[k], b[k]); return `<div class="dash-stat"><span class="dash-stat-t">${tit || esc(ind.label)}</span><span class="dash-stat-v num">${fmtInd(ind, a[k])}</span>${variacao(v, refB())}</div>`; };
    const hero = `<section class="card dash-hero"><div class="card-corpo" style="flex-direction:row;flex-wrap:wrap;gap:20px 34px;align-items:center">
        ${gaugeNota(nota, fx ? COR_NOTA[fx] : '#BDC1C6', 'Nota Gobrax', pos ? pos + 'º de ' + ranking.length + (veic ? ' veículos' : ' motoristas') : '', 230)}
        <div class="dash-stats">${stat('km', 'Km rodados')}${stat('kml', 'Média de consumo')}${stat('litros', 'Diesel consumido')}${stat('dias', 'Dias trabalhados')}${stat('km_dia', 'Km por dia')}${stat('horas', 'Horas de condução')}</div></div></section>`;
    // Insights do próprio condutor/veículo
    const itens = [];
    const ec = economia(a, F);
    if (ec && Math.abs(ec.reais) >= 1) itens.push([ec.reais >= 0 ? 'ok' : 'ruim', ec.reais >= 0 ? '▼' : '▲', ec.reais >= 0 ? `Gastou <b>R$ ${fmt(ec.reais, 0)} a menos</b> em diesel (${fmt(Math.abs(ec.litros), 0)} L) que a média da frota para os mesmos km.` : `Gastou <b>R$ ${fmt(Math.abs(ec.reais), 0)} a mais</b> em diesel (${fmt(Math.abs(ec.litros), 0)} L) que a média da frota para os mesmos km, a R$ ${fmt(E.preco, 2)}/L.`]);
    const dist = ['faixa_verde', 'embalo', 'motor_ocioso', 'pressao_acelerador', 'frenagens'].filter(temInd).map((k) => ({ k, v: X.variacao(IND_MAP[k], a[k], F[k]) })).filter((o) => !o.v.semBase && o.v.sentido === 'pior' && o.v.rel !== null).sort((p, q) => Math.abs(q.v.rel) - Math.abs(p.v.rel));
    if (dist[0]) itens.push(['atencao', '!', `Ponto mais fraco: <b>${esc(IND_MAP[dist[0].k].label)}</b> em ${fmtInd(IND_MAP[dist[0].k], a[dist[0].k])}, contra ${fmtInd(IND_MAP[dist[0].k], F[dist[0].k])} da frota.`]);
    const forte = ['faixa_verde', 'embalo', 'motor_ocioso', 'pressao_acelerador', 'frenagens'].filter(temInd).map((k) => ({ k, v: X.variacao(IND_MAP[k], a[k], F[k]) })).filter((o) => !o.v.semBase && o.v.sentido === 'melhor' && o.v.rel !== null).sort((p, q) => Math.abs(q.v.rel) - Math.abs(p.v.rel));
    if (forte[0]) itens.push(['ok', '✓', `Ponto forte: <b>${esc(IND_MAP[forte[0].k].label)}</b> em ${fmtInd(IND_MAP[forte[0].k], a[forte[0].k])}, melhor que os ${fmtInd(IND_MAP[forte[0].k], F[forte[0].k])} da frota.`]);
    const vn = X.variacao(IND_MAP.nota, a.nota, b.nota);
    if (!vn.semBase && !vn.estavel) itens.push([vn.sentido === 'melhor' ? 'ok' : 'ruim', vn.sentido === 'melhor' ? '▲' : '▼', `Nota <b>${vn.texto}</b> em relação ao período anterior (${fmtInd(IND_MAP.nota, b.nota)} para ${fmtInd(IND_MAP.nota, a.nota)}).`]);
    const sd = X.serieDiaria(x.la, IND_MAP.nota, E.A, E.base).filter((p) => p.valor !== null);
    if (sd.length > 2) { const mel = sd.reduce((p, q) => (q.valor > p.valor ? q : p)), pio = sd.reduce((p, q) => (q.valor < p.valor ? q : p)); itens.push(['neutro', '•', `Melhor dia: <b>${D.br(mel.data)}</b> (nota ${fmt(mel.valor, 1)}). Pior dia: <b>${D.br(pio.data)}</b> (nota ${fmt(pio.valor, 1)}).`]); }
    const radar = itens.length ? `<section class="radar"><div class="radar-cab"><span class="radar-pulso" aria-hidden="true"></span><b>Leitura automática do comportamento</b><span class="radar-sub">${fmt(x.la.length, 0)} registros no período</span></div><div class="radar-scan" aria-hidden="true"></div>
      <ul class="radar-lista">${itens.map((i, n) => `<li class="radar-i radar-${i[0]}" style="--n:${n}"><span class="radar-ic">${i[1]}</span><span>${i[2]}</span></li>`).join('')}</ul></section>` : '';
    // Barras comparando com a frota
    const ks = ['faixa_verde', 'embalo', 'motor_ocioso', 'pressao_acelerador', 'excesso_rotacao', 'frenagens'].filter((k) => temInd(k) && a[k] !== null && a[k] !== undefined);
    const comp = ks.map((k) => {
      const ind = IND_MAP[k], v = X.variacao(ind, a[k], F[k]);
      const mx = Math.max(a[k], F[k] || 0, ind.un === '%' ? 40 : 1) * 1.15, w = (val) => clamp((val / mx) * 100, 1.5, 100);
      const cor = v.semBase ? '#BDC1C6' : v.sentido === 'melhor' ? '#1E8E3E' : v.sentido === 'pior' ? '#D93025' : '#FCB709';
      return `<div class="dash-bar"><div class="dash-bar-cab"><span><b>${esc(ind.label)}</b></span><span class="num"><b>${fmtInd(ind, a[k])}</b> <span class="mudo">frota ${fmtInd(ind, F[k])}</span></span></div>
        <div class="dash-trilho"><i style="width:${w(a[k]).toFixed(1)}%;background:${cor}"></i>${F[k] ? `<em style="left:${w(F[k]).toFixed(1)}%" title="Média da frota"></em>` : ''}</div></div>`;
    }).join('');
    E.graficos['mot-km'] = { tipo: 'barras', serie: X.serieDiaria(m.linhas, IND_MAP.km, E.A, E.base), ind: IND_MAP.km, ref: b.km_dia, titulo: 'Km rodados por dia' };
    return `${hero}${radar}
      <div class="grade-2">
        <section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Perfil de condução</h2><span class="h2-sub">Amarelo: ${veic ? 'este veículo' : 'este motorista'}. Cinza tracejado: média da frota. Quanto mais longe do centro, melhor.</span></div></div><div class="card-corpo">${teia(a, F)}</div></section>
        <section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Comparado à frota</h2><span class="h2-sub">A marca vertical é a média da frota. Verde melhor, vermelho pior.</span></div></div><div class="card-corpo">${comp || '<span class="apoio">Sem indicadores de condução na planilha.</span>'}</div></section>
      </div>
      <section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Calendário de desempenho</h2><span class="h2-sub">Cada quadrado é um dia do período, colorido pela nota. Passe o mouse para ver o valor.</span></div></div><div class="card-corpo">${mapaCalor(x.la)}</div></section>
      <div class="grade-2">
        ${cartaoDiaADia('mot-dia', m.linhas, E.detalhe.indGraf, E.detalhe.verTabela, 'ind-det', 'vista-det', 'Evolução dia a dia')}
        <section class="card"><div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Km rodados por dia</h2><span class="h2-sub">Dias sem barra não têm registro.</span></div></div><div class="card-corpo"><div class="grafico" data-grafico="mot-km" style="height:230px"></div></div></section>
      </div>`;
  }

  // ---------- Configurações: clientes e anexo de planilhas (no perfil de cada cliente) ----------
  function abasConfig() {
    return `<div class="pag-cab"><div class="pag-cab-texto"><h1 class="h1">Configurações</h1>
      <span class="sub">Clientes e planilhas. Para anexar dados, abra o perfil do cliente.</span></div></div>`;
  }

  // ---------- Tela: Visão geral — o relatório padrão para mostrar ao cliente ----------
  // Períodos da planilha de veículos: com planilhas de período (1 linha = total), vale a última contra a anterior.
  function veicPeriodos(bv) {
    if (temTotais(bv)) {
      const cs = coberturas(bv).filter((c) => c.ini !== c.fim);
      if (cs.length) { const A = cs[cs.length - 1]; return { A, B: cs.filter((c) => c.fim < A.ini).pop() || null }; }
    }
    return { A: E.A, B: E.B };
  }
  function blocoGruposGeral() {
    if (!E.veic || !opcoesDim('grupo', true).length) return '';
    const bv = baseVeic();
    if (!bv) return '';
    const P = veicPeriodos(bv);
    if (!P.A) return '';
    const por = new Map();
    bv.motoristas.forEach((m) => {
      const nome = (m.dims.grupo && m.dims.grupo[0]) || 'Sem grupo';
      let o = por.get(nome);
      if (!o) { o = { nome, la: [], lb: [], placas: new Set() }; por.set(nome, o); }
      X.filtrar(m.linhas, P.A).forEach((l) => { o.la.push(l); o.placas.add(m.nome); });
      if (P.B) X.filtrar(m.linhas, P.B).forEach((l) => o.lb.push(l));
    });
    const gs = [...por.values()].filter((g) => g.la.length).map((g) => Object.assign(g, { a: X.resumo(g.la, bv), b: X.resumo(g.lb, bv), n: g.placas.size }));
    if (!gs.length) return '';
    gs.sort((p, q) => (q.a.km || 0) - (p.a.km || 0));
    const tem = (k) => bv.indicadores.some((i) => i.key === k);
    const cols = [['nota', 'Nota Gobrax'], ['kml', 'Média km/l'], ['faixa_verde', 'Faixa verde'], ['motor_ocioso', 'Motor ocioso']].filter(([k]) => tem(k));
    const linhas = gs.slice(0, 10).map((g) => `<tr><td><b style="font-weight:600">${esc(g.nome)}</b></td><td class="dir">${g.n}</td>${cols.map(([k]) => celInd(k, g.a, g.b)).join('')}<td class="dir">${fmtInd(IND_MAP.km, g.a.km)}</td></tr>`).join('');
    return `<section class="card">
      <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Desempenho por grupo de veículos</h2>
        <span class="h2-sub">Planilha de veículos · ${D.periodoBR(P.A)}${P.B ? ' comparado a ' + D.periodoBR(P.B) : ' · sem planilha anterior para comparar'}${gs.length > 10 ? ' · 10 maiores de ' + gs.length + ' por km' : ''}.</span></div>
        <a class="btn" href="#/veiculos" style="text-decoration:none">Ver veículos e grupos</a></div>
      <div class="tabela-wrap"><table class="tabela" style="min-width:640px"><thead><tr><th>Grupo</th><th class="dir">Veículos</th>${cols.map(([, r]) => `<th class="dir">${r}</th>`).join('')}<th class="dir">Km rodados</th></tr></thead><tbody>${linhas}</tbody></table></div></section>`;
  }

  // O painel mostra um cliente por vez; os clientes nunca são somados
  function seletorClienteHero() {
    if (E.demo) return '';
    const ops = opcoesClientes();
    const comDados = ops.filter((n) => (E.linhasAll || []).some((l) => ckey(l.cliente) === ckey(n)));
    const quase = comDados.length > 1;
    const pil = (rot, cli, ativa) => `<button type="button" class="pilula ${ativa ? 'ativa' : ''}" data-acao="cliente-hero" data-cli="${esc(cli)}" aria-pressed="${ativa}">${esc(rot)}</button>`;
    if (!quase) return '';
    return `<div class="barra-filtros hero-clientes" aria-label="Cliente do relatório"><span class="campo-rotulo">Cliente do relatório</span>
      ${ops.map((n) => pil(n, n, ckey(E.cliente) === ckey(n))).join('')}</div>`;
  }
  function telaGeral() {
    const c = calc();
    const A = c.frotaA, B = c.frotaB;
    const cliente = E.cliente || 'Relatório';
    const bv = E.veic ? baseVeic() : null;
    const nGrupos = opcoesDim('grupo', true).length;
    const chips = [
      `<span class="hero-chip"><b>${fmt(c.mots.length, 0)}</b> motoristas</span>`,
      bv ? `<span class="hero-chip"><b>${fmt(bv.motoristas.length, 0)}</b> veículos</span>` : '',
      nGrupos ? `<span class="hero-chip"><b>${fmt(nGrupos, 0)}</b> grupos</span>` : '',
      A.km ? `<span class="hero-chip"><b>${fmt(A.km, 0)}</b> km monitorados</span>` : '',
      A.litros ? `<span class="hero-chip"><b>${fmt(A.litros, 0)}</b> L de diesel</span>` : ''
    ].join('');
    const hero = `<section class="hero-geral">
      <div class="hero-txt"><span class="hero-eyebrow">Relatório de desempenho da frota</span>
        <h1 class="hero-titulo">${esc(cliente)}</h1>
        <span class="hero-sub">${D.periodoBR(E.A)}${c.lb.length ? ' · comparado a ' + D.periodoBR(E.B) : ' · sem período anterior para comparar'}</span>
        <div class="hero-chips">${chips}</div></div>
      <div class="hero-acoes"><button type="button" class="hero-btn hero-btn-p" data-acao="imprimir">Imprimir ou salvar em PDF</button><a class="hero-btn" href="${hrefDados()}">Atualizar dados</a></div>
    </section>
    ${seletorClienteHero()}`;

    // ---- resultados entregues ----
    const dif = (k) => X.variacao(IND_MAP[k], A[k], B[k]);
    const dv = (k) => { const v = dif(k); return v.semBase ? '<span class="exec-neutro">sem período anterior</span>' : `<span class="exec-${v.sentido === 'melhor' ? 'bom' : v.sentido === 'pior' ? 'ruim' : 'neutro'}">${v.texto}</span>`; };
    const item = (rot, val, delta, apoio) => `<div class="exec-i"><span class="exec-rot">${rot}</span><span class="exec-val num">${val}</span><span class="exec-var">${delta || ''}</span><span class="exec-apo">${apoio || ''}</span></div>`;
    const e = economia(A, B);
    const itens = [];
    if (e) itens.push(item(e.reais >= 0 ? 'Diesel economizado' : 'Diesel a mais', 'R$ ' + fmt(Math.abs(e.reais), 0), `<span class="exec-${e.reais >= 0 ? 'bom' : 'ruim'}">${e.reais >= 0 ? '▼' : '▲'} ${fmt(Math.abs(e.litros), 0)} L</span>`, 'para os mesmos km do período anterior · R$ ' + fmt(E.preco, 2) + '/L'));
    if (temInd('nota')) itens.push(item('Nota Gobrax', fmtInd(IND_MAP.nota, A.nota), dv('nota'), 'antes ' + fmtInd(IND_MAP.nota, B.nota)));
    if (temInd('kml')) itens.push(item('Média de consumo', fmtInd(IND_MAP.kml, A.kml), dv('kml'), 'antes ' + fmtInd(IND_MAP.kml, B.kml)));
    if (temInd('faixa_verde')) itens.push(item('Faixa verde', fmtInd(IND_MAP.faixa_verde, A.faixa_verde), dv('faixa_verde'), 'antes ' + fmtInd(IND_MAP.faixa_verde, B.faixa_verde)));

    if (crit.length) {

      <div class="plano-grade">${ganhos.map(planoCartao).join('')}</div>` : '';

    // ---- destaques de motoristas ----
    const ord = c.mots.filter((x) => x.st.delta !== null).sort((p, q) => q.st.delta - p.st.delta);

      const mx = Math.max.apply(null, ord.map((x) => Math.abs(x.st.delta)).concat([1e-9]));
      const lin = (arr, bom) => (arr.length ? arr.map((x) => planoLinha(x, fmtD(x.st.delta), (Math.abs(x.st.delta) / mx) * 100, bom ? 'var(--ok)' : 'var(--critico)')).join('') : '<span class="apoio" style="padding:6px 0">Nenhum motorista nesta situação.</span>');

  // ---------- Clientes: cadastro compartilhado (db) com cópia local quando o banco não está disponível ----------
  const CHAVE_CLIENTES = 'gbx-frota-clientes';

  function ordenarClientes() { E.clientes.sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR')); }
  function salvarLocal() { if (E.demo) return; armazem.gravar(CHAVE_CLIENTES, JSON.stringify(E.clientes)); }
  async function iniciarClientes() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) {
      try { iniciarPlanilhas(db); } catch (e) { planRef = null; E.planEmDb = false; E.planCarregando = false; }
      dbRef = db.collection('clientes');
      try { tratRef = db.collection('tratativas'); E.tratEmDb = true; tratRef.onSnapshot((sn) => { if (E.demo) return; E.trat = sn.docs.map((d) => Object.assign({ id: d.id }, d.data()));  if (E.rota.tela === 'churn') render(); }, () => { E.tratEmDb = false; carregarTratLocal(); if (E.rota.tela === 'churn') render(); }); } catch (e) { E.tratEmDb = false; carregarTratLocal(); }
      try { db.collection('config').doc('diesel').onSnapshot((d) => { const v = d.exists ? d.data() : null; if (!v || !(Number(v.preco_br) > 0)) return; E.diesel = v; if (!E.precoManual) E.preco = Number(v.preco_br); render(); }, () => {}); } catch (e) { /* sem preço automático */ }
      try { db.collection('relacionamento').onSnapshot((sn) => { if (E.demo) return; E.rel = sn.docs.map((d) => Object.assign({ id: d.id }, d.data())).filter((r) => true); vigiarHubspot(); if (['plano', 'clientes', 'churn'].includes(E.rota.tela)) render(); }, () => {}); } catch (e) { /* sem relacionamento */ }
      E.clientesEmDb = true;

        if (E.demo) return;
        E.clientes = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        ordenarClientes(); E.clientesPronto = true;
        render();   // cliente cadastrado por outra pessoa aparece na hora, em qualquer tela

    } else { E.planCarregando = false; carregarClientesLocal(); carregarTratLocal(); render(); }
  }
  function carregarClientesLocal() {

  async function salvarCliente() {
    const f = E.clienteForm;

    if (!nome) { toast('Informe o nome do cliente.', 'erro'); return; }
    if (E.clientes.some((c) => ckey(c.nome) === ckey(nome))) { toast('Esse cliente já está cadastrado.', 'erro'); return; }
    const reg = { nome, grupo: f.grupo.trim(), obs: f.obs.trim(), criado: D.hoje() };
    try {
      if (E.clientesEmDb && dbRef) await dbRef.add(reg);
      else { E.clientes.push(Object.assign({ id: 'l' + Date.now() }, reg)); ordenarClientes(); salvarLocal(); }
    } catch (e) { toast('Não foi possível salvar. Você pode não ter permissão para editar este painel.', 'erro'); return; }

  async function removerCliente(id) {
    const cli = E.clientes.find((c) => c.id === id);
    if (cli) { apagarDadosCliente(cli.nome, 'motoristas', true); apagarDadosCliente(cli.nome, 'veiculos', true); }
    try {
      if (E.clientesEmDb && dbRef) await dbRef.doc(id).delete();
      else { E.clientes = E.clientes.filter((c) => c.id !== id); salvarLocal(); }
    } catch (e) { toast('Não foi possível remover o cliente.', 'erro'); return; }
    E.clienteRemover = null; if (cli && ckey(E.cliente) === ckey(cli.nome)) E.cliente = ''; if (E.rota.tela === 'cliente') location.hash = '#/config'; render(); toast('Cliente e planilhas removidos.');
  }
  // ---------- Planilhas compartilhadas (db): um documento por tipo, cliente e dia, dividido em partes se passar do limite ----------
  // Quem tem o painel aberto recebe cada planilha nova na hora. Sem banco (fora do Claude), tudo segue no navegador.
  let planRef = null, planDocs = new Map();
  const slugCli = (n) => ckey(n).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'sem-cliente';
  const idPlan = (alvo, cli, data, parte) => [alvo, slugCli(cli), data, 'p' + parte].join('~');
  const bytes = (t) => new TextEncoder().encode(t).length;
  function partesCSV(ls, colunas) {   // documento tem até 256 KiB: cada parte fica abaixo de 200 KB
    for (let n = 1; ; n++) {
      const tam = Math.ceil(ls.length / n), out = [];
      for (let i = 0; i < ls.length; i += tam) out.push(X.paraCSV(ls.slice(i, i + tam), colunas));
      if (tam <= 1 || out.every((t) => bytes(t) < 200000)) return out;
    }
  }
  const msgErroDb = (e) => (e && e.code === 'quota_exceeded'
    ? 'A base compartilhada está cheia. Apague planilhas antigas de algum cliente para liberar espaço.'
    : 'Não foi possível gravar na base compartilhada. Você pode não ter permissão para editar este painel.');
  function periodoSalvo() {
    try { const p = JSON.parse(armazem.ler('gbx-frota-periodo') || 'null'); return p && { A: p.A, B: p.B, p: p.preset, m: p.modo }; } catch (e) { return null; }
  }
  function iniciarPlanilhas(db) {
    planRef = db.collection('planilhas');
    E.planEmDb = true; E.planCarregando = true;
    // o que este navegador guardou antes da base compartilhada fica à parte, para enviar ou descartar em Configurações
    const loc = {};
    [['motoristas', CHAVE_CSV], ['veiculos', CHAVE_VEIC]].forEach(([a, k]) => { const s = armazem.ler(k); if (s) loc[a] = s; });
    E.planLocal = Object.keys(loc).length ? loc : null;
    planRef.onSnapshot((sn) => {
      planDocs = new Map(sn.docs.map((d) => [d.id, d.data()]));
      E.planCarregando = false;
      aplicarPlanilhasDb();
      render();
    }, () => {
      planRef = null; E.planEmDb = false; E.planCarregando = false; render();
      toast('A base compartilhada de planilhas não respondeu. Mostrando só os dados deste navegador.', 'erro');
    });
  }
  // Remonta motoristas e veículos a partir da base, mantendo o período escolhido ("Último dia" anda junto quando chega um dia novo)
  function aplicarPlanilhasDb() {
    const docs = [...planDocs.values()].sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : (a.parte || 0) - (b.parte || 0)));
    const montar = (alvo) => {
      const linhas = []; let colunas = [], arqs = [];
      docs.filter((d) => d.alvo === alvo && typeof d.texto === 'string').forEach((d) => {
        const r = X.importarCSV(d.texto);
        if (!r.ok) return;
        r.linhas.forEach((l) => { l.cliente = d.cliente; linhas.push(l); });
        colunas = uniao(colunas, r.colunas.concat(['cliente']));
        if (d.arquivo) arqs = uniao(arqs, [d.arquivo]);
      });
      return { linhas, colunas, arqs };
    };
    const v = montar('veiculos'), m = montar('motoristas');
    const per = E.planAplicado ? { A: E.A, B: E.B, p: E.presetA, m: E.modoComp } : periodoSalvo();
    E.planAplicado = true;
    E.veic = v.linhas.length ? { nome: rotuloArquivos(v.arqs), arquivos: v.arqs, colunas: v.colunas, linhas: v.linhas } : null;
    E.veicVer++; baseVeicCache = null;
    if (m.linhas.length) { E.linhasAll = m.linhas; E.colunasAll = m.colunas; E.arquivos = m.arqs; E.fonte = { tipo: 'planilha', nome: rotuloArquivos(m.arqs) }; }
    else limparBase();
    validarFiltro();
    if (E.linhasAll) aplicarFiltroCliente();
    if (E.base && per && per.A) {
      const pp = per.p && presetPeriodo(per.p);
      const A = pp || (per.A.ini >= E.base.inicio && per.A.fim <= E.base.fim ? per.A : null);
      if (A) {
        E.A = A; E.presetA = pp ? per.p : null; E.modoComp = per.m || 'anterior';
        E.B = E.modoComp === 'anterior' || !per.B ? anterior(E.A) : per.B;
        E.cal.rascA = { ...E.A }; E.cal.rascB = { ...E.B };
      }
    }
    memo = null;
  }
  // Grava na base os dias que a importação tocou (o dia inteiro do cliente, já mesclado com o que havia)
  async function enviarPlanilhas(alvo, novas, todas, colunas, arquivo) {
    if (!planRef) return true;
    const grupos = new Map();
    novas.forEach((l) => grupos.set(ckey(l.cliente) + '|' + l.data, { cliente: l.cliente || '', data: l.data }));
    try {
      for (const g of grupos.values()) {
        const ls = todas.filter((l) => ckey(l.cliente) === ckey(g.cliente) && l.data === g.data);
        const partes = partesCSV(ls, colunas);
        for (let i = 0; i < partes.length; i++) {
          await planRef.doc(idPlan(alvo, g.cliente, g.data, i + 1)).set({ alvo, cliente: g.cliente, data: g.data, colunas, texto: partes[i], parte: i + 1, partes: partes.length, arquivo: arquivo || '', em: new Date().toISOString() });
        }
        for (const [id, d] of [...planDocs]) {
          if (d.alvo === alvo && ckey(d.cliente) === ckey(g.cliente) && d.data === g.data && d.parte > partes.length) await planRef.doc(id).delete();
        }
      }
      return true;
    } catch (e) { toast(msgErroDb(e), 'erro'); return false; }
  }
  // Apaga da base as planilhas de um tipo (de um cliente, ou de todos)
  async function apagarPlanDb(alvo, nome) {
    if (!planRef) return;
    const alvos = [...planDocs].filter(([, d]) => d.alvo === alvo && (nome === undefined || ckey(d.cliente) === ckey(nome)));
    try { for (const [id] of alvos) await planRef.doc(id).delete(); }
    catch (e) { toast(msgErroDb(e), 'erro'); aplicarPlanilhasDb(); render(); }
  }
  async function enviarLocal() {
    const loc = E.planLocal;
    if (!loc || !planRef) return;
    let n = 0;
    for (const alvo of Object.keys(loc)) {
      let o = null;
      try { o = JSON.parse(loc[alvo]); } catch (e) { continue; }
      const r = X.importarCSV(o.texto);
      if (!r.ok) continue;
      // mesma linha (dia + motorista/veículo + cliente) fica com a versão deste navegador
      const veic = alvo === 'veiculos';
      const res = mesclar(veic ? (E.veic ? E.veic.linhas : []) : (E.linhasAll || []), r.linhas);
      const cols = uniao(veic ? E.veic && E.veic.colunas : E.colunasAll, r.colunas);
      if (!(await enviarPlanilhas(alvo, r.linhas, res.linhas, cols, o.nome))) return;
      n += r.linhas.length;
    }
    descartarLocal();
    toast(n + ' linhas enviadas para a base compartilhada.');
  }
  function descartarLocal() { armazem.apagar(CHAVE_CSV); armazem.apagar(CHAVE_VEIC); E.planLocal = null; render(); }
  function avisoLocal() {
    const loc = E.planLocal;
    if (!loc || !E.planEmDb) return '';
    const linhas = Object.values(loc).reduce((s, t) => { try { return s + Math.max(0, JSON.parse(t).texto.split('\n').length - 1); } catch (e) { return s; } }, 0);
    return `<div class="alerta alerta-atencao" role="status"><span class="alerta-icone">!</span><div class="alerta-corpo">
      <span class="alerta-titulo">Este navegador tem planilhas que só você vê</span>
      <span class="alerta-texto">São ${fmt(linhas, 0)} linhas anexadas antes da base compartilhada. Envie para que todos vejam, ou descarte se já foram anexadas de novo.</span>
      <div class="alerta-acoes"><button type="button" class="btn btn-primario" data-acao="plan-enviar-local">Enviar para a base compartilhada</button><button type="button" class="btn-link peq" data-acao="plan-descartar-local">Descartar deste navegador</button></div></div></div>`;
  }

  // ---------- API Gobrax: estatísticas por veículo (dia a dia), odômetro e premiação ----------
  // O token de cada cliente fica só no navegador de quem o digitou: nunca vai para a base compartilhada nem para o código.
  const API_BASE = 'https://gateway-v3.gobrax.com.br:8889/api/';
  const CHAVE_API_LOCAL = 'gbx-frota-api';
  const chaveToken = (cli) => 'gbx-api-token:' + slugCli(cli);
  const tokenDe = (cli) => armazem.ler(chaveToken(cli)) || '';
  const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
  const numApi = (v) => { if (v === null || v === undefined || v === '') return null; const n = typeof v === 'number' ? v : Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
  const placaApi = (v) => String(v || '').trim().toUpperCase();
  const utc = (ms) => new Date(ms).toISOString().slice(0, 19).replace('T', ' ');
  const janelaUTC = (dia) => ({ startDate: dia + ' 03:00:00', endDate: D.somar(dia, 1) + ' 02:59:59' });   // dia de Brasília (UTC−3) em UTC
  async function apiGet(caminho, params, token) {
    const qs = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
    for (let tentativa = 0; ; tentativa++) {
      let r;
      try { r = await fetch(API_BASE + caminho + '?' + qs, { headers: { Authorization: 'Bearer ' + token } }); }
      catch (e) { throw new Error('o navegador não conseguiu chamar a API (sem rede ou chamada bloqueada neste ambiente)'); }
      if (r.status === 429 && tentativa < 2) { await esperar(1500); continue; }   // limite de 10 chamadas por segundo
      if (r.status === 401 || r.status === 403) throw new Error('a API recusou o token deste cliente');
      if (!r.ok) throw new Error('a API respondeu ' + r.status);
      await esperar(120);
      return r.json();
    }
  }
  const registros = (j) => (Array.isArray(j) ? j : (j && (j.records || j.data)) || []);

  // Documentos de odômetro e premiação: na base compartilhada, ou no navegador quando não há base
  const docsApi = (alvo, cli) => (planRef ? [...planDocs.values()] : Object.values(E.apiLocal || {}))
    .filter((d) => d.alvo === alvo && (!cli || ckey(d.cliente) === ckey(cli)));
  async function gravarDocApi(id, doc) {
    if (planRef) { await planRef.doc(id).set(doc); return; }
    E.apiLocal = Object.assign({}, E.apiLocal, { [id]: doc });
    armazem.gravar(CHAVE_API_LOCAL, JSON.stringify(E.apiLocal));
  }
  function apagarApiLocal(alvo, nome) {
    if (!E.apiLocal) return;
    Object.keys(E.apiLocal).forEach((id) => { const d = E.apiLocal[id]; if (d.alvo === alvo && ckey(d.cliente) === ckey(nome)) delete E.apiLocal[id]; });
    armazem.gravar(CHAVE_API_LOCAL, JSON.stringify(E.apiLocal));
  }

  // Um dia de estatísticas + performance → CSV no layout do painel (uma linha por veículo; parado entra com 0 km)
  // Performance: % do tempo em movimento em cada indicador; o CPF dos motoristas é descartado aqui, só o nome segue.
  const PERF_COLS = [['faixa_verde', 'greenRange'], ['embalo', 'leverage'], ['motor_ocioso', 'idle'], ['pressao_acelerador', 'pedalPressureOnHigh'],
    ['excesso_rotacao', 'powerRange'], ['tempo_excesso_velocidade', 'speeding'], ['piloto_automatico', 'cruiseControl'], ['freio_motor', 'engineBrake']];
  const chavePlaca = (p) => placaApi(p).replace(/[^A-Z0-9]/g, '');
  function diaParaCSV(dia, estat, perf, cli) {
    const temPerf = perf.length > 0;
    const cols = ['data', 'motorista', 'veiculo', 'km', 'litros', 'frenagens', 'frenagens_alta', 'velocidade_media', 'odometro']
      .concat(temPerf ? ['horas', 'nota'].concat(PERF_COLS.map(([k]) => k)) : [], ['cliente', 'dias_periodo']);
    const n = (v) => { const x = numApi(v); return x === null ? '' : String(Math.round(x * 100) / 100).replace('.', ','); };
    const escC = (s) => (/[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
    const perfPor = new Map();
    perf.forEach((r) => { const k = chavePlaca(r && r.vehicleIdentification); if (k && !perfPor.has(k)) perfPor.set(k, r); });
    const vistos = new Set(), linhas = [];
    estat.forEach((r) => {
      const placa = placaApi(r && r.vehicleIdentification), k = chavePlaca(placa);
      if (!k || vistos.has(k)) return;
      vistos.add(k);
      const km = numApi(r.totalMileage) || 0, rodou = km > 0;
      const p = rodou ? perfPor.get(k) : null, ind = (p && p.indicators) || {};
      const nomes = [...new Set(((p && p.drivers) || []).map((d) => String((d && d.driverName) || '').trim()).filter(Boolean))];
      const pct = (nome) => (ind[nome] ? n(ind[nome].percentage) : '');
      const sc = p ? (p.score !== undefined ? p.score : ind.score) : null;
      const nota = numApi(sc && typeof sc === 'object' ? sc.score : sc);
      const mov = ind.movement ? numApi(ind.movement.duration) : null;
      linhas.push([D.br(dia), escC(nomes.length ? nomes.join(' / ') : placa), escC(placa), n(km), rodou ? n(r.totalConsumption) : '', rodou ? n(r.totalBreaking) : '', rodou ? n(r.totalBreakingOnHighSpeed) : '',
        rodou ? n(r.averageSpeed) : '', n(r.odometer)]
        .concat(temPerf ? [mov === null ? '' : n(mov / 60), nota !== null && nota >= 0 && nota <= 100 ? n(nota) : ''].concat(PERF_COLS.map(([, nome]) => pct(nome))) : [], [escC(cli), '1']).join(';'));
    });
    return { csv: [cols.join(';')].concat(linhas).join('\n'), n: linhas.length };
  }

  async function buscarApi(cli) {
    const f = E.apiForm, token = tokenDe(cli);
    if (!token) { toast('Salve o token da API deste cliente antes de buscar.', 'erro'); return; }
    if (!f.ini || !f.fim || f.ini > f.fim) { toast('Escolha um período válido.', 'erro'); return; }
    if (D.dif(f.ini, f.fim) > 92) { toast('Busque no máximo 93 dias por vez.', 'erro'); return; }
    const st = E.apiStatus = { cli, rodando: true, msg: 'Começando…', feito: [], erro: null };
    const passo = (msg) => { st.msg = msg; render(); };
    const fim = f.fim > D.hoje() ? D.hoje() : f.fim;
    try {
      if (f.estat) {
        const dias = [];
        for (let d = f.ini; d <= fim; d = D.somar(d, 1)) dias.push(d);
        let veics = 0, comDados = 0, perfOk = true, perfErro = '';
        E.importCli = cli; E.silencio = true;
        try {
          for (let i = 0; i < dias.length; i++) {
            passo('Estatísticas e performance por veículo: dia ' + (i + 1) + ' de ' + dias.length + ' (' + D.br(dias[i]) + ')');
            const jan = Object.assign(janelaUTC(dias[i]), { vehicleIdentification: '' });
            const recs = registros(await apiGet('v1/vehicle-statistics', jan, token));
            let perf = [];
            // sem a performance (token sem acesso, falha pontual) as estatísticas do dia entram mesmo assim
            if (perfOk) { try { perf = registros(await apiGet('v1/vehicle-performance', jan, token)); } catch (e) { perfOk = false; perfErro = e.message; } }
            const { csv, n } = diaParaCSV(dias[i], recs, perf, cli);
            if (!n) continue;
            if (importarTexto(csv, 'API Gobrax · estatísticas', true, 'veiculos')) { comDados++; veics = Math.max(veics, n); }
          }
        } finally { E.importCli = null; E.silencio = false; E.impVeic = null; }
        st.feito.push(comDados ? 'estatísticas' + (perfOk ? ' e performance' : '') + ' de ' + comDados + (comDados === 1 ? ' dia' : ' dias') + ' (até ' + veics + ' veículos)' : 'estatísticas: a API não trouxe veículos no período');
        if (!perfOk) st.feito.push('performance não veio (' + perfErro + ')');
      }
      if (f.odo) {
        passo('Odômetro dos veículos…');
        const agora = Date.now();
        const recs = registros(await apiGet('v2/vehicle-odometer', { startDate: utc(agora - 30 * 86400000), endDate: utc(agora), vehicleIdentification: '' }, token));
        const veiculos = recs.filter((r) => r && r.vehicleIdentification).map((r) => ({ placa: placaApi(r.vehicleIdentification), odometro: numApi(r.odometer), coletado: String(r.lastUpdated || '') }));
        await gravarDocApi(idPlan('odometro', cli, 'atual', 1), { alvo: 'odometro', cliente: cli, data: D.hoje(), veiculos, em: new Date().toISOString() });
        st.feito.push('odômetro de ' + veiculos.length + ' veículos');
      }
      if (f.prem) {
        passo('Scores e premiação dos motoristas…');
        const mes = (iso) => iso.slice(5, 7) + '-' + iso.slice(0, 4);
        const j = await apiGet('v2/driversOverview', { documentNumbers: '', startDate: mes(f.ini), endDate: mes(fim) }, token);
        // só nome, nota, km e bonificação: CPF e id do motorista são descartados aqui, antes de qualquer gravação
        const porMes = {};
        registros(j).forEach((m) => {
          const nome = String((m && (m.Name || m.name)) || '').trim();
          if (!nome) return;
          ((m.Overview || m.overview) || []).forEach((o) => {
            const dt = String(o.Date || o.date || ''), mm = dt.match(/^(\d{2})-(\d{4})$/);
            if (!mm || o.Err) return;
            const k = mm[2] + '-' + mm[1];
            (porMes[k] = porMes[k] || []).push({ nome, nota: numApi(o.Score), km: numApi(o.TotalKM !== undefined ? o.TotalKM : o.TotalKm), premio: numApi(o.Reward) });
          });
        });
        const meses = Object.keys(porMes).sort();
        for (const k of meses) await gravarDocApi(idPlan('premiacao', cli, k, 1), { alvo: 'premiacao', cliente: cli, data: k, motoristas: porMes[k], em: new Date().toISOString() });
        st.feito.push(meses.length ? 'premiação de ' + meses.length + (meses.length === 1 ? ' mês' : ' meses') : 'premiação: nenhum motorista com dados no período');
      }
    } catch (e) {
      st.erro = (e && e.code) ? msgErroDb(e) : (e && e.message) || 'erro desconhecido';
    }
    st.rodando = false;
    E.veicVer++; baseVeicCache = null; reaplicarFiltro();
    render();
    if (st.erro) toast('API: ' + st.erro + '.', 'erro'); else toast('API: ' + st.feito.join(', ') + '.');
  }

  function cartaoApi(nome) {
    if (!E.apiForm || E.apiForm.cli !== nome) E.apiForm = { cli: nome, ini: D.somar(D.hoje(), -6), fim: D.hoje(), estat: true, odo: true, prem: true };
    const f = E.apiForm, tem = !!tokenDe(nome);
    const st = E.apiStatus && E.apiStatus.cli === nome ? E.apiStatus : null;
    const ck = (k, rot, dica) => `<label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-campo="api-${k}" ${f[k] ? 'checked' : ''} style="margin-top:2px"><span><b style="font-weight:600">${rot}</b><span class="apoio" style="display:block">${dica}</span></span></label>`;
    const odo = docsApi('odometro', nome)[0], prem = docsApi('premiacao', nome).map((d) => d.data).sort();
    return `<section class="card" id="api-gobrax">
      <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Buscar dados pela API Gobrax</h2>
        <span class="h2-sub">Preenche o painel direto da plataforma, sem planilha: estatísticas de cada veículo dia a dia, odômetro e premiação dos motoristas.</span></div></div>
      <div class="card-corpo">
        <div class="campo-bloco"><label class="campo-rotulo" for="api-token">Token da API de ${esc(nome)}</label>
          ${tem && !E.apiTrocar ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="badge badge-ok">Token salvo neste navegador</span>
              <button type="button" class="btn-link peq" data-acao="api-token-trocar">Trocar</button><button type="button" class="btn-link peq" data-acao="api-token-esquecer">Esquecer</button></div>`
            : `<div style="display:flex;gap:8px;flex-wrap:wrap"><input type="password" class="campo" id="api-token" autocomplete="off" spellcheck="false" placeholder="Cole aqui o token da API deste cliente" style="flex:1;min-width:220px">
              <button type="button" class="btn" data-acao="api-token-salvar" data-cli="${esc(nome)}">Salvar token</button></div>`}
          <span class="apoio">O token fica só neste navegador: não vai para a base compartilhada nem aparece para outras pessoas. Quem busca precisa ter o token; o resultado da busca fica visível a todos.</span></div>
        <div class="campo-bloco"><span class="campo-rotulo">Período</span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="date" class="campo" style="width:auto" data-campo="api-ini" value="${esc(f.ini)}" aria-label="Início do período da API">
            <span class="apoio">até</span>
            <input type="date" class="campo" style="width:auto" data-campo="api-fim" value="${esc(f.fim)}" aria-label="Fim do período da API">
          </div><span class="apoio">As estatísticas vêm dia a dia (horário de Brasília); o dia de hoje vem parcial e é atualizado a cada nova busca. A premiação vem por mês.</span></div>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${ck('estat', 'Estatísticas e performance por veículo', 'Por placa e por dia: km, litros, km/l, velocidade média e frenagens, mais faixa verde, embalo, motor ocioso, pressão do pedal, acima do verde, excesso de velocidade, piloto automático, freio motor e o motorista vinculado. Entra como planilha de veículos.')}
          ${ck('odo', 'Odômetro', 'Último odômetro de cada veículo e quando a unidade comunicou pela última vez.' + (odo ? ' Última busca: ' + D.br(odo.data) + '.' : ''))}
          ${ck('prem', 'Scores e premiação', 'Nota (0–100), km e bonificação de cada motorista, por mês. O CPF que a API devolve é descartado.' + (prem.length ? ' Meses já buscados: ' + prem.map((k) => k.slice(5) + '/' + k.slice(0, 4)).join(', ') + '.' : ''))}
        </div>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <button type="button" class="btn btn-primario" data-acao="api-buscar" data-cli="${esc(nome)}" ${!tem || (st && st.rodando) || !(f.estat || f.odo || f.prem) ? 'disabled' : ''}>${st && st.rodando ? '<span class="spinner"></span>Buscando…' : 'Buscar dados da API'}</button>
          ${st ? `<span class="apoio" role="status">${st.rodando ? esc(st.msg) : st.erro ? '<b class="critico-txt">Parou: ' + esc(st.erro) + '.</b>' + (st.feito.length ? ' Antes disso: ' + esc(st.feito.join(', ')) + '.' : '') : '✓ ' + esc(st.feito.join(', ')) + '.'}</span>` : ''}
        </div>
      </div>
    </section>`;
  }

  // Odômetro e comunicação de cada veículo (da última busca na API)
  function cartaoOdometro() {
    const doc = docsApi('odometro', E.cliente)[0];
    if (!doc || !doc.veiculos || !doc.veiculos.length) return '';
    const agora = Date.now();
    const horas = (s) => { const t = Date.parse(String(s).replace(' ', 'T').replace(/([+-]\d{2})(\d{2})$/, '$1:$2')); return Number.isFinite(t) ? (agora - t) / 3600000 : null; };
    const vs = doc.veiculos.map((v) => ({ ...v, h: horas(v.coletado) })).sort((a, b) => (b.h === null ? -1 : a.h === null ? 1 : b.h - a.h));
    const sit = (h) => (h === null ? '<span class="badge badge-vazio">Sem coleta</span>' : h <= 24 ? '<span class="badge badge-ok">Comunicando</span>' : h <= 72 ? '<span class="badge badge-atencao">Há ' + Math.round(h / 24) + ' dia(s)</span>' : '<span class="badge badge-critico">Há ' + Math.round(h / 24) + ' dias</span>');
    const atrasados = vs.filter((v) => v.h === null || v.h > 24).length;
    return `<section class="card">
      <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Odômetro e comunicação</h2>
        <span class="h2-sub">Da API Gobrax, buscado em ${D.br(doc.data)} · ${vs.length} veículos${atrasados ? ' · ' + atrasados + ' sem comunicar há mais de 24 h' : ' · todos comunicando'}. Veículo parado há dias pode indicar unidade eletrônica sem sinal.</span></div></div>
      <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px"><div class="tabela-wrap" style="max-height:420px;overflow:auto">
        <table class="tabela"><thead><tr><th>Veículo</th><th class="dir">Odômetro</th><th>Última coleta</th><th>Situação</th></tr></thead>
        <tbody>${vs.map((v) => `<tr><td>${esc(v.placa)}</td><td class="dir num">${v.odometro === null ? '—' : fmt(v.odometro, 0) + ' km'}</td><td class="num">${esc(v.coletado.slice(0, 16)) || '—'}</td><td>${sit(v.h)}</td></tr>`).join('')}</tbody></table></div></div>
    </section>`;
  }

  // Tela: Premiação (scores mensais dos motoristas, da API)
  function telaPremiacao() {
    const docs = docsApi('premiacao', E.cliente).sort((a, b) => (a.data < b.data ? -1 : 1));
    const cab = `<div class="pag-cab"><div class="pag-cab-texto"><h1 class="h1">Premiação</h1><span class="sub">Nota, km e bonificação de cada motorista por mês, da API Gobrax${E.cliente ? ' · ' + esc(E.cliente) : ''}.</span></div></div>`;
    if (!docs.length) return cab + `<section class="card"><div class="card-corpo"><div class="vazio"><span class="vazio-titulo">Nenhuma premiação buscada ainda</span>
      <span class="apoio">No perfil do cliente, salve o token da API e busque "Scores e premiação".</span><a class="btn btn-primario" href="${hrefDados()}" style="text-decoration:none;margin-top:4px">Abrir o perfil do cliente</a></div></div></section>`;
    const meses = docs.map((d) => d.data);
    if (!meses.includes(E.premMes)) E.premMes = meses[meses.length - 1];
    const i = meses.indexOf(E.premMes), atual = docs[i], ant = i > 0 ? docs[i - 1] : null;
    const antPor = new Map((ant ? ant.motoristas : []).map((m) => [ckey(m.nome), m]));
    const ls = atual.motoristas.slice().sort((a, b) => (b.nota || 0) - (a.nota || 0));
    const soma = (arr, k) => arr.reduce((s, m) => s + (m[k] || 0), 0);
    const notaMedia = (arr) => { const w = soma(arr, 'km'); return w ? arr.reduce((s, m) => s + (m.nota || 0) * (m.km || 0), 0) / w : null; };
    const indN = IND_MAP.nota, indKm = IND_MAP.km;
    const rotMes = (k) => D.nomeMes(k + '-01');
    const kp = (rot, v, vb, ind, txt) => `<div class="kpi"><span class="kpi-titulo">${rot}</span><span class="kpi-valor num">${txt}</span>${ant ? variacao(X.variacao(ind, v, vb), 'vs. ' + rotMes(ant.data)) : '<span class="kpi-ref">sem mês anterior buscado</span>'}</div>`;
    const indPrem = { var: 'pct', melhor: 0 };
    return `${cab}
      <section class="card"><div class="card-corpo" style="gap:10px"><span class="campo-rotulo">Mês</span><div style="display:flex;flex-wrap:wrap;gap:8px">
        ${meses.map((k) => `<button type="button" class="pilula ${k === E.premMes ? 'ativa' : ''}" data-acao="prem-mes" data-mes="${k}" aria-pressed="${k === E.premMes}">${rotMes(k)}</button>`).join('')}</div></div></section>
      <div class="grade-kpi">
        ${kp('Nota média', notaMedia(atual.motoristas), ant && notaMedia(ant.motoristas), indN, fmt(notaMedia(atual.motoristas), 1))}
        ${kp('Km rodados', soma(atual.motoristas, 'km'), ant && soma(ant.motoristas, 'km'), indKm, fmt(soma(atual.motoristas, 'km'), 0) + '<small>km</small>')}
        ${kp('Bonificação total', soma(atual.motoristas, 'premio'), ant && soma(ant.motoristas, 'premio'), indPrem, 'R$ ' + fmt(soma(atual.motoristas, 'premio'), 2))}
        <div class="kpi"><span class="kpi-titulo">Motoristas</span><span class="kpi-valor num">${ls.length}</span><span class="kpi-ref">${ls.filter((m) => (m.premio || 0) > 0).length} com bonificação</span></div>
      </div>
      <section class="card">
        <div class="card-cab"><div class="card-cab-texto"><h2 class="h2">Motoristas · ${rotMes(atual.data)}</h2><span class="h2-sub">Ordenado pela nota. Variação contra ${ant ? rotMes(ant.data) : 'o mês anterior (não buscado)'}. Buscado em ${D.br(String(atual.em || '').slice(0, 10))}.</span></div>
          <button type="button" class="btn" data-acao="exportar-premiacao">${icone('baixar', 14, '#5F6368')}Exportar CSV</button></div>
        <div class="card-corpo" style="padding-left:0;padding-right:0;padding-bottom:4px"><div class="tabela-wrap" style="max-height:560px;overflow:auto">
          <table class="tabela" style="min-width:680px"><thead><tr><th>#</th><th>Motorista</th><th>Nota</th><th class="dir">Variação da nota</th><th class="dir">Km</th><th class="dir">Bonificação</th></tr></thead>
          <tbody>${ls.map((m, n) => { const b = antPor.get(ckey(m.nome)); return `<tr><td class="num mudo">${n + 1}</td>
            <td><span class="pessoa">${avatar(m.nome, 28)}<span class="pessoa-nome">${esc(m.nome)}</span></span></td>
            <td>${badgeNota(m.nota)}</td><td class="dir">${b ? variacao(X.variacao(indN, m.nota, b.nota)) : '<span class="mudo">—</span>'}</td>
            <td class="dir num">${fmt(m.km, 0)} km</td><td class="dir num">R$ ${fmt(m.premio || 0, 2)}</td></tr>`; }).join('')}</tbody></table></div></div>

  }

  function periodoMotPadrao(nome) {
    const cs = coberturas({ linhas: linhasCli('veiculos', nome) });   // inclui planilha de um dia só (importação diária)
    if (cs.length) return { ini: cs[cs.length - 1].ini, fim: cs[cs.length - 1].fim };
    const fim = D.somar(D.inicioMes(D.hoje()), -1);
    return { ini: D.inicioMes(fim), fim };
  }
  const periodosTxt = (ls) => { const cs = coberturas({ linhas: ls }); return cs.length ? cs.map((c) => D.periodoBR(c)).join(' · ') : ''; };

  // Configurações → lista de clientes; cada cliente abre o próprio perfil, onde as planilhas são anexadas
  function telaClientes() {
    const f = E.clienteForm;
    const linhas = E.clientes.map((fc) => {
      const mot = linhasCli('motoristas', fc.nome), vei = linhasCli('veiculos', fc.nome);
