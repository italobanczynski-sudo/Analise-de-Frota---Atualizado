<script>
(function(){'use strict';
/* =====================================================================
   DADOS · ADAPTADOR · AGREGAÇÕES
   Tudo que a tela mostra sai de UMA lista de registros diários por veículo.
   - No servidor (rota /painel, com login): os registros vêm de /api/v1/painel/dados,
     a mesma base que o servidor busca de hora em hora na API Gobrax
     (v1/vehicle-statistics + v1/vehicle-performance).
   - Fora do servidor (arquivo aberto direto, GitHub Pages): dados simulados.
   Formato do registro:
     { t:<dia em número>, date:'AAAA-MM-DD', veh:'PLACA',
       km  = totalMileage,  l  = totalConsumption (litros),
       br  = totalBreaking, brh = totalBreakingOnHighSpeed,
       sp  = averageSpeed,  gr = indicators.greenRange.percentage,
       id  = indicators.idle.percentage, sc = score (0–100) }
   Campos sem dado ficam null e saem das médias (não viram zero).
   ===================================================================== */
const DAY=864e5;
const TODAY=(()=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}})();
const dIdx=iso=>{const [y,m,d]=iso.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY)};
const dIso=t=>new Date(t*DAY).toISOString().slice(0,10);
const wdOf=t=>new Date(t*DAY).getUTCDay();
const T0=dIdx(TODAY);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const isoMinus=n=>dIso(T0-n);

/* Clientes simulados: as datas são relativas a hoje para o protótipo sempre ter histórico */
const CLIENT_DEFS=[
  {id:'via',name:'Via Group',vehicles:33,start:isoMinus(29),seed:11,mood:'dip',unit:159.9,units:33,prefixes:['SFI','TXM','TYI','SDY'],anom:14,silent:4},
  {id:'caju',name:'Caju Transportes',vehicles:42,start:isoMinus(62),seed:23,mood:'decline',unit:159.9,units:42,prefixes:['QAB','QBC','QCD','QDE'],anom:5,silent:3},
  {id:'xtsul',name:'Xtsul Transportes LTDA',vehicles:15,start:isoMinus(124),seed:37,mood:'improve',unit:159.9,units:15,prefixes:['RLM','RMN','RNP'],anom:2,silent:1}
];
const FIRST=['Adalberto','Benedito','Caio','Davi','Edgar','Fabrício','Geraldo','Heitor','Ismael','Jair','Kleber','Leandro','Matheus','Nilton','Osvaldo','Plínio','Quirino','Renan','Silvio','Tadeu','Valdir','Wagner','Yuri','Altair','Bruno','Cléber','Denis','Elton','Flávio','Gilson'];
const LAST=['Almeida','Barros','Cardoso','Duarte','Esteves','Furtado','Guedes','Holanda','Jardim','Klein','Lacerda','Medeiros','Nogueira','Ornelas','Pacheco','Queiroz','Rezende','Siqueira','Teles','Uchoa','Vasques','Xavier','Zanetti','Amaral','Bastos','Caldas','Dantas','Fontes','Godoy','Lima'];
const FILIAIS=['Matriz','Filial Sul','Filial Norte'];

const DEFAULT_RULES={minKmpl:1.0,maxKmpl:7.0,maxKmDay:1200,minKmEval:30,wUso:28,wEng:22,wNota:22,wCons:17,wCrit:11,bandAlto:60,bandMedio:35,minCmpPct:50,bonusMin:70,bonusRate:0.02,diesel:7.26,defUnit:159.9};

function moodFn(mood,start){
  const peak=T0-9;
  if(mood==='dip')return t=>-0.12*Math.exp(-Math.pow((t-peak)/5.5,2));
  if(mood==='decline')return t=>-0.0016*(t-dIdx(start));
  return t=>0.0009*(t-dIdx(start));
}

function genClient(def){
  const rnd=mulberry(def.seed);const pick=a=>a[Math.floor(rnd()*a.length)];
  const letters='ABCDEFGHJKLMNPRSTUVXZ';const used=new Set();const vehicles=[];const recs=[];
  const mood=moodFn(def.mood,def.start);const tStart=dIdx(def.start);
  const lowN=Math.max(2,Math.round(def.vehicles*0.09));const lateN=2;
  for(let i=0;i<def.vehicles;i++){
    let p;do{p=pick(def.prefixes)+Math.floor(rnd()*10)+letters[Math.floor(rnd()*letters.length)]+(10+Math.floor(rnd()*90))}while(used.has(p));used.add(p);
    const skill=(rnd()-0.5)*2;
    const roll=rnd();
    const slope=roll<0.3?0.004+rnd()*0.014:roll<0.65?-(0.003+rnd()*0.01):(rnd()-0.5)*0.004;
    const v={id:p,driver:pick(FIRST)+' '+pick(LAST),filial:pick(FILIAIS),base:clamp(1.55+skill*0.14+(rnd()-0.5)*0.1,1.3,1.9),slope,kmDay:250+rnd()*210,
      gr:clamp(58+skill*12+(rnd()-0.5)*6,40,82),idl:clamp(9-skill*3+(rnd()-0.5)*3,3,16),br:clamp(19-skill*4+(rnd()-0.5)*4,9,30),sp:34+rnd()*10,
      from:tStart,to:T0,low:false,phone:''};
    if(i<lowN){v.low=true;v.to=tStart+Math.floor((T0-tStart)*0.4)}
    else if(i<lowN+lateN){v.from=T0-8-Math.floor(rnd()*3)}
    else if(i>=def.vehicles-def.silent){v.to=T0-(4+Math.floor(rnd()*4))}
    vehicles.push(v);
  }
  for(const v of vehicles){
    for(let t=v.from;t<=v.to;t++){
      const w=wdOf(t);const p=(w===0?0.18:w===6?0.42:0.95)*(v.low?0.35:1);
      if(rnd()>p)continue;
      const km=Math.round(v.kmDay*(0.55+rnd()*0.85)*(w===0||w===6?0.6:1));
      if(km<5)continue;
      const kmpl=clamp(v.base+v.slope*((t-tStart)/7)+mood(t)+(rnd()-0.5)*0.12,1.0,2.7);
      const br=v.br*(0.8+rnd()*0.4);const gr=clamp(v.gr*(0.92+rnd()*0.16)+mood(t)*40,20,92);const idl=clamp(v.idl*(0.8+rnd()*0.4)-mood(t)*20,1,25);
      const sc=clamp(Math.round(28+gr*0.55-idl*1.4-br*0.55+(kmpl-1.5)*30+(rnd()-0.5)*8),4,95);
      recs.push({t,date:dIso(t),veh:v.id,km,l:+(km/kmpl).toFixed(1),br:Math.round(km*br/100),brh:Math.round(km*(rnd()<0.3?rnd()*1.2:0)/100),sp:+(v.sp*(0.9+rnd()*0.2)).toFixed(1),gr:+gr.toFixed(1),id:+idl.toFixed(1),sc});
    }
  }
  const recent=recs.filter(r=>r.t>T0-30&&r.km>120);
  for(let i=0;i<def.anom&&recent.length;i++){const r=recent.splice(Math.floor(rnd()*recent.length),1)[0];r.l=+(r.l*(1.7+rnd()*0.3)).toFixed(1)}
  recs.sort((a,b)=>a.t-b.t);
  return{vehicles,recs};
}

/* ---------- Servidor (plataforma com login) ---------- */
const REAL={on:false,eu:null,raw:null,live:{},liveAt:{},msgs:{},phones:{},busy:{},prem:[]};
async function srv(caminho,metodo='GET',corpo){
  const op={method:metodo,credentials:'same-origin',headers:{'X-Requisicao':'plataforma'}};
  if(corpo!==undefined){op.headers['Content-Type']='application/json';op.body=JSON.stringify(corpo)}
  const r=await fetch(caminho,op);
  if(r.status===401){location.replace('/');throw new Error('sessão encerrada')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j||!j.ok)throw new Error((j&&j.erro)||('O servidor respondeu '+r.status));
  return j.dados;
}
/* liga o modo servidor quando a página está atrás do login da plataforma */
async function detectServer(){
  if(!/^https?:$/.test(location.protocol))return false;
  try{REAL.eu=await srv('/api/v1/auth/eu');REAL.on=true;return true}catch(e){return false}
}
const nv=v=>v==null||v===''||!isFinite(+v)?null:+v;
const nkey=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();

/* um cliente de /api/v1/painel/dados → {vehicles, recs, ...} no formato das telas */
function fleetFromServer(c){
  const vmap=new Map(),drv={},recs=[],lastComm={};
  /* a performance diária da API não traz nota (o servidor grava nota vazia): a Nota Gobrax real é a do mês de cada
     motorista, na premiação (v2/driversOverview). Dia sem nota usa a nota do mês do motorista que dirigia o veículo. */
  const premNota={};for(const p of c.premiacoes||[]){const n=nv(p.nota);if(n!=null&&n>=0&&n<=100&&p.mes&&p.motorista)premNota[nkey(p.motorista)+'|'+p.mes]=n}
  const seen=(p,t)=>{if(lastComm[p]==null||t>lastComm[p])lastComm[p]=t};
  for(const r of c.registros||[]){
    const p=String(r.placa||'').trim();if(!p)continue;const dia=String(r.dia).slice(0,10);const t=dIdx(dia);
    if(!vmap.has(p))vmap.set(p,{id:p,driver:'',filial:'Frota',phone:''});
    if(r.motorista){(drv[p]=drv[p]||{})[r.motorista]=(drv[p][r.motorista]||0)+1}
    const km=nv(r.km)||0,l=nv(r.litros)||0;
    if(km>0)seen(p,t);
    if(!r.rodou||km<=0||l<=0)continue;
    let scd=nv(r.nota);if(scd!=null&&(scd<0||scd>100))scd=null;
    const nota=scd!=null?scd:r.motorista?premNota[nkey(r.motorista)+'|'+dia.slice(0,7)]??null:null;
    recs.push({t,date:dia,veh:p,km,l,br:nv(r.frenagens),brh:nv(r.frenagens_alta),sp:nv(r.velocidade_media),gr:nv(r.faixa_verde),ifv:nv(r.inicio_faixa_verde),id:nv(r.motor_ocioso),sc:nota,scd});
  }
  /* odômetro: a última comunicação da unidade eletrônica conta como sinal */
  for(const o of c.odometros||[]){const p=String(o.placa||'').trim();const d=String(o.coletado||'').slice(0,10);if(p&&/^\d{4}-\d\d-\d\d$/.test(d)){if(!vmap.has(p))vmap.set(p,{id:p,driver:'',filial:'Frota',phone:''});seen(p,dIdx(d))}}
  /* motorista de cada veículo: quem mais o dirigiu; e o veículo principal de cada motorista */
  const drvPlate={},cnt={};
  for(const r of c.motoristas||[]){if(!r.motorista||!r.placa)continue;const k=r.motorista;(cnt[k]=cnt[k]||{})[r.placa]=(cnt[k][r.placa]||0)+1}
  for(const k in cnt)drvPlate[nkey(k)]=Object.entries(cnt[k]).sort((a,b)=>b[1]-a[1])[0][0];
  /* sem motorista vinculado na API: a placa ocupa o lugar do nome (como no painel clássico) */
  vmap.forEach(v=>{const d=drv[v.id];v.driver=d?Object.entries(d).sort((a,b)=>b[1]-a[1])[0][0]:v.id;v.noDriver=!d;if(d)for(const n in d)if(!drvPlate[nkey(n)])drvPlate[nkey(n)]=v.id});
  recs.sort((a,b)=>a.t-b.t);
  const vehicles=[...vmap.values()].sort((a,b)=>a.id.localeCompare(b.id));
  return{vehicles,recs,lastComm,drvPlate,prem:c.premiacoes||[],srvId:c.id};
}
function clientsFromServer(raw){
  return raw.map(c=>{const f=fleetFromServer(c);const first=f.recs.length?f.recs[0].date:null;
    return{id:String(c.id),srvId:c.id,name:c.nome,vehicles:f.vehicles.length,units:f.vehicles.length,unit:DEFAULT_RULES.defUnit,start:first,_fleet:f}}).filter(c=>c.start);
}

/* ---------- Adaptador ---------- */
const Gobrax={api:{
  async getClients(){
    if(REAL.on){REAL.raw=await srv('/api/v1/painel/dados');return clientsFromServer(REAL.raw)}
    await delay(60);return CLIENT_DEFS.map(c=>({id:c.id,name:c.name,units:c.units,unit:c.unit,start:c.start}));
  },
  async getFleet(clientId){
    const def=CLIENT_DEFS.find(c=>c.id===clientId);
    if(REAL.on)return def._fleet||{vehicles:[],recs:[],lastComm:{},drvPlate:{},prem:[]};
    await delay(280);return genClient(def);
  },
  /* posição agora e rastro de hoje (servidor) */
  async getLive(clientId){
    const def=CLIENT_DEFS.find(c=>c.id===clientId);if(!REAL.on||!def)return null;
    const placas=DB.fleets[clientId].vehicles.map(v=>v.id);const out={veiculos:{},rastro:{}};
    for(let i=0;i<placas.length;i+=150){
      const d=await srv('/api/v1/clientes/'+def.srvId+'/ao-vivo?placas='+encodeURIComponent(placas.slice(i,i+150).join(',')));
      (d.veiculos||[]).forEach(v=>out.veiculos[v.placa]=v);Object.assign(out.rastro,d.rastro||{});
    }
    return out;
  },
  /* mensagens enviadas a cada motorista e a nota em cada envio (servidor) */
  async getSent(clientId){const def=CLIENT_DEFS.find(c=>c.id===clientId);if(!REAL.on||!def)return null;return srv('/api/v1/clientes/'+def.srvId+'/mensagens/enviadas')},
  /* telefones dos condutores (servidor; só CS e administrador) */
  async getPhones(clientId){const def=CLIENT_DEFS.find(c=>c.id===clientId);if(!REAL.on||!def)return null;return srv('/api/v1/clientes/'+def.srvId+'/condutores')},
  /* premissas de cada cliente (valor por unidade, unidades, diesel): a mesma coleção do painel clássico */
  async getPremissas(){if(!REAL.on)return[];const l=await srv('/api/v1/base/premissas');return(l||[]).map(d=>({id:d.id,...(d.dados||{})}))},
  async savePremissas(id,dados){return srv('/api/v1/base/premissas/'+encodeURIComponent(id),'PUT',dados)}
}};

/* ---------- Premissas do cliente (contrato e diesel) ---------- */
/* mesmas regras do painel clássico: documento "pr-<nome>" na coleção premissas; nome comparado sem acento/pontuação/LTDA */
const ckeyCli=v=>nkey(v).replace(/[.,/\-]/g,' ').replace(/\b(ltda|eireli|epp|me|s a|sa)\b/g,' ').replace(/\s+/g,' ').trim();
const idDocCli=t=>String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,140);
function premissasDe(def){
  if(!def)return{};
  if(!REAL.on){const c=ST.contracts[def.id]||{};return{valorEquip:c.unit,qtd:c.units}}
  return REAL.prem.find(d=>ckeyCli(d.cliente)===ckeyCli(def.name))||{};
}
/* contrato que vale nas contas: o digitado; sem ele, R$ 159,90 por veículo com dado */
function contratoDe(def){const pm=premissasDe(def);const unit=pm.valorEquip>0?+pm.valorEquip:DEFAULT_RULES.defUnit,units=pm.qtd>0?+pm.qtd:(def.vehicles||def.units||1);return{unit,units,unitAuto:!(pm.valorEquip>0),unitsAuto:!(pm.qtd>0)}}
const dieselDe=def=>{const pm=premissasDe(def);return pm.preco>0?+pm.preco:ST.rules.diesel};
async function salvarContrato(def,unit,units){
  if(!REAL.on){ST.contracts[def.id]={unit:unit||undefined,units:units||undefined};persist();return}
  const at=premissasDe(def);const mud=[];const R=v=>v?fmt.brl(v,2):'—';
  if((at.valorEquip||null)!==(unit||null))mud.push('valor por equipamento '+R(at.valorEquip)+' → '+R(unit));
  if((at.qtd||null)!==(units||null))mud.push('equipamentos '+(at.qtd||'—')+' → '+(units||'—'));
  if(!mud.length)return false;
  const nova={...at,cliente:at.cliente||def.name,valorEquip:unit||null,qtd:units||null};delete nova.id;
  nova.historico=[{em:new Date().toISOString(),por:(REAL.eu&&REAL.eu.nome)||'',mudou:mud.join('; ')+' (pelo painel novo)'}].concat(at.historico||[]).slice(0,100);
  const id=at.id||'pr-'+idDocCli(def.name);await Gobrax.api.savePremissas(id,nova);
  const i=REAL.prem.findIndex(d=>d.id===id);const doc={id,...nova};if(i>=0)REAL.prem[i]=doc;else REAL.prem.push(doc);return true;
}

/* ---------- Banco em memória ---------- */
const DB={fleets:{},cache:new Map(),ver:0,
  async load(id){if(!this.fleets[id]){this.fleets[id]=await Gobrax.api.getFleet(id);this.fleets[id].byId=Object.fromEntries(this.fleets[id].vehicles.map(v=>[v.id,v]))}return this.fleets[id]},
  bump(){this.ver++;this.cache.clear()}
};
const flagId=(cid,r)=>cid+':'+r.veh+':'+r.t;
function isSusp(r,rules){const k=r.km/r.l;return k<rules.minKmpl||k>rules.maxKmpl||r.km>rules.maxKmDay}
function validRecs(cid,store){
  const k='v'+cid;if(DB.cache.has(k))return DB.cache.get(k);
  const f=DB.fleets[cid];const out=[];
  for(const r of f.recs){const fl=store.flags[flagId(cid,r)];
    if(fl&&fl.l){const r2={...r,l:fl.l};if(!isSusp(r2,store.rules))out.push(r2);continue}
    if(!isSusp(r,store.rules)||fl==='confirmed')out.push(r)}
  DB.cache.set(k,out);return out;
}
function suspRecs(cid,store){return DB.fleets[cid].recs.filter(r=>{if(!isSusp(r,store.rules))return false;const fl=store.flags[flagId(cid,r)];if(fl==='confirmed'||fl==='ignored')return false;if(fl&&fl.l&&!isSusp({...r,l:fl.l},store.rules))return false;return true})}
/* médias ponderadas pelos km; campo sem dado (null) fica fora da média daquele indicador */
function aggregate(rs){
  const o={km:0,l:0,br:0,brh:0,n:rs.length};const w={sp:[0,0],gr:[0,0],ifv:[0,0],id:[0,0],sc:[0,0],scd:[0,0],br:[0,0],brh:[0,0]};
  for(const r of rs){o.km+=r.km;o.l+=r.l;
    for(const f in w){const v=r[f];if(v!=null&&isFinite(v)){w[f][0]+=(f==='br'||f==='brh')?v:v*r.km;w[f][1]+=r.km}}}
  const k=o.km;const wv=f=>w[f][1]?w[f][0]/w[f][1]:null;
  o.br=w.br[0];o.brh=w.brh[0];
  o.kmpl=o.l?o.km/o.l:null;o.kmDay=o.n?o.km/o.n:null;o.br100=w.br[1]?w.br[0]/w.br[1]*100:null;o.brh100=w.brh[1]?w.brh[0]/w.brh[1]*100:null;
  o.speed=wv('sp');o.green=wv('gr');o.ifv=wv('ifv');o.idle=wv('id');o.score=wv('sc');o.scd=wv('scd');
  o.lph100=k?o.l/k*100:null;
  return o;
}
function premFleet(prem,from,to){
  if(!REAL.on||!prem||!prem.length)return null;const ini=dIso(from).slice(0,7),fim=dIso(to).slice(0,7);
  /* média simples das notas dos motoristas, como a "Performance média" da tela de Premiação da plataforma Gobrax
     (cada motorista conta uma vez por mês, rodando muito ou pouco) */
  const calc=(a,b)=>{let s=0,n=0;const meses=new Set(),mots=new Set();
    for(const p of prem){if(!p.mes||p.mes<a||p.mes>b)continue;const nota=nv(p.nota);if(nota==null||nota<0||nota>100)continue;s+=nota;n++;meses.add(p.mes);mots.add(nkey(p.motorista))}
    return n?{nota:s/n,motoristas:mots.size,meses:[...meses].sort()}:null};
  const r=calc(ini,fim);if(r)return r;
  /* mês ainda sem premiação (o atual costuma sair depois): vale o último mês com premiação, até 2 meses antes */
  const ant=prem.map(p=>p.mes).filter(m=>m&&m<ini&&m>=prevMonth(prevMonth(ini))).sort().pop();
  const x=ant?calc(ant,ant):null;return x?{...x,stale:true}:null;
}
function metrics(cid,store,from,to,vehFilter){
  const key=['m',cid,from,to,vehFilter||'',DB.ver].join('|');if(DB.cache.has(key))return DB.cache.get(key);
  let rs=validRecs(cid,store).filter(r=>r.t>=from&&r.t<=to);
  if(vehFilter)rs=rs.filter(r=>vehFilter(r.veh));
  const m=aggregate(rs);m.len=to-from+1;m.from=from;m.to=to;
  const by={};for(const r of rs)(by[r.veh]=by[r.veh]||[]).push(r);
  m.byVeh={};for(const id in by){const a=aggregate(by[id]);a.id=id;m.byVeh[id]=a}
  m.active=Object.keys(by).length;
  const days=new Set(rs.map(r=>r.t));m.dataDays=days.size;
  const f=DB.fleets[cid];m.total=f.vehicles.length;
  /* Nota Gobrax da frota = a mesma conta da tela Premiação: média das notas dos motoristas no(s) mês(es) do período,
     ponderada pelos km (quem não rodou fica fora). Vale mesmo quando a API não diz quem dirigia cada veículo. */
  const pf=premFleet(f.prem,from,to);m.prem=pf;if(pf)m.score=pf.nota;
  let last=f.lastComm;if(!last){last={};for(const r of f.recs)last[r.veh]=r.t}
  m.noSignal=Object.keys(last).filter(v=>last[v]<T0-3).map(v=>({id:v,days:T0-last[v]})).sort((a,b)=>b.days-a.days);
  DB.cache.set(key,m);return m;
}
function dailySeries(cid,store,from,to,vehFilter){
  const rs=validRecs(cid,store).filter(r=>r.t>=from&&r.t<=to&&(!vehFilter||vehFilter(r.veh)));const by={};
  for(const r of rs)(by[r.t]=by[r.t]||[]).push(r);const out=[];
  for(let t=from;t<=to;t++){const a=by[t]?aggregate(by[t]):null;out.push({t,date:dIso(t),a})}
  return out;
}
function weeklySeries(cid,store,from,to){
  const out=[];let t=from;let n=1;
  while(t<=to){const dow=(wdOf(t)+6)%7;const end=Math.min(to,t+(6-dow));const a=metrics(cid,store,t,end);
    out.push({n,from:t,to:end,partial:(dow!==0&&t===from)||end-t<6,a});t=end+1;n++}
  return out;
}

/* ---------- Períodos ---------- */
function resolvePeriod(st){
  const p=st.period;let from,to=T0;
  if(p.preset==='7d')from=T0-6;else if(p.preset==='30d')from=T0-29;else if(p.preset==='90d')from=T0-89;
  else if(p.preset==='custom'){from=dIdx(p.from);to=dIdx(p.to)}
  else{const d=new Date(T0*DAY);from=dIdx(d.toISOString().slice(0,8)+'01')}
  const len=to-from+1;let cf,ct,cl;
  if(st.compare==='mes'){const d=new Date(from*DAY);const pm=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1));cf=Math.round(pm/DAY);ct=from-1;cl='mês anterior ('+fmt.dm(dIso(cf))+' a '+fmt.dm(dIso(ct))+')'}
  else{ct=from-1;cf=ct-len+1;cl='período anterior ('+fmt.dm(dIso(cf))+' a '+fmt.dm(dIso(ct))+')'}
  return{from,to,len,cf,ct,clen:ct-cf+1,label:fmt.dm(dIso(from))+' a '+fmt.dm(dIso(to)),cmpLabel:cl};
}

/* ---------- Índice de risco (regras da plataforma) ---------- */
function health(cur,prev,rules){
  const S=[];const pct=(c,p)=>p?(c-p)/p*100:null;
  const cd=cur.km/cur.len,pd=prev.km/prev.len;
  const short=prev.dataDays<prev.len*rules.minCmpPct/100;const shortTxt='Base de comparação curta ('+prev.dataDays+' de '+prev.len+' dias com dado). Sinal fora do índice';
  if(short){S.push({k:'uso',label:'Uso da frota',w:rules.wUso,risk:null,txt:shortTxt});S.push({k:'eng',label:'Engajamento dos motoristas',w:rules.wEng,risk:null,txt:shortTxt})}
  else{
  if(prev.km>0&&cur.km>=0){const ch=pct(cd,pd);S.push({k:'uso',label:'Uso da frota',w:rules.wUso,risk:ch>=0?0:clamp(-ch*3,0,100),txt:'Km por dia do calendário '+fmt.sp(ch)+' vs. período anterior'})}else S.push({k:'uso',label:'Uso da frota',w:rules.wUso,risk:null,txt:'Sem base de comparação'});
  if(prev.n>0){const a=pct(cur.n/cur.len,prev.n/prev.len),b=pct(cur.active,prev.active);const part=x=>x<0?clamp(-x*2.8,0,100):0;S.push({k:'eng',label:'Engajamento dos motoristas',w:rules.wEng,risk:clamp((part(a)+part(b))/2,0,100),txt:cur.active+' veículos ativos (antes '+prev.active+') · '+fmt.sp(a)+' em dias trabalhados por dia'})}else S.push({k:'eng',label:'Engajamento dos motoristas',w:rules.wEng,risk:null,txt:'Sem base de comparação'});
  }
  if(cur.score!=null){const lv=clamp((70-cur.score)*2.5,0,100);let r=lv,t='Nota '+fmt.n(cur.score,1);if(prev.score!=null){const dr=Math.max(0,prev.score-cur.score);r=0.6*lv+0.4*clamp(dr*8,0,100);t+=' (antes '+fmt.n(prev.score,1)+')'}S.push({k:'nota',label:'Nota Gobrax',w:rules.wNota,risk:r,txt:t})}else S.push({k:'nota',label:'Nota Gobrax',w:rules.wNota,risk:null,txt:'Sem nota no período'});
  if(prev.kmpl&&cur.kmpl){const worse=Math.max(0,(prev.kmpl-cur.kmpl)/prev.kmpl*100);S.push({k:'cons',label:'Resultado de consumo',w:rules.wCons,risk:clamp(worse*5,0,100),txt:'Média '+fmt.n(cur.kmpl,2)+' km/l ('+fmt.sp(pct(cur.kmpl,prev.kmpl))+')'})}else S.push({k:'cons',label:'Resultado de consumo',w:rules.wCons,risk:null,txt:'Sem base de comparação'});
  const vs=Object.values(cur.byVeh).filter(v=>v.score!=null);
  if(vs.length){const sh=vs.filter(v=>v.score<40).length/vs.length*100;S.push({k:'crit',label:'Motoristas com nota crítica',w:rules.wCrit,risk:clamp(sh*2.5,0,100),txt:fmt.n(sh,0)+'% dos veículos com nota abaixo de 40'})}else S.push({k:'crit',label:'Motoristas com nota crítica',w:rules.wCrit,risk:null,txt:'Sem dado'});
  const av=S.filter(s=>s.risk!=null);const tw=av.reduce((a,s)=>a+s.w,0)||1;
  for(const s of S){s.share=s.risk!=null?s.w/tw*100:null;s.pts=s.risk!=null?s.risk*s.w/tw:null}
  const idx=av.reduce((a,s)=>a+s.pts,0);
  const band=idx>=rules.bandAlto?'ALTO':idx>=rules.bandMedio?'MÉDIO':'BAIXO';
  const top=[...av].sort((a,b)=>b.pts-a.pts)[0];
  return{idx:Math.round(idx),band,signals:S,top};
}

/* ---------- Oportunidades / ganhos e perdas ---------- */
function quant(arr,q){const a=arr.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y);if(!a.length)return null;const p=(a.length-1)*q;const lo=Math.floor(p),hi=Math.ceil(p);return a[lo]+(a[hi]-a[lo])*(p-lo)}
function opportunities(cur,prev,price){
  const vs=Object.values(cur.byVeh).filter(v=>v.km>150&&v.kmpl);
  const ref=quant(vs.map(v=>v.kmpl),0.75);
  const worse=ref?vs.filter(v=>v.kmpl<ref).map(v=>({id:v.id,kmpl:v.kmpl,money:(v.l-v.km/ref)*price})).sort((a,b)=>b.money-a.money):[];
  const potential=worse.reduce((a,v)=>a+v.money,0);
  const fell=[];for(const v of vs){const p=prev.byVeh[v.id];if(p&&p.kmpl&&p.km>150){const ch=(v.kmpl-p.kmpl)/p.kmpl*100;if(ch<-2)fell.push({id:v.id,from:p.kmpl,to:v.kmpl,ch})}}
  fell.sort((a,b)=>a.ch-b.ch);
  const kdRef=quant(vs.map(v=>v.kmDay),0.75);const low=kdRef?vs.filter(v=>v.kmDay<kdRef*0.8).sort((a,b)=>a.kmDay-b.kmDay):[];
  const brRef=quant(vs.map(v=>v.br100),0.25);const brW=brRef!=null?vs.filter(v=>v.br100!=null&&v.br100>brRef).length:0;
  return{ref,worse,potential,fell,evaluated:vs.length,kdRef,low,brRef,brW};
}
function gainsLosses(cur,prev,price){
  const out=[];
  for(const id in cur.byVeh){const v=cur.byVeh[id],p=prev.byVeh[id];if(!p||!p.kmpl||!v.kmpl||v.km<100)continue;const saved=(v.km/p.kmpl-v.l);out.push({id,money:saved*price,liters:saved,from:p.kmpl,to:v.kmpl})}
  out.sort((a,b)=>b.money-a.money);return out;
}
function vehStatus(cur,prev,id){
  const v=cur.byVeh[id],p=prev.byVeh[id];if(!v||!p||!p.kmpl||!v.kmpl)return{k:'base',label:'SEM BASE',cls:'n',ch:null};
  const ch=(v.kmpl-p.kmpl)/p.kmpl*100;if(ch>2)return{k:'up',label:'EVOLUIU',cls:'ok',ch};if(ch<-2)return{k:'down',label:'REGREDIU',cls:'bad',ch};return{k:'flat',label:'ESTÁVEL',cls:'n',ch};
}

/* ---------- Estudo do projeto ---------- */
function study(cid,store,price){
  const def=CLIENT_DEFS.find(c=>c.id===cid);const ct=contratoDe(def);
  const ps=dIdx(def.start);const len=T0-ps+1;const half=ps+Math.floor(len/2)-1;
  /* linha de base igual à do painel clássico: com 8 semanas ou mais, início = primeiras 4 semanas e agora = últimas 4;
     com menos, a primeira e a segunda metade do período */
  const nWk=weeklySeries(cid,store,ps,T0).length,curto=nWk<8;
  const pIni=curto?[ps,half]:[ps,ps+27],pAgora=curto?[half+1,T0]:[T0-27,T0];
  const rotIni=curto?'primeira metade do período':'primeiras 4 semanas',rotAgora=curto?'segunda metade':'últimas 4 semanas';
  const first=metrics(cid,store,pIni[0],pIni[1]);const base=first.kmpl||metrics(cid,store,ps,T0).kmpl||1;
  const mens=ct.unit*ct.units;const months=[];
  let cum=0,cumI=0;const weeks=[];
  const recs=validRecs(cid,store).filter(r=>r.t>=ps);
  const monthsMap={};
  for(const r of recs){const ym=r.date.slice(0,7);const m=monthsMap[ym]=monthsMap[ym]||{ym,km:0,l:0,sc:0,sk:0,days:new Set()};m.km+=r.km;m.l+=r.l;if(r.sc!=null){m.sc+=r.sc*r.km;m.sk+=r.km}m.days.add(r.t)}
  for(let t=ps;t<=T0;t++){const ym=dIso(t).slice(0,7);const m=monthsMap[ym]=monthsMap[ym]||{ym,km:0,l:0,sc:0,sk:0,days:new Set()};m.cal=(m.cal||0)+1}
  for(const ym of Object.keys(monthsMap).sort()){const m=monthsMap[ym];const econ=(m.km/base-m.l)*price;const inv=mens*m.cal/30;
    const [y,mo]=ym.split('-');const mi=dIdx(ym+'-01'),pfm=REAL.on?premFleet(DB.fleets[cid].prem,mi,mi):null;
    months.push({ym,label:MESES[+mo-1]+' '+y,from:fmt.dm(dIso(Math.max(ps,mi))),econ,inv,kmpl:m.l?m.km/m.l:null,score:pfm&&!pfm.stale?pfm.nota:m.sk?m.sc/m.sk:null,km:m.km,cal:m.cal})}
  const wk=weeklySeries(cid,store,ps,T0);
  for(const w of wk){const a=w.a;const e=a.km?(a.km/base-a.l)*price:0;cum+=e;cumI+=mens*(w.to-w.from+1)/30;weeks.push({n:w.n,label:fmt.dm(dIso(w.to)),cum,cumI})}
  const econ=months.reduce((a,m)=>a+m.econ,0),inv=months.reduce((a,m)=>a+m.inv,0);
  const second=metrics(cid,store,pAgora[0],pAgora[1]);const pace=second.km?((second.km/base-second.l)*price)/(second.len)*30:0;
  const all=metrics(cid,store,ps,T0);
  return{ct,mens,base,first,second,months,weeks,econ,inv,miss:Math.max(0,inv-econ),roi:inv?econ/inv:null,pays:econ>=inv,pace,ps,half,len,all,pIni,pAgora,rotIni,rotAgora,evolved:null};
}
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---------- Premiação ---------- */
const prevMonth=ym=>{const [y,m]=ym.split('-').map(Number);const d=new Date(Date.UTC(y,m-2,1));return d.toISOString().slice(0,7)};
function premiacao(cid,store,ym){
  const f=DB.fleets[cid];const pym=prevMonth(ym);
  /* no servidor: o resultado oficial da premiação Gobrax (v2/driversOverview) quando existe para o mês */
  if(REAL.on&&f.prem&&f.prem.some(p=>p.mes===ym)){
    const prevBy={};f.prem.filter(p=>p.mes===pym&&p.nota!=null).forEach(p=>prevBy[nkey(p.motorista)]=Math.round(p.nota));
    return f.prem.filter(p=>p.mes===ym&&p.nota!=null).map(p=>({id:f.drvPlate[nkey(p.motorista)]||p.motorista,name:p.motorista,score:Math.round(p.nota),prev:prevBy[nkey(p.motorista)]??null,km:nv(p.km)||0,bonus:nv(p.premio)||0,official:true})).sort((x,y)=>y.score-x.score);
  }
  const rs=validRecs(cid,store).filter(r=>r.date.slice(0,7)===ym);const by={};
  for(const r of rs)(by[r.veh]=by[r.veh]||[]).push(r);
  const prs=validRecs(cid,store).filter(r=>r.date.slice(0,7)===pym);const pb={};for(const r of prs)(pb[r.veh]=pb[r.veh]||[]).push(r);
  return Object.keys(by).map(id=>{const a=aggregate(by[id]);if(a.score==null)return null;const p=pb[id]?aggregate(pb[id]):null;const sc=Math.round(a.score);const bonus=sc>=store.rules.bonusMin?a.km*store.rules.bonusRate:0;
    return{id,name:f.byId[id].driver,score:sc,prev:p&&p.score!=null?Math.round(p.score):null,km:a.km,bonus}}).filter(Boolean).sort((x,y)=>y.score-x.score);
}
function premMonths(cid,store){const s=new Set(validRecs(cid,store).map(r=>r.date.slice(0,7)));const f=DB.fleets[cid];if(REAL.on&&f.prem)f.prem.forEach(p=>p.mes&&s.add(p.mes));return[...s].sort()}
function scoreBand(s){return s==null||!isFinite(s)?{k:'e',label:'SEM NOTA',cls:'n'}:s>=70?{k:'g',label:'BOM',cls:'ok'}:s>=40?{k:'y',label:'ATENÇÃO',cls:'warn'}:{k:'r',label:'CRÍTICO',cls:'bad'}}

/* ---------- Mensagem do dia ---------- */
function dayMessage(cid,store,veh,t){
  const f=DB.fleets[cid];const v=f.byId[veh];const recs=validRecs(cid,store).filter(r=>r.veh===veh&&r.t<=t);
  const cur=recs.find(r=>r.t===t);if(!cur)return null;
  const prevR=[...recs].reverse().find(r=>r.t<t);const m=dIso(t).slice(0,7);const month=aggregate(recs.filter(r=>r.date.slice(0,7)===m));
  const kmpl=cur.km/cur.l;const pk=prevR?prevR.km/prevR.l:null;
  const pts=[];const ok=x=>x!=null&&isFinite(x);
  if(prevR){if(ok(cur.gr)&&ok(prevR.gr))pts.push({k:'Faixa verde',d:cur.gr-prevR.gr,txt:'aumente o tempo na faixa verde do conta-giros'});if(ok(cur.id)&&ok(prevR.id))pts.push({k:'Motor ocioso',d:-(cur.id-prevR.id),txt:'evite deixar o motor ligado parado nas esperas'});if(ok(cur.br)&&ok(prevR.br))pts.push({k:'Freadas',d:-(cur.br/cur.km*100-prevR.br/prevR.km*100),txt:'mantenha mais distância do veículo da frente para frear menos'})}
  const worst=pts.sort((a,b)=>a.d-b.d)[0];
  const first=v.noDriver?'':v.driver.split(' ')[0];const score=month.score!=null?Math.round(month.score):null;
  let txt='Olá'+(first?', '+first:'')+'! Aqui é a Gobrax. Seu dia '+fmt.dm(dIso(t))+': '+fmt.n(cur.km,0)+' km rodados e média de '+fmt.n(kmpl,2)+' km/l';
  if(pk)txt+=' ('+fmt.sp((kmpl-pk)/pk*100)+' contra o último dia em que você rodou)';
  txt+='.';if(score!=null)txt+=' Sua nota no mês é '+score+' ('+scoreBand(score).label.toLowerCase()+').';
  txt+=worst?' Para melhorar: '+worst.txt+'. Conta com a gente!':' Continue assim!';
  return{veh,name:v.driver,first,km:cur.km,kmpl,pk,point:worst?worst.k:null,pointD:worst?worst.d:null,score,text:txt,phone:v.phone};
}

function fitCharts(root=document,quiet=false){

    const cw=Math.round(svg.getBoundingClientRect().width);if(cw<120)return;if(Math.abs(cw-(ent.cw||0))<4)return;
    const html=ent.fn({...ent.o,w:cw,_id:+svg.dataset.cr,_quiet:quiet}).trim();if(!html.startsWith('<svg'))return;

function lineChart(o){
  const W=o.w||720,H=o.h||250,pl=o.pl||46,pr=o.pr||14,pt=o.marks?34:(o.vlabels?26:16),pb=o.sub?42:28;const n=o.labels.length;
  const vals=o.series.flatMap(s=>s.vals).filter(v=>v!=null&&isFinite(v));
  if(!vals.length)return`<div class="empty"><b>Sem dados no período</b>Escolha outro período.</div>`;
  let lo=o.ymin!=null?o.ymin:Math.min(...vals,o.base?o.base.v:Infinity),hi=o.ymax!=null?o.ymax:Math.max(...vals,o.base?o.base.v:-Infinity);
  if(o.ymin==null){const pd=(hi-lo)*0.12||1;lo-=pd;hi+=pd}if(hi===lo)hi=lo+1;
  const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<1.5?1:f<3?2:f<7?5:10)*p};
  const stp=nice((hi-lo)/4);lo=Math.floor(lo/stp+1e-9)*stp;hi=Math.ceil(hi/stp-1e-9)*stp;

  if(o.sub)o.sub.forEach((t,i)=>{if(t&&i%step===0)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" style="font-size:10.5px;font-weight:700">${esc(t)}</text>`});
  let body='';
  if(o.base){const yy=y(o.base.v);body+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--n400)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-pr}" y="${yy-6}" text-anchor="end">${esc(o.base.label)}</text>`}
  o.series.forEach((s,si)=>{
    let d='',ar='',seg=[];
    s.vals.forEach((v,i)=>{if(v==null||!isFinite(v)){if(seg.length)flush();return}seg.push([x(i),y(v)])});flush();
    function flush(){if(!seg.length)return;d+='M'+seg.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');if(s.area&&seg.length>1)ar+='M'+seg[0][0].toFixed(1)+' '+(H-pb)+' L'+seg.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' L'+seg[seg.length-1][0].toFixed(1)+' '+(H-pb)+' Z';seg=[]}
    if(ar)body+=`<path class="areaf" d="${ar}" fill="${s.color}" fill-opacity=".14"/>`;
    if(d)body+=`<path class="draw" pathLength="100" d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||3}" stroke-linejoin="round" stroke-linecap="round"${s.dash?` stroke-dasharray="${s.dash}" style="animation:none;stroke-dashoffset:0"`:''}/>`;
    if(s.dots)s.vals.forEach((v,i)=>{if(v!=null&&isFinite(v))body+=`<circle class="pt" style="--i:${i}" cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${s.dotColors?'var(--card)':'var(--amarelo)'}" stroke="${s.dotColors?s.dotColors[i]:'var(--preto)'}" stroke-width="2.5"/>`});
  });
  if(o.vline!=null&&o.vline>=0){const mx=x(o.vline);body+=`<line x1="${mx}" x2="${mx}" y1="${pt-6}" y2="${H-pb}" stroke="var(--text)" stroke-width="1.4" stroke-dasharray="4 4" opacity=".55"/>`}
  if(o.vlabels)o.series[0].vals.forEach((v,i)=>{if(v!=null&&isFinite(v))body+=`<text class="pt" style="--i:${i};font-weight:800;font-size:12px;fill:var(--text)" x="${x(i)}" y="${y(v)-10}" text-anchor="middle">${o.vlabels(v,i)}</text>`});
  if(o.marks)o.marks.forEach(m=>{const mx=x(m.i);body+=`<line x1="${mx}" x2="${mx}" y1="${pt-4}" y2="${H-pb}" stroke="var(--text)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/><g class="pt" style="--i:${m.n}"><circle cx="${mx}" cy="${pt-16}" r="11" fill="var(--preto)"/><text x="${mx}" y="${pt-12}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:12px">${m.n}</text></g>`});
  let hits='';const bw=(W-pl-pr)/Math.max(1,n-1);
  for(let i=0;i<n;i++){const tip=o.tip?o.tip(i):esc(o.labels[i]);if(!tip)continue;const first=o.series[0].vals[i];
    hits+=`<g class="hit" data-tt="${esc(tip)}"><rect x="${x(i)-bw/2}" y="${pt}" width="${bw}" height="${H-pt-pb}"/><line class="xh" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${H-pb}"/>${first!=null&&isFinite(first)?`<circle class="xd" cx="${x(i)}" cy="${y(first)}" r="6" fill="${o.series[0].color}" stroke="var(--card)" stroke-width="2"/>`:''}</g>`}

}
function spark(vals,color='var(--laranja)'){

}

/* ---------- Pós-render: contadores, abas, tooltips ---------- */
function enhance(root,anim=true){
  $$('.rise',root).forEach((e,i)=>e.style.setProperty('--i',Math.min(i,14)));
  $$('.bfill',root).forEach((e,i)=>e.style.setProperty('--i',i));
  fitCharts(root);placeTabs(root);
  try{initMaps(root)}catch(e){console.warn('mapa',e)}
  const els=$$('[data-count]',root);
  if(!anim||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  els.forEach(e=>{
    const target=parseFloat(e.dataset.count),d=+e.dataset.dec,pre=e.dataset.pre,suf=e.dataset.suf;const t0=performance.now(),dur=1000;
    const step=now=>{const p=Math.min(1,(now-t0)/dur),k=1-Math.pow(1-p,3);e.textContent=pre+fmt.n(target*k,d)+suf;if(p<1)requestAnimationFrame(step)};
    e.textContent=pre+fmt.n(0,d)+suf;requestAnimationFrame(step);
  });
}
function placeTabs(root=document){
  $$('.tabs',root).forEach(t=>{let ind=$('.tab-ind',t);if(!ind){ind=document.createElement('i');ind.className='tab-ind';t.appendChild(ind)}
    const on=$('button.on',t);if(on){ind.style.width=on.offsetWidth+'px';ind.style.transform=`translateX(${on.offsetLeft}px)`}});
}
function placeNav(){
  const nav=$('.nav');if(!nav)return;const on=$('a.on',nav);const ind=$('.nav-ind',nav);if(!ind)return;
  if(!on){ind.style.opacity=0;return}
  const first=!ind.dataset.placed;if(first)ind.style.transition='none';
  ind.style.opacity=1;ind.style.transform=`translateY(${on.offsetTop}px)`;ind.style.height=on.offsetHeight+'px';
  if(first){ind.dataset.placed='1';void ind.offsetHeight;requestAnimationFrame(()=>ind.style.transition='')}
}

/* resultado de um indicador: antes x agora */
function indRes(i,cur,prev){
  const a=cur!=null?i.get(cur):null,b=prev?i.get(prev):null;
  if(a==null||b==null||!b)return{ch:null,k:'base',label:'SEM BASE',cls:'n'};
  const ch=(a-b)/Math.abs(b)*100;
  if(Math.abs(ch)<2)return{ch,k:'same',label:'ESTÁVEL',cls:'n'};
  if(i.up===null)return{ch,k:ch>0?'up':'down',label:ch>0?'SUBIU':'DESCEU',cls:'n'};
  const good=(ch>0)===i.up;return{ch,k:good?'better':'worse',label:good?'MELHOROU':'PIOROU',cls:good?'ok':'bad'};
}
const indGood=(i,ch)=>ch==null||i.up===null?null:(ch>0)===i.up;

/* agregado de um veículo (ou da frota) em um intervalo */
function aggFor(C,from,to,id){
  if(!id)return metrics(C.cid,ST,from,to);
  return aggregate(validRecs(C.cid,ST).filter(r=>r.veh===id&&r.t>=from&&r.t<=to));
}
/* séries por granularidade: dia · semana · quinzena · mês */
function buckets(C,gran,id){
  const start=dIdx(C.def.start),out=[];const push=(f,e,label)=>{f=Math.max(f,start);if(e<f)return;const a=aggFor(C,f,e,id);out.push({from:f,to:e,label,a:a.n?a:null})};
  if(gran==='dia'){for(let t=C.P.from;t<=C.P.to;t++)push(t,t,fmt.dm(dIso(t)))}
  else if(gran==='semana'){const mon=T0-((wdOf(T0)+6)%7);for(let i=7;i>=0;i--){const f=mon-7*i,e=Math.min(T0,f+6);if(e<start)continue;push(f,e,fmt.dm(dIso(Math.max(f,start))))}}
  else if(gran==='quinzena'){const d=new Date(T0*DAY);let y=d.getUTCFullYear(),m=d.getUTCMonth();const list=[];
    for(let k=0;k<7;k++){const first=dIdx(`${y}-${String(m+1).padStart(2,'0')}-01`),mid=first+14,last=Math.round(Date.UTC(y,m+1,1)/DAY)-1;list.unshift([mid+1,Math.min(T0,last),`2ª quinz. ${MESES[m]}`],[first,Math.min(T0,mid),`1ª quinz. ${MESES[m]}`]);m--;if(m<0){m=11;y--}}
    list.filter(x=>x[0]<=T0&&x[1]>=start).slice(-6).forEach(x=>push(x[0],x[1],x[2]))}
  else{const d=new Date(T0*DAY);let y=d.getUTCFullYear(),m=d.getUTCMonth();const list=[];
    for(let k=0;k<6;k++){const first=dIdx(`${y}-${String(m+1).padStart(2,'0')}-01`),last=Math.round(Date.UTC(y,m+1,1)/DAY)-1;list.unshift([first,Math.min(T0,last),MESES[m]+'/'+String(y).slice(2)]);m--;if(m<0){m=11;y--}}
    list.filter(x=>x[1]>=start).forEach(x=>push(x[0],x[1],x[2]))}
  return out;
}

/* ---------- Medidor de Nota Gobrax (ticks) ---------- */
function gaugeNota(v,sub='NOTA GOBRAX',ink=false){
  const N=41;let t='';const has=v!=null&&isFinite(v);
  for(let i=0;i<N;i++){const p=i/(N-1)*100,ang=Math.PI*(1-i/(N-1));const c=Math.cos(ang),s=Math.sin(ang);
    const lit=has&&p<=v+0.01;const col=ink?(lit?'#2b2b2b':'rgba(255,255,253,.55)'):!lit?'var(--n200)':p<40?'var(--bad)':p<70?'var(--warn)':'var(--ok)';
    t+=`<line class="tk" style="--i:${i}" x1="${(100+c*66).toFixed(1)}" y1="${(98-s*66).toFixed(1)}" x2="${(100+c*88).toFixed(1)}" y2="${(98-s*88).toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`}
  return`<div class="gnota ${ink?'ink':''}"><svg viewBox="0 0 200 110" role="img" aria-label="${has?'Nota Gobrax '+Math.round(v)+' de 100':'Sem nota'}">${t}</svg><div class="gv num">${has?count(Math.round(v),0):'—'}</div><div class="tag">${sub}</div></div>`;
}

/* ---------- Radar "Perfil de condução" ---------- */
function radar(axes){
  const have=axes.filter(a=>a.cur!=null&&a.fleet);if(have.length<3)return`<div class="empty" style="padding:40px 10px"><b>Poucos indicadores</b>Faltam dados para montar o gráfico de teia.</div>`;
  const Sz=340,c=Sz/2,R=98,n=axes.length;
  const rr=(v,f,up)=>{if(v==null||!f)return .04;const q=up?v/f:(v>0?f/v:2);return clamp(.5+(q-1)*.8,.06,1)};
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[c+Math.cos(a)*R*r,c+Math.sin(a)*R*r]};
  const poly=(f)=>axes.map((a,i)=>pt(i,f(a)).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g='';[.25,.5,.75,1].forEach(r=>g+=`<polygon points="${poly(()=>r)}" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  axes.forEach((a,i)=>{const [x,y]=pt(i,1);g+=`<line x1="${c}" y1="${c}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(i,1.2);const cs=Math.cos(-Math.PI/2+i*2*Math.PI/n);g+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${Math.abs(cs)<.2?'middle':cs>0?'start':'end'}">${esc(a.l)}</text>`});
  const hasPrev=axes.some(a=>a.prev!=null);
  const body=`<polygon class="rad" points="${poly(a=>.5)}" fill="none" stroke="var(--n400)" stroke-width="1.8" stroke-dasharray="5 4"/>`
    +(hasPrev?`<polygon class="rad" style="--d:.1s" points="${poly(a=>rr(a.prev,a.fleet,a.up))}" fill="none" stroke="var(--info)" stroke-width="2" stroke-dasharray="3 3"/>`:'')
    +`<polygon class="rad" style="--d:.25s" points="${poly(a=>rr(a.cur,a.fleet,a.up))}" fill="var(--amarelo)" fill-opacity=".28" stroke="var(--laranja)" stroke-width="2.6" stroke-linejoin="round"/>`
    +axes.map((a,i)=>{const [x,y]=pt(i,rr(a.cur,a.fleet,a.up));return`<circle class="pt" style="--i:${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="var(--laranja)" stroke="var(--card)" stroke-width="2" data-tt="<b>${esc(a.l)}</b><br>Agora: ${esc(a.fc(a.cur))}${a.prev!=null?'<br>Antes: '+esc(a.fc(a.prev)):''}<br>Frota: ${esc(a.fc(a.fleet))}"/>`}).join('');
  return`<svg class="chart radar" viewBox="${-30} 0 ${Sz+60} ${Sz}" role="img" aria-label="Perfil de condução">${g}${body}</svg><div class="leg" style="justify-content:center;margin-top:6px"><span><i style="background:var(--amarelo)"></i>Agora</span>${hasPrev?'<span><i style="background:var(--info)"></i>Antes</span>':''}<span><i style="background:var(--n400)"></i>Média da frota</span></div>`;
}
function radarAxes(cur,prev,fleet){
  const ks=['kmpl','br100','green','idle','score','kmDay'],lab={kmpl:'Consumo',br100:'Freadas',green:'Faixa verde',idle:'Ociosidade',score:'Nota',kmDay:'Km/dia'};
  return ks.map(k=>{const i=INDK[k];return{l:lab[k],cur:cur?i.get(cur):null,prev:prev?i.get(prev):null,fleet:fleet?i.get(fleet):null,up:i.up,fc:v=>fInd(i,v)}});
}

/* ---------- Dispersão com quadrantes ---------- */
function scatter(pts,o){
  const W=o.w||720,H=o.h||380,pl=52,pr=20,pt=20,pb=44;
  if(pts.length<2)return`<div class="empty"><b>Poucos condutores com base de comparação</b></div>`;
  let xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);let xlo=Math.min(...xs),xhi=Math.max(...xs),yl=Math.max(Math.abs(Math.min(...ys)),Math.abs(Math.max(...ys)),5);
  const px=(xhi-xlo)*.1||.1;xlo-=px;xhi+=px;yl=Math.ceil(yl*1.1/5)*5;
  const X=v=>pl+(v-xlo)/(xhi-xlo)*(W-pl-pr),Y=v=>pt+(yl-v)/(2*yl)*(H-pt-pb);
  const mx=X(o.xMid),my=Y(o.yMid);
  let g=`<rect x="${mx}" y="${pt}" width="${Math.max(0,W-pr-mx)}" height="${my-pt}" fill="var(--ok-s)" opacity=".55"/><rect x="${pl}" y="${my}" width="${Math.max(0,mx-pl)}" height="${H-pb-my}" fill="var(--bad-s)" opacity=".55"/>`;
  g+=`<text class="ql" x="${W-pr-8}" y="${pt+16}" text-anchor="end">${o.q[0]}</text><text class="ql" x="${pl+8}" y="${pt+16}">${o.q[1]}</text><text class="ql" x="${W-pr-8}" y="${H-pb-10}" text-anchor="end">${o.q[2]}</text><text class="ql" x="${pl+8}" y="${H-pb-10}">${o.q[3]}</text>`;
  for(let k=-yl;k<=yl;k+=yl/2){g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${Y(k)}" y2="${Y(k)}"/><text x="${pl-8}" y="${Y(k)+4}" text-anchor="end">${k>0?'+':k<0?'−':''}${fmt.n(Math.abs(k),0)}%</text>`}
  for(let k=0;k<=4;k++){const v=xlo+(xhi-xlo)*k/4;g+=`<text x="${X(v)}" y="${H-pb+18}" text-anchor="middle">${fmt.n(v,2)}</text>`}
  g+=`<line x1="${mx}" x2="${mx}" y1="${pt}" y2="${H-pb}" stroke="var(--n400)" stroke-dasharray="5 5"/><line x1="${pl}" x2="${W-pr}" y1="${my}" y2="${my}" stroke="var(--n400)" stroke-dasharray="5 5"/>`;
  g+=`<text x="${(pl+W-pr)/2}" y="${H-6}" text-anchor="middle">${esc(o.xl)}</text><text transform="rotate(-90)" x="${-(pt+H-pb)/2}" y="12" text-anchor="middle">${esc(o.yl)}</text>`;
  const dots=pts.map((p,i)=>{const col=p.x>=o.xMid&&p.y>=o.yMid?'var(--ok)':p.x<o.xMid&&p.y<o.yMid?'var(--bad)':'var(--laranja)';
    return`<g class="sp" data-act="drv-open" data-id="${esc(p.id)}" style="--i:${i}" data-tt="${esc(p.tip)}"><circle cx="${X(p.x).toFixed(1)}" cy="${Y(clamp(p.y,-yl,yl)).toFixed(1)}" r="7" fill="${col}" fill-opacity=".85" stroke="var(--card)" stroke-width="2"/></g>`}).join('');
  return`<svg class="chart scat${o._quiet?' noanim':''}" data-cr="${chartReg((q)=>scatter(pts,q),o)}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Dispersão')}">${g}${dots}</svg>`;
}

/* ---------- Lista divergente (ganhos e perdas) ---------- */
function diverging(items,o={}){
  if(!items.length)return`<div class="empty"><b>Sem comparação disponível</b></div>`;
  const max=Math.max(...items.map(i=>Math.abs(i.v)),1e-9);
  return`<div class="dv">${items.map((it,k)=>{const w=Math.abs(it.v)/max*50;const pos=it.v>=0;
    return`<div class="dvr" ${it.id?`data-act="drv-open" data-id="${esc(it.id)}"`:''}><div class="dvl"><b>${esc(it.l)}</b><span class="xs muted">${esc(it.s||'')}</span></div><div class="dvt"><i class="dvz"></i><div class="bfill dvb ${pos?'':'neg'}" style="--i:${k};${pos?'left:50%':'right:50%'};width:${w}%;background:${pos?'var(--ok)':'var(--bad)'}"></div></div><div class="dvv num b" style="color:${pos?'var(--ok-t)':'var(--bad-t)'}">${o.f?o.f(it.v):fmt.brl(it.v)}</div></div>`}).join('')}</div>`;
}

/* ---------- Calendário de desempenho (pontos) ---------- */
/* get(t) → {val, extra} ou null; m = {name, d, u, f:[bom, atenção], leg:[3 rótulos]} */
function dotCal(from,to,get,m){
  m=m||{name:'Nota',d:0,u:'',f:[70,40],leg:['Bom (70+)','Atenção (40 a 69)','Crítico (abaixo de 40)']};
  const mon=from-((wdOf(from)+6)%7);const wk=Math.floor((to-mon)/7)+1;const L=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let h=L.map((l,i)=>`<span class="dl-l" style="grid-row:${i+2};grid-column:1">${l}</span>`).join('');let mesAnt='';
  for(let t=from;t<=to;t++){const col=Math.floor((t-mon)/7)+2,row=(wdOf(t)+6)%7+2;const r=get(t);const v=r?r.val:null;
    const mes=dIso(t).slice(0,7);if(mes!==mesAnt){mesAnt=mes;const fimMes=Math.min(to,Math.round(Date.UTC(+mes.slice(0,4),+mes.slice(5),1)/DAY)-1);
      /* mês com menos de 2 semanas no início do calendário: sem nome, senão encosta no nome do mês seguinte */
      if(!(t===from&&fimMes-t<13))h+=`<span class="dl-l" style="grid-row:1;grid-column:${col}/span 4;font-weight:600;color:var(--text)">${MESES[+mes.slice(5)-1]}</span>`}
    const cl=v==null?'e':v>=m.f[0]?'g':v>=m.f[1]?'y':'r';const tip=r?`<b>${fmt.dmy(dIso(t))}</b><br>${esc(m.name)}: ${v==null?'sem dado':fmt.n(v,m.d)+m.u}${r.extra?'<br>'+r.extra:''}`:`${fmt.dmy(dIso(t))} · sem rodagem`;
    h+=`<i class="d ${cl}" style="grid-row:${row};grid-column:${col};--i:${Math.min(t-from,60)}" data-tt="${esc(tip)}"></i>`}
  const z=wk>9?15:24;/* muitas semanas: pontos menores para o calendário caber no cartão */
  return`<div class="dotcal${wk>9?' sm':''}" style="grid-template-columns:30px repeat(${wk},${z}px);grid-template-rows:18px repeat(7,${z}px)">${h}</div><div class="leg" style="margin-top:14px"><span><i style="background:var(--ok);border-radius:99px"></i>${m.leg[0]}</span><span><i style="background:var(--warn);border-radius:99px"></i>${m.leg[1]}</span><span><i style="background:var(--bad);border-radius:99px"></i>${m.leg[2]}</span><span><i style="background:var(--soft);border-radius:99px"></i>Sem rodagem ou sem dado</span></div>`;
}
/* calendário dos últimos 3 meses (frota ou um veículo). Cor do dia como no painel clássico: nota do dia quando a API
   manda; senão início da faixa verde; senão faixa verde; sem nenhum dos três, consumo contra a média dos 3 meses. */
function calBlock(C,id){
  const to=C.P.to,from=Math.max(dIdx(C.def.start),to-90);
  const ds=dailySeries(C.cid,ST,from,to,id?x=>x===id:null);const has=k=>ds.some(d=>d.a&&d.a[k]!=null);
  let m;
  if(has('scd'))m={k:'scd',name:'Nota do dia',d:0,u:'',f:[70,40],leg:['Bom (70+)','Atenção (40 a 69)','Crítico (abaixo de 40)']};
  else if(has('ifv'))m={k:'ifv',name:'Início da faixa verde',d:0,u:'%',f:[85,55],leg:['Ideal (85%+)','Aceitável (55% a 84%)','Abaixo de 55%']};
  else if(has('green'))m={k:'green',name:'Faixa verde',d:0,u:'%',f:[85,55],leg:['85%+','55% a 84%','Abaixo de 55%']};

/* ---------- Barras diárias (hachuradas, destaque no hover) ---------- */
function dailyBars(vals,labels,o={}){

  const stp=nice(max0/4),hi=Math.ceil(max0/stp)*stp;const n=vals.length,bw=(W-pl-pr)/n;const y=x=>pt+(hi-x)/hi*(H-pt-pb);const id=uid('ht');

/* ---------- Barras por mês: investimento ao lado da economia ---------- */
function monthBars(rows,o={}){ // rows:[{label,inv,econ,sub}]
  if(!rows.length)return`<div class="empty"><b>Sem meses no período</b></div>`;
  const W=o.w||720,H=o.h||300,pl=62,pr=12,pt=26,pb=o.sub?46:30;
  const vals=rows.flatMap(r=>[r.inv,r.econ]).filter(v=>v!=null&&isFinite(v));let lo=Math.min(0,...vals),hi=Math.max(1,...vals);
  const nice=r=>{const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<1.5?1:f<3?2:f<7?5:10)*p};
  const stp=nice((hi-lo)/4||1);lo=Math.floor(lo/stp)*stp;hi=Math.ceil(hi*1.12/stp)*stp;
  const y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);const n=rows.length,gw=(W-pl-pr)/n,bw=Math.min(54,gw*.3);
  const k=v=>Math.abs(v)>=1000?fmt.n(v/1000,1)+' mil':fmt.n(v,0);
  let g='';for(let v=lo;v<=hi+1e-9;v+=stp)g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v?'R$ '+k(v):'0'}</text>`;
  if(lo<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--n500)" stroke-width="1.5"/>`;
  const bar=(x,v,cls,fill,i,tip)=>{if(v==null||!isFinite(v))return'';const y0=y(0),yv=y(v),top=Math.min(y0,yv),h=Math.max(1,Math.abs(y0-yv));
    return`<rect class="dbar" style="--i:${i};transform-origin:${v>=0?'bottom':'top'}" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${fill}" data-tt="${esc(tip)}"/><text x="${(x+bw/2).toFixed(1)}" y="${(v>=0?top-6:top+h+13).toFixed(1)}" text-anchor="middle" style="font-weight:700;font-size:11px;fill:var(--text)">${k(v)}</text>`};
  rows.forEach((r,i)=>{const cx=pl+gw*i+gw/2;const tip=`<b>${esc(r.label)}</b><br>Investimento: ${fmt.brl(r.inv)}<br>Economia: ${fmt.brl(r.econ)}<br>Saldo: ${fmt.brl(r.econ-r.inv)}`;
    g+=bar(cx-bw-3,r.inv,'inv','var(--n600)',i*2,tip)+bar(cx+3,r.econ,'eco',r.econ>=0?'var(--ok)':'var(--bad)',i*2+1,tip);
    g+=`<text x="${cx}" y="${H-(o.sub?24:8)}" text-anchor="middle" style="font-weight:600;fill:var(--text)">${esc(r.label)}</text>`;
    if(o.sub&&r.sub)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" style="font-size:10.5px">${esc(r.sub)}</text>`});
  return`<svg class="chart${o._quiet?' noanim':''}" data-cr="${chartReg(q=>monthBars(rows,q),o)}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Investimento e economia por mês')}">${g}</svg>`;
}

const hhBR=utc=>{try{return new Date(utc.replace(' ','T')+'Z').toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'})}catch(e){return''}};

/* trajeto do dia. Servidor: o rastro de ignição ligada desde a meia-noite. Simulado: 16 pontos ao longo da rota */
function dayRoute(C,v){
  if(REAL.on){
    const l=REAL.live[C.cid];const rs=(l&&l.rastro&&l.rastro[v.id]||[]).slice().sort((a,b)=>a.data<b.data?-1:1);
    if(rs.length<2)return null;const pts=rs.map(p=>[+p.lat,+p.lon]);let km=0;for(let i=1;i<pts.length;i++)km+=kmBetween(pts[i-1],pts[i]);
    let paradas=0;for(let i=1;i<rs.length;i++)if(rs[i].status!=='movimento'&&rs[i-1].status==='movimento')paradas++;
    return{pts,km:Math.round(km),paradas,stops:[{i:0,l:'Primeiro sinal do dia',h:hhBR(rs[0].data)},{i:pts.length-1,l:'Último sinal',h:hhBR(rs[rs.length-1].data)}],geo:vehGeo(C,v)};
  }
  const g=geoFor(C.cid);const geo=vehGeo(C,v);const route=g.routes[geo.ri];const pts=[];const n=16;const span=.28;
  const rnd=mulberry(hs(v.id+'day'));
  for(let i=0;i<n;i++){const t=geo.t-span+span*(i/(n-1));const p=pathAt(route,t);pts.push([p[0]+(rnd()-.5)*.03,p[1]+(rnd()-.5)*.03])}
  pts[n-1]=[geo.lat,geo.lng];

  const start=5*60+40+Math.floor(rnd()*30);const hh=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const stops=[{i:0,l:'Saída',h:hh(start)},{i:5,l:'Parada · 18 min',h:hh(start+95)},{i:11,l:'Parada · 32 min',h:hh(start+230)},{i:n-1,l:'Agora',h:hh(start+330)}];
  return{pts,stops,km,paradas:2,geo};
}

/* ---------- instâncias ---------- */
let MAPS=[];

function mapEl(id,o={}){return`<div class="lmap ${o.cls||''}" data-map="${o.mode||'full'}" ${id?`data-id="${esc(id)}"`:''} style="height:${o.h||520}px" role="application" aria-label="Mapa da frota"></div>`}

function initMaps(root=document){

  Object.values(inst.markers).forEach(o=>{if(!(f==='all'||f===o.geo.st))return;const p=map.project([o.geo.lat,o.geo.lng],z);const k=Math.floor(p.x/46)+'_'+Math.floor(p.y/46);(cells[k]=cells[k]||[]).push(o)});
  Object.values(cells).forEach(arr=>{
    if(arr.length===1){arr[0].m.setLatLng([arr[0].geo.lat,arr[0].geo.lng]).addTo(inst.cl);return}
    if(z>=12){const c=map.project([arr[0].geo.lat,arr[0].geo.lng],z);arr.forEach((o,i)=>{const a=i*2*Math.PI/arr.length,r=22;o.m.setLatLng(map.unproject([c.x+Math.cos(a)*r,c.y+Math.sin(a)*r],z)).addTo(inst.cl)});return}
    const n=arr.length,cnt={};arr.forEach(o=>cnt[o.geo.st]=(cnt[o.geo.st]||0)+1);let acc=0;
    const ring=Object.entries(cnt).map(([k,v])=>{const a=acc/n*360;acc+=v;return`${CL_COL[k]} ${a}deg ${acc/n*360}deg`}).join(',');
    const lat=arr.reduce((a,o)=>a+o.geo.lat,0)/n,lng=arr.reduce((a,o)=>a+o.geo.lng,0)/n;
    L.marker([lat,lng],{icon:L.divIcon({className:'mkw',html:`<div class="mkc" style="background:conic-gradient(${ring})"><b>${n}</b></div>`,iconSize:[44,44],iconAnchor:[22,22]}),zIndexOffset:300})
      .on('click',()=>map.fitBounds(L.latLngBounds(arr.map(o=>[o.geo.lat,o.geo.lng])),{padding:[70,70],maxZoom:Math.min(13,z+4)})).addTo(inst.cl)});
}
function applyMapFilter(inst){

function drawRoute(inst,C,v,dr){
  const map=inst.map;if(inst.route)inst.route.forEach(l=>map.removeLayer(l));inst.route=[];
  const base=L.polyline(dr.pts,{color:'#2b2b2b',weight:7,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(map);

/* ---------- Evolução da frota/condutor por granularidade ---------- */
function evoBlock(C,id){
  const u=S.u,gran=u.evoGran||'semana',mk=u.evoMetric||'kmpl';const ind=INDK[mk];
  const bs=buckets(C,gran,id);const pv=bs.map(b=>b.a?ind.get(b.a):null);
  const dc=pv.map((v,i)=>{if(v==null)return'var(--n300)';let j=i-1;while(j>=0&&pv[j]==null)j--;if(j<0)return'var(--n400)';const g=indGood(ind,(v-pv[j])/Math.abs(pv[j]||1)*100);return g==null?'var(--n400)':g?'var(--ok)':'var(--bad)'});
  const chart=lineChart({labels:bs.map(b=>b.label),series:[{vals:pv,color:'var(--laranja)',area:true,dots:true,dotColors:dc}],yfmt:v=>fmt.n(v,ind.d),h:230,
    tip:i=>bs[i].a?`<b>${esc(bs[i].label)}</b><br>${esc(ind.l)}: ${fInd(ind,pv[i])}<br>${fmt.n(bs[i].a.km,0)} km`:'',aria:'Evolução de '+ind.l});
  const rows=IND.filter(i=>!(i.veh&&!id)&&i.k!=='n'||id&&i.k==='n').slice(0,10);
  const cell=(i,b,k)=>{if(!b.a)return'<td class="r muted">—</td>';const v=i.get(b.a);if(v==null)return'<td class="r muted">—</td>';let j=k-1;while(j>=0&&!bs[j].a)j--;let cls='',dv='';
    if(j>=0){const pvv=i.get(bs[j].a);if(pvv){const chg=(v-pvv)/Math.abs(pvv)*100,g=indGood(i,chg);if(Math.abs(chg)>=2&&g!=null)cls=g?'cg':'cb';dv=`<span class="evd">${chg>0?'▲':chg<0?'▼':''} ${fmt.n(Math.abs(chg),1)}%</span>`}}
    return`<td class="r ${cls}"><div class="num evv">${fmt.n(v,i.d)}</div>${dv}</td>`};
  const unit=i=>{const u=(i.u||'').trim();return i.k==='lph100'?'L por 100 km':u.startsWith('/')?'por '+u.slice(1).trim():u==='%'?'% do tempo':u==='pts'?'pontos (0–100)':u};
  const tbl=`<div class="scroll-x"><table class="tbl evo"><thead><tr><th>Indicador</th><th>Unidade</th>${bs.map(b=>`<th class="r">${esc(b.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(i=>`<tr><td><b>${esc(i.l)}</b></td><td class="muted xs">${esc(unit(i))}</td>${bs.map((b,k)=>cell(i,b,k)).join('')}</tr>`).join('')}</tbody></table></div><div class="xs muted" style="margin-top:10px">Cada célula traz o valor do período e, abaixo, a variação em % contra a coluna anterior (▲ subiu, ▼ caiu). Verde melhorou e vermelho piorou (variações menores que 2% não são coloridas).</div>`;
  const opts=IND.filter(i=>!i.veh).map(i=>`<option value="${i.k}" ${i.k===mk?'selected':''}>${esc(i.l)}</option>`).join('');
  return`<div class="card sec rise">${cardH('Evolução '+({dia:'dia a dia',semana:'por semana',quinzena:'por quinzena',mes:'mês a mês'}[gran]),'Pontos verdes melhoraram contra o período anterior; vermelhos pioraram.',`<select class="inp" data-chg="evo-metric" style="width:auto" aria-label="Indicador">${opts}</select>${segHtml([['dia','Dia'],['semana','Semana'],['quinzena','Quinzena'],['mes','Mês']],gran,'evo-gran')}`)}${chart}<div class="leg" style="margin:8px 0 14px"><span><i style="background:var(--ok);border-radius:99px"></i>Melhorou</span><span><i style="background:var(--bad);border-radius:99px"></i>Piorou</span><span><i style="background:var(--n400);border-radius:99px"></i>Primeiro período / estável</span></div>${tbl}</div>`;
}

function drvDash(C,id){
  const u=S.u;const c=C.cur.byVeh[id],p=C.prev.byVeh[id];const gl=gainsLosses(C.cur,C.prev,C.price).find(x=>x.id===id);

  const strip=`<div class="card rise kpstrip sec"><div class="gblock"><span class="wm" aria-hidden="true">go</span>${gaugeNota(c.score,'NOTA GOBRAX',true)}</div>${kp('Km rodados',fmt.n(c.km,0)+' km',c.km,p&&p.km,true,0)}${kp('Média de consumo',fmt.kmpl(c.kmpl)+' km/l',c.kmpl,p&&p.kmpl,true,2)}${kp('Diesel consumido',fmt.n(c.l,0)+' L',c.l,p&&p.l,null,0)}${kp('Dias trabalhados',c.n+' dias',c.n,p&&p.n,true,0)}${kp('Km por dia',fmt.n(c.kmDay,0)+' km',c.kmDay,p&&p.kmDay,true,0)}</div>`;
  /* leitura automática */
  const reads=[];
  if(gl)reads.push({ok:gl.money>=0,t:gl.money>=0?`Gastou <b>${fmt.brl(gl.money)} a menos</b> em diesel (${fmt.n(gl.liters,0)} L) que na comparação, para os mesmos km.`:`Gastou <b>${fmt.brl(Math.abs(gl.money))} a mais</b> em diesel (${fmt.n(Math.abs(gl.liters),0)} L) que na comparação, para os mesmos km.`});
  const sc=IND.filter(i=>['br100','green','idle','score','kmpl'].includes(i.k)).map(i=>({i,v:i.get(c),f:i.get(C.cur)})).filter(x=>x.v!=null&&x.f);
  let best=null,worst=null;sc.forEach(x=>{const q=x.i.up?x.v/x.f:x.f/(x.v||1e-9);if(!best||q>best.q)best={...x,q};if(!worst||q<worst.q)worst={...x,q}});
  if(best&&best.q>1.03)reads.push({ok:true,t:`Ponto forte: <b>${esc(best.i.l)}</b> em ${fInd(best.i,best.v)}, melhor que ${fInd(best.i,best.f)} da frota.`});
  if(worst&&worst.q<.97)reads.push({ok:false,t:`Ponto de atenção: <b>${esc(worst.i.l)}</b> em ${fInd(worst.i,worst.v)}, pior que ${fInd(worst.i,worst.f)} da frota.`});

  /* radar + antes/agora/frota */

    return`<div class="abf"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>${esc(i.l)}</b><span class="xs"><b class="num">${fInd(i,a)}</b> <span class="muted">antes ${fInd(i,b)} · frota ${fInd(i,f)}</span></span></div><div class="cmt hatch"><div class="bfill" style="left:0;width:${(a||0)/mx*100}%;background:${good?'var(--ok)':'var(--bad)'}"></div>${b!=null?`<i class="before" style="left:${b/mx*100}%"></i>`:''}${f!=null?`<i class="avgl" style="left:${f/mx*100}%"></i>`:''}</div><div class="xs">${b?dl(pc(a,b),i.up===true,1)+' <span class="muted">vs. comparação</span>':''}</div></div>`}).join('');
  const rd=`<div class="grid ga sec"><div class="card rise">${cardH('Perfil de condução','Amarelo: este condutor agora. Azul: como estava. Cinza: média da frota. Quanto mais longe do centro, melhor.')}${radar(radarAxes(c,p,C.cur))}</div><div class="card rise">${cardH('Antes, agora e frota','Barra: agora; verde se melhor que a frota, vermelha se pior. Marca azul: antes. Linha tracejada: média da frota.')}<div class="stack" style="gap:14px">${bars}</div></div></div>`;
  /* calendário */

  const cb=calBlock(C,id);const cal=`<div class="card rise sec">${cardH('Calendário de desempenho',cb.sub)}${cb.html}</div>`;

  const view=u.dayView==='tabela'?`<div class="scroll-x" style="max-height:320px"><table class="tbl"><thead><tr><th>Dia</th><th class="r">${esc(ind.l)}</th><th class="r">Km</th></tr></thead><tbody>${ds.filter(d=>d.a).map(d=>`<tr><td>${fmt.dmy(d.date)}</td><td class="r num b">${fInd(ind,ind.get(d.a))}</td><td class="r num">${fmt.n(d.a.km,0)}</td></tr>`).join('')}</tbody></table></div>`
    :lineChart({labels:ds.map(d=>fmt.dm(d.date)),series:[{vals:pv,color:'var(--text)',dash:'4 4',w:1.6},{vals:cv,color:'var(--laranja)',area:true,dots:ds.length<=14,w:2.8}],yfmt:x=>fmt.n(x,ind.d),h:240,tip:k=>cv[k]!=null?`<b>${fmt.dm(ds[k].date)}</b><br>${esc(ind.l)}: ${fInd(ind,cv[k])}${pv[k]!=null?'<br>Comparação: '+fInd(ind,pv[k]):''}`:'',aria:'Evolução dia a dia'});
  const opts=IND.filter(i=>!i.veh).map(i=>`<option value="${i.k}" ${i.k===mk?'selected':''}>${esc(i.l)}</option>`).join('');
  const kmv=ds.map(d=>d.a?d.a.km:null);const kmAvg=c.n?c.km/c.n:null;
  const evo=`<div class="grid ga2 sec"><div class="card rise">${cardH('Evolução dia a dia',`${esc(ind.s)}. Passe o mouse para comparar dia a dia.`,`<select class="inp" data-chg="day-metric" style="width:auto" aria-label="Indicador">${opts}</select>${segHtml([['grafico','Gráfico'],['tabela','Tabela']],u.dayView||'grafico','day-view')}`)}<div class="leg" style="margin-bottom:6px"><span><i style="background:var(--laranja)"></i>Período analisado</span><span><i style="background:var(--n400)"></i>Comparação</span></div>${view}</div>

  return strip+lido+rd+cal+evo;
}

/* ---------- PLANO DE AÇÃO ---------- */
function vPlan(C){
  const {cur,prev,price}=C;const op=opportunities(cur,prev,price);const gl=gainsLosses(cur,prev,price);
  const losers=gl.filter(g=>g.money<0).slice(-5).reverse();
  /* gargalos: meta x atual */
  const g=[
    {l:'Média de consumo',v:cur.kmpl,m:op.ref,up:true,d:2,u:' km/l',n:'meta: 75º percentil da frota'},
    {l:'Freadas a cada 100 km',v:cur.br100,m:op.brRef,up:false,d:1,u:'',n:'meta: melhor quartil da frota'},
    {l:'Faixa verde',v:cur.green,m:60,up:true,d:1,u:'%',n:'meta: 60% do tempo'},
    {l:'Motor ocioso',v:cur.idle,m:10,up:false,d:1,u:'%',n:'meta: até 10%'},
    {l:'Nota Gobrax',v:cur.score,m:70,up:true,d:0,u:' pts',n:'meta: faixa Bom (70+)'},
    {l:'Km por dia trabalhado',v:cur.kmDay,m:op.kdRef?op.kdRef*.8:null,up:true,d:0,u:' km',n:'meta: 80% da referência'}
  ].filter(x=>x.v!=null&&x.m);
  const gar=g.map((x,i)=>{const prog=clamp(x.up?x.v/x.m:x.m/(x.v||1e-9),0,1.3);const ok=prog>=1;const w=Math.min(prog,1.3)/1.3*100;
    return`<div class="gar"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:8px"><b>${x.l}</b><span class="xs" style="white-space:nowrap"><b class="num">${fmt.n(x.v,x.d)}${x.u}</b> <span class="muted">/ meta ${fmt.n(x.m,x.d)}${x.u}</span></span></div><div class="cmt"><div class="bfill" style="--i:${i};left:0;width:${w}%;background:${ok?'var(--ok)':prog>.85?'var(--warn)':'var(--bad)'}"></div><i class="avgl" style="left:${100/1.3}%"></i></div><div class="xs muted"><span style="color:${ok?'var(--ok-t)':'inherit'};font-weight:600">${ok?'Meta atingida':`Faltam ${fmt.n(Math.abs(x.m-x.v),x.d)}${x.u}`}</span> · ${x.n}</div></div>`}).join('')||'<div class="empty"><b>Sem dados para as metas</b></div>';
  /* onde trabalhar primeiro */
  const pr=[];
  if(op.worse[0])pr.push({t:'Consumo acima da referência',n:op.worse.slice(0,3).map(w=>w.id).join(', '),v:fmt.brl(op.potential),s:`${op.worse.length} veículos abaixo de ${fmt.n(op.ref,2)} km/l`,tone:'bad',f:'down'});
  if(op.fell[0])pr.push({t:'Condutores que pioraram',n:op.fell.slice(0,3).map(w=>w.id).join(', '),v:`${op.fell.length}`,s:`${op.fell[0].id} caiu de ${fmt.n(op.fell[0].from,2)} para ${fmt.n(op.fell[0].to,2)} km/l`,tone:'bad',f:'down'});
  if(op.low[0])pr.push({t:'Pouco rendimento por dia',n:op.low.slice(0,3).map(w=>w.id).join(', '),v:`${op.low.length}`,s:`Menos de 80% de ${fmt.n(op.kdRef,0)} km por dia`,tone:'warn',f:'all'});
  if(op.brW)pr.push({t:'Freadas acima do melhor quartil',n:'',v:`${op.brW}`,s:`veículos acima de ${fmt.n(op.brRef,1)} /100 km`,tone:'warn',f:'all'});

/* ---------- MOTORISTAS · Mensagens (evolução da nota depois do aviso) ---------- */
const MSG_POINT={'Faixa verde':{get:r=>r.gr,up:true},'Motor ocioso':{get:r=>r.id,up:false},'Freadas':{get:r=>r.br!=null&&r.km?r.br/r.km*100:null,up:false}};
/* depois de um aviso: o ponto apontado melhorou nos 7 dias seguintes? */
function pointImproved(rs,t,point){
  const m=MSG_POINT[point];if(!m)return null;const avg=a=>{const v=a.map(m.get).filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
  const a=avg(rs.filter(x=>x.t>t&&x.t<=t+7)),b=avg(rs.filter(x=>x.t>t-7&&x.t<=t));if(a==null||b==null)return null;return m.up?a>b:a<b;
}
/* nota do mês acumulada até cada dia (por veículo) e nota de cada mês */
function monthScores(rs){let mk='',km=0,scw=0;const mtd={},mon={};
  rs.forEach(r=>{const m=r.date.slice(0,7);if(m!==mk){mk=m;km=0;scw=0}if(r.sc!=null){km+=r.km;scw+=r.sc*r.km}const v=km?scw/km:null;mtd[r.t]=v;if(v!=null)mon[m]=v});return{mtd,mon}}
function msgHist(C){
  const by={};for(const r of validRecs(C.cid,ST))(by[r.veh]=by[r.veh]||[]).push(r);
  if(REAL.on){
    /* mensagens que o CS ou o robô marcaram como enviadas (/mensagens/enviadas) */
    const sent=REAL.msgs[C.cid];if(!sent)return[];const out=[];
    for(const s of sent){
      const plate=C.fleet.drvPlate[nkey(s.motorista)];const rs=(by[plate]||[]).slice().sort((a,b)=>a.t-b.t);const ms=monthScores(rs);
      const msgs=(s.envios||[]).map(e=>{const t=dIdx(String(e.dia).slice(0,10));let k=null;for(const r of rs){if(r.t<=t)k=r.t;else break}
        const point=e.foco_rotulo||null;return{t,score:nv(e.nota)??(k!=null?ms.mtd[k]:null),point,imp:pointImproved(rs,t,point)}}).sort((a,b)=>a.t-b.t);
      if(!msgs.length)continue;out.push({id:plate||s.motorista,name:s.motorista,msgs,first:msgs[0],last:msgs[msgs.length-1],mon:ms.mon});
    }
    return out.sort((a,b)=>b.msgs.length-a.msgs.length||a.name.localeCompare(b.name));
  }
  const key='mh|'+C.cid+'|'+DB.ver;if(DB.cache.has(key))return DB.cache.get(key);
  const f=C.fleet;const start=Math.min(...f.vehicles.map(v=>v.from));
  const FIRST=Math.max(T0-29,start+2),LAST=T0-3;
  const out=[];
  for(const v of f.vehicles){
    const rs=(by[v.id]||[]).slice().sort((a,b)=>a.t-b.t);if(rs.length<3)continue;
    const rnd=mulberry(hs(C.cid+v.id+'msg'));const p=.4+rnd()*.45;const ms=monthScores(rs);
    const msgs=[];
    rs.forEach((r,i)=>{
      if(r.t<FIRST||r.t>LAST)return;const roll=rnd();if(roll>p&&!(msgs.length===0&&r.t===FIRST))return;
      const pr=rs[i-1];let point=null;
      if(pr){const cand=[['Faixa verde',r.gr-pr.gr],['Motor ocioso',-(r.id-pr.id)],['Freadas',-(r.br/r.km*100-pr.br/pr.km*100)]].sort((a,b)=>a[1]-b[1]);point=cand[0][0]}
      msgs.push({t:r.t,score:ms.mtd[r.t],point,imp:pointImproved(rs,r.t,point)});
    });
    if(msgs.length<2)continue;
    out.push({id:v.id,name:v.driver,msgs,first:msgs[0],last:msgs[msgs.length-1],mon:ms.mon});
  }
  out.sort((a,b)=>b.msgs.length-a.msgs.length||a.name.localeCompare(b.name));
  DB.cache.set(key,out);return out;
}

/* Diagnóstico: quanto de cada campo a API entregou para cada cliente (últimos 90 dias). Só contagens, sem nomes:

function diagCliente(c){
  const desde=dIso(T0-89);const rs=(c.registros||[]).filter(r=>String(r.dia).slice(0,10)>=desde);const rod=rs.filter(r=>r.rodou&&(+r.km||0)>0);
  const pct=f=>rod.length?Math.round(rod.filter(f).length/rod.length*100):null;const tem=k=>r=>r[k]!=null&&r[k]!=='';
  const meses=[...new Set((c.premiacoes||[]).filter(p=>p.nota!=null).map(p=>p.mes))].sort();
  return{nome:c.nome,dias:new Set(rs.map(r=>String(r.dia).slice(0,10))).size,veic:new Set(rs.map(r=>r.placa)).size,rod:rod.length,

function loadExtras(cid,force){
  if(!REAL.on)return;const f=DB.fleets[cid];if(!f)return;REAL.liveErr=REAL.liveErr||{};
  const stale=!REAL.liveAt[cid]||Date.now()-REAL.liveAt[cid]>120000;
  if((force||stale)&&!REAL.busy['live'+cid]&&f.vehicles.length){
    const first=!REAL.live[cid];REAL.busy['live'+cid]=1;
    Gobrax.api.getLive(cid).then(d=>{REAL.live[cid]=d;REAL.liveAt[cid]=Date.now();REAL.liveErr[cid]=null})
      .catch(e=>{REAL.liveErr[cid]=e.message;REAL.liveAt[cid]=Date.now()})
      .finally(()=>{REAL.busy['live'+cid]=0;if(S.client!==cid||!LASTC)return;
        if(first&&['geral','frota'].includes(CUR_ROUTE))softRender();else updateLiveMarkers()});
  }
  if(!REAL.msgs[cid]&&!REAL.busy['msg'+cid]){REAL.busy['msg'+cid]=1;
    Gobrax.api.getSent(cid).then(d=>{REAL.msgs[cid]=d||[]}).catch(()=>{REAL.msgs[cid]=[]})
      .finally(()=>{REAL.busy['msg'+cid]=0;if(S.client===cid&&CUR_ROUTE==='motoristas'&&S.u.drvTab==='mensagens')softRender()})}
  if(!REAL.phones[cid]&&!REAL.busy['ph'+cid]){REAL.busy['ph'+cid]=1;
    Gobrax.api.getPhones(cid).then(list=>{(list||[]).forEach(c=>{if(!c.telefone)return;const p=f.drvPlate[nkey(c.motorista)];if(p&&f.byId[p]&&!f.byId[p].phone)f.byId[p].phone=c.telefone})})
      .catch(()=>{}).finally(()=>{REAL.phones[cid]=true;REAL.busy['ph'+cid]=0})}
}

  'go-prem':()=>{S.u.dataTab='regras';nav('dados')},
  print:()=>window.print(),
  csv:el=>{download((el.dataset.w==='fleet'?'frota':'motoristas')+'-'+S.client+'-'+TODAY+'.csv',csvFor(LASTC,el.dataset.w),'text/csv;charset=utf-8');toast('Arquivo CSV gerado')},
  'ov-metric':el=>{S.u.ovMetric=el.dataset.v;go()},
  'ret-tab':el=>{S.u.retTab=el.dataset.v;go(true)},
  'client-open':el=>{setClient(el.dataset.id);S.u.retTab='cliente';render({skeleton:true})},
  'fleet-tab':el=>{S.u.fleetTab=el.dataset.v;if(el.dataset.v==='mapa'&&LASTC)loadExtras(LASTC.cid);go(true)},
  'fleet-filial':el=>{S.u.fleetFilial=el.dataset.v;go()},
  'fleet-rank':el=>{S.u.fleetRank=el.dataset.v;go()},
  'veh-open':el=>openVehicle(LASTC,el.dataset.id),
  'drv-tab':el=>{S.u.drvTab=el.dataset.v;go(true)},
  'drv-det':el=>{S.u.drvDet=el.dataset.v;refreshDetail()},
  'drv-sel':el=>{S.u.drvSel=el.dataset.id;refreshDetail()},
  'drv-filter':el=>{S.u.drvFilter=el.dataset.v;go()},
  'drv-open':el=>{closeOv();S.u.drvSel=el.dataset.id;S.u.drvTab='lista';S.u.drvDet='resumo';S.u.drvFilter='all';S.u.drvQ='';nav('motoristas')},
  'go-drv':el=>{closePops();S.u.drvTab='lista';S.u.drvFilter=el.dataset.f==='down'?'down':'all';S.u.drvSort=el.dataset.f==='down'?'money':'kmpl';nav('motoristas')},
  'msg-drv':el=>{S.u.msgDrv=el.dataset.id;go()},
  'msg-gran':el=>{S.u.msgGran=el.dataset.v;go()},
  'evo-gran':el=>{S.u.evoGran=el.dataset.v;go()},
  'day-view':el=>{S.u.dayView=el.dataset.v;refreshDetail()},
  'wk-wa':el=>weekWa(el,true),
  'wk-copy':el=>weekWa(el,false),
  'ind-csv':el=>{const C=LASTC,id=el.dataset.id,c=C.cur.byVeh[id],p=C.prev.byVeh[id];const rows=IND.map(i=>[i.l,fInd(i,i.get(c)),fInd(i,p?i.get(p):null),fInd(i,i.get(C.cur)),indRes(i,c,p).label]);download('indicadores-'+id+'-'+TODAY+'.csv','﻿'+[['Indicador','Período','Comparação','Média da frota','Resultado'],...rows].map(r=>r.map(csvQ).join(';')).join('\n'),'text/csv;charset=utf-8');toast('Arquivo CSV gerado')},
  'map-filter':el=>{S.u.mapFilter=el.dataset.v;applyAllFilters()},
  'map-focus':el=>mapFocus(el.dataset.id),
  'map-route':el=>mapRoute(el.dataset.id),
  'map-route-clear':()=>mapRouteClear(),
  'cmp-metric':el=>{S.u.cmpMetric=el.dataset.v;go()},
  'week-sel':el=>{S.u.weekSel=+el.dataset.v;go()},
  'prem-month':el=>{S.u.premMonth=el.dataset.v;go()},
  'msg-day':el=>{const t=Math.min(T0,dIdx(S.u.msgDay||dIso(T0-1))+ +el.dataset.v);S.u.msgDay=dIso(t);go()},
  'msg-copy':async el=>{const m=dayMessage(S.client,ST,el.dataset.v,+el.dataset.t);if(m)toast(await copyText(m.text)?'Mensagem copiada':'Não foi possível copiar')},
  'msg-wa':el=>{const m=dayMessage(S.client,ST,el.dataset.v,+el.dataset.t);const url=m&&waUrl(m.phone,m.text);if(url){window.open(url,'_blank','noopener');toast('Abrindo o WhatsApp')}},
  'data-tab':el=>{S.u.dataTab=el.dataset.v;go(true)},
  'contrato-salvar':async el=>{
    const ler=id=>{const s=String(($('#'+id)||{}).value||'').trim().replace(/\s|R\$/g,'');if(!s)return null;return Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):/^\d{1,3}(\.\d{3})+$/.test(s)?s.replace(/\./g,''):s)};
    const unit=ler('ct-valor'),units=ler('ct-qtd');
    if((unit!==null&&!(unit>0))||(units!==null&&!(units>0&&Number.isInteger(units)))){toast('Confira os números: valor maior que zero e unidades inteiras.');return}
    el.disabled=true;
    try{const r=await salvarContrato(LASTC.def,unit,units);DB.bump();toast(r===false?'Nada mudou.':'Contrato salvo: vale em todas as telas.');go()}
    catch(e){el.disabled=false;toast(/403|permiss/i.test(e.message)?'Só CS e administrador mudam o contrato.':'Não foi possível salvar: '+e.message)}
  },
};
function setClient(id){S.client=id;S.u.drvSel=null;S.u.fleetFilial='';S.u.msgDay='';S.u.msgDrv=null;S.u.weekSel=null;S.u.premMonth='';savePrefs()}

/* ---------- eventos ---------- */
function bind(){
  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-act]');
    if(!e.target.closest('.relative'))closePops();
    if(!e.target.closest('.search'))$('#sres').classList.remove('open');
    if(!el)return;const a=ACT[el.dataset.act];if(!a)return;
    if(!(el.tagName==='A'&&el.getAttribute('href')))e.preventDefault();
    if(el.dataset.act==='pop-close'){closePops();return}
    await a(el,e);
  });
  document.addEventListener('change',e=>{
    const el=e.target.closest('[data-chg]');if(!el)return;const k=el.dataset.chg;
    if(k==='drv-sort'){S.u.drvSort=el.value;go()}
    else if(k==='msg-drv'){S.u.msgDrv=el.value;go()}
    else if(k==='evo-metric'){S.u.evoMetric=el.value;go()}
    else if(k==='day-metric'){S.u.dayMetric=el.value;refreshDetail()}
    else if(k==='msg-day'){if(el.value){S.u.msgDay=el.value>TODAY?TODAY:el.value;go()}}
    else if(k==='pfrom'||k==='pto'){S.period[k==='pfrom'?'from':'to']=el.value;if(S.period.from&&S.period.to&&S.period.from<=S.period.to)go()}
  });
  document.addEventListener('input',e=>{const el=e.target.closest('[data-chg="drv-q"]');if(el){S.u.drvQ=el.value;clearTimeout(bind.t);bind.t=setTimeout(go,180)}});
  $('#clientSel').addEventListener('change',e=>{setClient(e.target.value);render({skeleton:true})});
  window.addEventListener('resize',()=>{clearTimeout(bind.rz);bind.rz=setTimeout(()=>fitCharts(document,true),180)});
  window.addEventListener('hashchange',()=>{const {path,q}=parseHash();const t=TABKEY[path];if(t&&q.aba&&t[1][q.aba]){S.u[t[0]]=t[1][q.aba]===1?q.aba:t[1][q.aba]}closeOv();closePops();$('#sidebar').classList.remove('open');render({skeleton:false})});
  /* busca global */
  const gs=$('#gs'),sres=$('#sres');
  gs.addEventListener('input',()=>{const q=gs.value.trim().toLowerCase();if(q.length<2){sres.classList.remove('open');return}
    const rs=(LASTC?LASTC.fleet.vehicles:[]).filter(v=>v.id.toLowerCase().includes(q)||v.driver.toLowerCase().includes(q)).slice(0,8);
    sres.innerHTML=rs.length?rs.map(v=>`<button data-act="gs-pick" data-id="${esc(v.id)}"><div class="ava">${initials(v.driver)}</div><div><b>${esc(v.driver)}</b><div class="xs muted">${esc(v.id)}</div></div></button>`).join(''):'<div class="empty"><b>Nada encontrado</b></div>';sres.classList.add('open')});
  gs.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('button',sres);if(b)b.click()}if(e.key==='Escape'){sres.classList.remove('open');gs.blur()}});
  ACT['gs-pick']=el=>{gs.value='';sres.classList.remove('open');ACT['drv-open'](el)};
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();gs.focus()}if(e.key==='Escape'){closeOv();closePops()}});
  /* tooltip */
  const tt=$('#tt');
  document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tt]');if(!el){tt.classList.remove('on');return}tt.innerHTML=el.getAttribute('data-tt');tt.classList.add('on')});
  document.addEventListener('mousemove',e=>{if(!tt.classList.contains('on'))return;const w=tt.offsetWidth,h=tt.offsetHeight;let x=e.clientX+14,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tt.style.left=x+'px';tt.style.top=y+'px'});
  document.addEventListener('mouseleave',()=>tt.classList.remove('on'));
  window.addEventListener('resize',()=>{placeNav();placeTabs()});
  window.addEventListener('scroll',()=>$('#topbar').classList.toggle('scrolled',scrollY>8),{passive:true});
  /* posição ao vivo: atualiza a cada 2 minutos com a aba visível */
  setInterval(()=>{if(REAL.on&&!document.hidden&&LASTC)loadExtras(LASTC.cid)},120000);
}

/* ---------- boot ---------- */
async function boot(){
  document.documentElement.dataset.theme=S.theme;
  $('#root').innerHTML=`<div class="view">${skeleton()}</div>`;
  await detectServer();
  let list=[];
  try{list=await Gobrax.api.getClients()}catch(e){$('#root').innerHTML=`<div class="view"><div class="card" style="margin-top:40px"><h2>Não foi possível carregar os dados</h2><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div></div>`;return}
  if(REAL.on){CLIENT_DEFS.length=0;list.forEach(c=>CLIENT_DEFS.push(c));try{REAL.prem=await Gobrax.api.getPremissas()}catch(e){REAL.prem=[]}}
  else for(const c of list){const d=CLIENT_DEFS.find(x=>x.id===c.id);if(d)Object.assign(d,c)}
  if(!CLIENT_DEFS.some(c=>c.id===S.client))S.client=CLIENT_DEFS[0]?CLIENT_DEFS[0].id:'';
  $('#root').innerHTML=shell();
  if(S.collapsed)$('#appRoot').classList.add('collapsed');
  bind();
  const {path,q}=parseHash();const t=TABKEY[path];if(t&&q.aba&&t[1][q.aba])S.u[t[0]]=t[1][q.aba]===1?q.aba:t[1][q.aba];
  await render({skeleton:true});
  document.fonts&&document.fonts.ready.then(()=>{placeNav();placeTabs()});
}

boot();
})();
</script>
