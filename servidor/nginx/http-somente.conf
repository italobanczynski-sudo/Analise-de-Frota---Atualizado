server {
    listen 80;
    server_name analisefrota.gobrax.com.br;

    # Certbot challenge — precisa responder em HTTP para validar o domínio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Só para gerar o certificado: em HTTP o login NÃO funciona quando URL_PUBLICA é https
    # (o cookie de sessão é Secure e o navegador o descarta). Volte ao analisefrota.conf assim que houver certificado.
    location / {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
